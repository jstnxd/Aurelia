<script>
'use strict';
/* Spiel-API und Story-Skripte (Hauptgeschichte Region 1) */
FC.game = (function () {
  const U = FC.U, D = FC.data;
  const S = () => FC.state;
  const say = (t, n) => FC.ui.say(t, n);

  function newState(name) {
    return {
      version: FC.SAVE_VERSION,
      player: { name, map: 'haus', x: 1, y: 5, dir: 'right' },
      money: 3000, party: [], box: [], bag: { trank: 1 },
      flags: {}, dex: { seen: {}, caught: {} }, taken: {}, defeated: {},
      lastHeal: { map: 'haus', x: 5, y: 4, dir: 'up' },
      playtime: 0, createdAt: Date.now(),
    };
  }
  function flag(k) { return !!S().flags[k]; }
  function setFlag(k, v = true) { S().flags[k] = v; }
  function seen(sp) { S().dex.seen[sp] = true; }
  function caught(sp) { S().dex.seen[sp] = true; S().dex.caught[sp] = true; }

  async function give(item, qty = 1, from) {
    const s = S();
    s.bag[item] = (s.bag[item] || 0) + qty;
    FC.audio.jingle('item');
    await say(`${s.player.name} erhält ${qty > 1 ? qty + '× ' : ''}${D.ITEMS[item].n}!`, from);
  }
  function addMon(m) {
    const s = S();
    caught(m.sp);
    if (s.party.length < 6) { s.party.push(m); return 'party'; }
    s.box.push(m); return 'box';
  }
  function healParty() { for (const m of S().party) FC.mon.heal(m); }
  function alive() { return S().party.filter(m => m.hp > 0); }

  async function healScene(text, who) {
    await FC.ui.fade(true, true, 200);
    healParty();
    const ms = FC.audio.jingle('heal');
    await U.wait(Math.max(600, ms));
    await FC.ui.fade(false, true, 200);
    if (text) await say(text, who);
  }

  async function trainerBattle(key, npc) {
    const s = S(), t = D.TRAINERS[key];
    const team = t.team(s).map(([sp, l]) => FC.mon.create(sp, l));
    const res = await FC.battle.start({ kind: 'trainer', team, trainer: t, key, music: t.leader ? 'boss' : 'battle' });
    if (res === 'win') s.defeated[key] = true;
    return res;
  }
  async function trainer(npc) {
    const key = npc.def.trainer, t = D.TRAINERS[key], s = S();
    if (s.defeated[key]) { await say(t.after || '…', npc.def.name || t.name); return; }
    if (!alive().length) { await say('Du hast keine kampffähigen Monster!'); return; }
    if (t.intro) await say(t.intro, t.name);
    const res = await trainerBattle(key, npc);
    if (res === 'win') {
      if (key === 'gym_petra') await badgeScene();
      else FC.save && FC.game.autosave();
    }
  }
  async function badgeScene() {
    const s = S();
    setFlag('badge1');
    FC.audio.jingle('badge');
    await say(`${s.player.name} erhält den FELSORDEN von Petra!`);
    await say(D.TRAINERS.gym_petra.after, 'Petra');
    await say(['Herzlichen Glückwunsch! Du hast die erste Arena von Aurelia gemeistert.', 'Neu freigeschaltet: Kai wartet in Kieselstadt auf eine Revanche, und in Morgentau soll es etwas Seltenes zu entdecken geben …']);
    FC.ui.toast('Felsorden erhalten! Optionale Herausforderungen freigeschaltet.', 3600);
    FC.game.autosave();
  }

  async function blackout(noPenalty) {
    const s = S();
    if (!noPenalty) {
      const lost = Math.floor(s.money / 2);
      s.money -= lost;
      await say([`${s.player.name} hat keine kampffähigen Monster mehr!`, `${s.player.name} verliert ${U.money(lost)} und flieht zurück …`]);
    }
    await FC.ui.fade(true);
    healParty();
    const h = s.lastHeal;
    FC.world.load(h.map, h.x, h.y, h.dir);
    await FC.ui.fade(false);
    if (!noPenalty) await say('Deine Monster wurden geheilt. Pass beim nächsten Mal besser auf!');
    FC.game.autosave();
  }

  function autosave() {
    const s = S();
    if (!s || !FC.slot) return;
    FC.world.syncPlayer();
    if (FC.save.write(FC.slot, s)) FC.save.setLastSlot(FC.slot);
  }

  /* ───── Story-Skripte ───── */
  const SCRIPTS = {
    async gateCheck() {
      if (flag('starter')) return;
      await say(['Halt! Warte!', 'Ohne eigenes Monster ist das hohe Gras viel zu gefährlich. Komm zuerst in mein Labor!'], 'Prof. Linde (ruft)');
      await FC.world.forceStep('down');
    },
    async mom() {
      if (!flag('starter')) {
        await say(['Guten Morgen, {name}! Gut geschlafen?', 'Prof. Linde hat vorhin nach dir gefragt. Ihr Labor ist das Gebäude mit dem blauen Dach – gleich südöstlich von hier.', 'Heute bekommst du dein erstes Monster, nicht wahr? Ich bin so stolz auf dich!'], 'Mama');
        return;
      }
      await say('Du siehst erschöpft aus, {name}. Ruh dich kurz aus!', 'Mama');
      S().lastHeal = { map: 'haus', x: 5, y: 4, dir: 'up' };
      await healScene('Deine Monster sind wieder fit! Pass gut auf dich auf.', 'Mama');
      autosave();
    },
    async neighbor() {
      if (!flag('lenaGift')) {
        await say(['Oh, hallo {name}! Du ziehst heute los? Wie aufregend!', 'Hier, nimm das mit. Für Notfälle.'], 'Lena');
        setFlag('lenaGift');
        await give('trank', 2, 'Lena');
        return;
      }
      await say('Wenn ein Monster müde ist, kannst du es auch im Menü unter „Tasche“ mit einem Trank heilen.', 'Lena');
    },
    async oldPond() {
      if (flag('badge1') && !flag('schimmerl')) { await say(['Siehst du das? Über dem Teich schimmert es wieder!', 'Man sagt, es sei ein seltenes Geister-Monster. Trau dich ruhig, aber sei vorsichtig.'], 'Opa Gustav'); return; }
      await say(['Ich sitze hier jeden Tag und schaue auf den Teich.', 'Manchmal, nachdem ein starker Trainer durchs Dorf kam, sehe ich ein seltsames Schimmern über dem Wasser …'], 'Opa Gustav');
    },
    async prof() {
      const s = S();
      if (!flag('metProf')) {
        await say(['Ah, {name}! Da bist du ja endlich!', 'Ich bin Prof. Linde und erforsche die Monster der Region Aurelia.', 'Auf dem Tisch liegen drei Fangkapseln. In jeder schläft ein junges Monster.', 'Eines davon gehört ab heute dir. Schau sie dir in Ruhe an und wähle weise!'], 'Prof. Linde');
        setFlag('metProf');
        return;
      }
      if (!flag('starter')) { await say('Nur Mut! Stell dich vor den Tisch und schau dir die Kapseln an.', 'Prof. Linde'); return; }
      if (flag('badge1') && !flag('profGift2')) {
        await say(['Du hast Petra besiegt? Fantastisch!', 'Als Belohnung bekommst du diese hier. Damit fängst du auch hartnäckige Monster.'], 'Prof. Linde');
        setFlag('profGift2');
        await give('superkapsel', 5, 'Prof. Linde');
        return;
      }
      const n = Object.keys(s.dex.caught).length, sn = Object.keys(s.dex.seen).length;
      const verdict = n < 4 ? 'Ein guter Anfang! Geh ins hohe Gras und fang noch mehr Monster.' : n < 8 ? 'Sehr ordentlich! Du wirst ein richtiger Forscher.' : n < 12 ? 'Beeindruckend! Manche Monster entdeckt man nur in entwickelter Form.' : 'Unglaublich! Du kennst die Region besser als ich!';
      await say([`Lass mal dein Bestiarium sehen … ${sn} gesehen, ${n} gefangen.`, verdict], 'Prof. Linde');
    },
    async kaiLab() {
      if (!flag('starter')) { await say(['Yo, {name}! Ich bin schon eine Ewigkeit hier.', 'Prof. Linde sagt, ich darf erst wählen, wenn du dir eins ausgesucht hast. Beeil dich!'], 'Kai'); return; }
      await say('Wir sehen uns!', 'Kai');
    },
    async starter(obj) {
      const s = S(), sp = obj.def.sp, M = D.MON[sp];
      if (flag('starter')) { await say('In dieser Kapsel schläft ein Monster, um das sich Prof. Linde kümmert.'); return; }
      if (!flag('metProf')) { FC.world.faceNpc('prof', 'down'); await SCRIPTS.prof(); }
      const close = FC.ui.monCard(sp);
      const types = M.t.map(t => D.TYPES[t].n).join('/');
      const yes = await FC.ui.yesNo([`Das ist ${M.n}, ein Monster vom Typ ${types}.`, `Willst du ${M.n} als Partner wählen?`], 'Prof. Linde');
      close();
      if (!yes) return;
      const rivalSp = { 1: 4, 4: 7, 7: 1 }[sp];
      setFlag('starter'); setFlag('starterSp', sp);
      addMon(FC.mon.create(sp, 5));
      FC.world.refreshObjects();
      FC.audio.jingle('item');
      await say(`${s.player.name} erhält ${M.n}!`);
      setFlag('rivalSp', rivalSp);
      FC.world.refreshObjects();
      await say(['Dann nehme ich das hier!', `${D.MON[rivalSp].n} hat einen Typvorteil gegen dein ${M.n}. Hehe!`], 'Kai');
      seen(rivalSp);
      await say('Komm schon, {name}! Lass uns sofort testen, wer das bessere Monster hat!', 'Kai');
      const res = await trainerBattle('lab_kai');
      FC.world.faceNpc('kai_lab', 'down');
      if (res === 'win') await say(['Grr … Okay, das war Anfängerglück!', 'Ich trainiere jetzt auf Route 1. Wir sehen uns, {name}!'], 'Kai');
      else await say(['Siehst du? Ich bin einfach besser!', 'Aber du hast dich gut geschlagen. Wir sehen uns, {name}!'], 'Kai');
      await FC.world.walkNpc('kai_lab', ['down', 'down', 'down', 'down', 'down']);
      setFlag('rivalDone');
      FC.world.refreshNpcs();
      await say(['Was für ein spannender Kampf! Deine Monster sind erschöpft – einen Moment …'], 'Prof. Linde');
      await healScene();
      await say(['So, wieder topfit!', 'Nimm diese Fangkapseln. Damit kannst du wilde Monster im hohen Gras fangen.'], 'Prof. Linde');
      await give('kapsel', 5, 'Prof. Linde');
      setFlag('dex');
      await say(['Außerdem habe ich dein Bestiarium freigeschaltet. Es zeichnet jedes Monster auf, das du siehst oder fängst.', 'Dein erstes Ziel ist die Arena in Kieselstadt – nördlich über Route 1. Viel Glück, {name}!'], 'Prof. Linde');
      autosave();
    },
    async sparkle(obj) {
      await say(['Ein geheimnisvolles Licht schwebt über dem Ufer …', 'Es kommt näher!']);
      const m = FC.mon.create(21, 15);
      const res = await FC.battle.start({ kind: 'wild', team: [m], music: 'boss', special: true });
      if (res === 'caught' || res === 'win') { setFlag('schimmerl'); FC.world.refreshObjects(); }
      if (res === 'win') await say('Das Licht ist verschwunden …');
      autosave();
    },
    async nurse() {
      const s = S();
      const yes = await FC.ui.yesNo(['Willkommen in der Heilstation!', 'Sollen wir deine Monster wieder fit machen?'], 'Schwester Alma');
      if (!yes) { await say('Komm jederzeit wieder!', 'Schwester Alma'); return; }
      await say('Einen Moment bitte …', 'Schwester Alma');
      s.lastHeal = { map: 'heilstation', x: 5, y: 3, dir: 'up' };
      await healScene('Fertig! Deine Monster sind wieder topfit. Bis bald!', 'Schwester Alma');
      autosave();
    },
    async shop() {
      await say('Willkommen! Was darf es sein?', 'Verkäufer');
      await FC.menu.shop();
    },
    async guide() {
      await say(['Hey, zukünftiger Champion!', 'Petra kämpft mit Gesteins-Monstern. Wasser-, Pflanzen- und Psycho-Attacken sind sehr effektiv.', 'Feuer-, Flug- und Käfer-Monster haben es dagegen schwer. Viel Erfolg!'], 'Arena-Guide');
    },
    async pc() { await FC.menu.pc(); },
  };

  async function run(name, ctx) {
    const fn = SCRIPTS[name];
    if (fn) await fn(ctx);
  }

  async function intro() {
    await say(['Hallo! Willkommen in der Welt der Monster!', 'Mein Name ist Linde. Man nennt mich die Monster-Professorin der Region Aurelia.', 'Menschen und Monster leben hier Seite an Seite – sie spielen, arbeiten und kämpfen gemeinsam.', 'Aber verrate mir zuerst: Wie heißt du?'], 'Prof. Linde');
    const name = await FC.ui.prompt('Wie heißt du?', 'Alex', 10);
    S().player.name = name;
    await say([`${name}, also! Ein schöner Name.`, 'Dein eigenes Abenteuer beginnt genau jetzt. Besuch mich gleich in meinem Labor in Morgentau!'], 'Prof. Linde');
  }

  return { newState, flag, setFlag, seen, caught, give, addMon, healParty, alive, trainer, trainerBattle, blackout, autosave, run, intro, SCRIPTS };
})();

<script>
'use strict';
/* Oberwelt: Karten laden, Bewegung, Kollision, NPCs, Trainer-Sichtlinien, Begegnungen, Rendering */
FC.world = (function () {
  const U = FC.U, D = FC.data, G = FC.gfx, T = 16;
  const SOLID = new Set('T~RF#WCBPHtbX'.split(''));
  const FLOOR_ENV = { haus: 'wood', nachbar: 'wood', labor: 'lab', heilstation: 'tile', laden: 'tile', arena: 'stone' };
  const WALK = 4.2, RUN = 8.5, NPC_SPEED = 3.2;

  const W = {
    map: null, npcs: [], objects: [], items: [],
    player: { x: 0, y: 0, fx: 0, fy: 0, dir: 'down', moving: false, t: 0, speed: WALK, parity: 0 },
    locked: 0, autoPath: null, autoInteract: null, tapMark: null,
    cam: { x: 0, y: 0 }, time: 0, noEncounter: 0, weather: 'none', particles: [], lastBump: 0,
  };

  /* ───── Karte aufbauen ───── */
  function build(id) {
    const def = D.MAPS[id];
    const rows = def.rows, w = rows[0].length, h = rows.length;
    const m = { id, def, w, h, env: def.indoor ? (FLOOR_ENV[id] || 'wood') : 'out', doors: {}, warps: {}, triggers: {}, signs: {} };
    m.tile = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? null : rows[y][x]);
    m.solid = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (SOLID.has(rows[y][x])) m.solid[y * w + x] = 1;
    for (const b of def.buildings || []) {
      for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) m.solid[y * w + x] = 1;
      const dy = b.y + b.h - 1;
      m.solid[dy * w + b.door] = 0;
      m.doors[b.door + ',' + dy] = b.to;
    }
    for (const s of def.signs || []) { m.solid[s.y * w + s.x] = 1; m.signs[s.x + ',' + s.y] = s; }
    for (const wp of def.warps || []) m.warps[wp.x + ',' + wp.y] = wp.to;
    for (const tr of def.triggers || []) m.triggers[tr.x + ',' + tr.y] = tr;
    const hasWater = rows.some(r => r.includes('~'));
    m.frames = [G.renderMap(m, m.env, 0)];
    if (hasWater) m.frames.push(G.renderMap(m, m.env, 1));
    return m;
  }
  const mapCache = {};
  function getMap(id) { return mapCache[id] || (mapCache[id] = build(id)); }

  function load(id, x, y, dir) {
    const prev = W.map && W.map.id;
    W.map = getMap(id);
    const p = W.player;
    Object.assign(p, { x, y, fx: x, fy: y, dir: dir || p.dir, moving: false, t: 0 });
    W.npcs = []; W.objects = []; W.autoPath = null; W.autoInteract = null; W.tapMark = null;
    refreshNpcs(); refreshObjects();
    const s = FC.state;
    W.items = (W.map.def.items || []).filter(it => !s.taken[it.id]).map(it => Object.assign({}, it));
    const wl = W.map.def.weather;
    W.weather = Array.isArray(wl) ? U.pick(wl) : wl || 'none';
    W.particles = [];
    FC.audio.play(W.map.def.music || 'town');
    if (prev !== id) FC.ui.mapName(W.map.def.name);
    syncPlayer();
    snapCamera();
  }
  function syncPlayer() {
    if (!FC.state || !W.map) return;
    const p = W.player;
    Object.assign(FC.state.player, { map: W.map.id, x: p.x, y: p.y, dir: p.dir });
  }

  function mkEntity(def) {
    return { def, id: def.id, x: def.x, y: def.y, fx: def.x, fy: def.y, ox: def.x, oy: def.y, dir: def.dir || 'down', look: def.look, moving: false, t: 0, speed: NPC_SPEED, parity: 0, nextWander: W.time + 1000 + Math.random() * 2500, emote: 0 };
  }
  function refreshNpcs() {
    const s = FC.state;
    for (const def of W.map.def.npcs || []) {
      const should = !def.cond || def.cond(s);
      const idx = W.npcs.findIndex(n => n.id === def.id);
      if (should && idx < 0) W.npcs.push(mkEntity(def));
      if (!should && idx >= 0) W.npcs.splice(idx, 1);
    }
  }
  function refreshObjects() {
    const s = FC.state;
    W.objects = (W.map.def.objects || []).filter(o => !o.cond || o.cond(s)).map(o => ({ def: o, x: o.x, y: o.y }));
  }

  /* ───── Abfragen ───── */
  const npcAt = (x, y) => W.npcs.find(n => n.x === x && n.y === y);
  const objAt = (x, y) => W.objects.find(o => o.x === x && o.y === y);
  const itemAt = (x, y, hidden) => W.items.find(i => i.x === x && i.y === y && !!i.hidden === !!hidden);
  function blocked(x, y, forNpc) {
    const m = W.map;
    if (x < 0 || y < 0 || x >= m.w || y >= m.h) return true;
    if (m.solid[y * m.w + x]) return true;
    if (npcAt(x, y) || objAt(x, y) || itemAt(x, y, false)) return true;
    if (forNpc && W.player.x === x && W.player.y === y) return true;
    if (forNpc && (m.warps[x + ',' + y] || m.doors[x + ',' + y])) return true;
    return false;
  }

  /* ───── Bewegung ───── */
  function startMove(e, dir, speed) {
    const [dx, dy] = U.DIRS[dir];
    e.dir = dir; e.fx = e.x; e.fy = e.y; e.x += dx; e.y += dy;
    e.moving = true; e.t = 0; e.speed = speed; e.parity ^= 1;
  }
  function frameOf(e) { return e.moving && e.t < 0.6 ? (e.parity ? 1 : 2) : 0; }
  function rpos(e) { const t = e.moving ? e.t : 1; return [(e.fx + (e.x - e.fx) * t) * T, (e.fy + (e.y - e.fy) * t) * T]; }

  async function lockRun(fn) {
    W.locked++;
    try { await fn(); }
    catch (err) { console.error(err); }
    finally { W.locked = Math.max(0, W.locked - 1); }
  }

  function tryMove(dir) {
    const p = W.player;
    p.dir = dir;
    const [dx, dy] = U.DIRS[dir];
    const tx = p.x + dx, ty = p.y + dy;
    if (blocked(tx, ty)) {
      if (W.time - W.lastBump > 320) { FC.audio.sfx('bump'); W.lastBump = W.time; }
      if (W.autoPath) { W.autoPath = null; }
      return;
    }
    startMove(p, dir, FC.input.held.b ? RUN : WALK);
  }

  function updatePlayer(dt) {
    const p = W.player;
    if (p.moving) {
      p.t += (dt / 1000) * p.speed;
      if (p.t >= 1) { p.t = 1; p.moving = false; p.fx = p.x; p.fy = p.y; onArrive(); }
      return;
    }
    if (W.locked || !FC.input.isTop(layer)) return;
    let dir = FC.input.dir();
    if (dir) { W.autoPath = null; W.autoInteract = null; }
    else if (W.autoPath && W.autoPath.length) dir = W.autoPath.shift();
    else if (W.autoPath && !W.autoPath.length) {
      W.autoPath = null; W.tapMark = null;
      if (W.autoInteract) { p.dir = W.autoInteract; W.autoInteract = null; interact(); }
      return;
    }
    if (dir) tryMove(dir);
  }

  function onArrive() {
    const p = W.player, m = W.map, k = p.x + ',' + p.y;
    syncPlayer();
    if (W.tapMark && W.tapMark.x === p.x && W.tapMark.y === p.y) W.tapMark = null;
    const door = m.doors[k], warp = m.warps[k];
    if (door || warp) { W.autoPath = null; lockRun(() => warpTo(door || warp, !!door || m.def.indoor)); return; }
    const trig = m.triggers[k];
    if (trig) { W.autoPath = null; lockRun(() => FC.game.run(trig.run, trig)); return; }
    if (checkTrainers()) return;
    if (m.tile(p.x, p.y) === 'G') {
      W.particles.push({ kind: 'rustle', x: p.x * T + 8, y: p.y * T + 12, life: 300, max: 300 });
      const enc = m.def.encounters;
      if (enc && W.noEncounter <= 0 && FC.game.alive().length && U.chance(enc.rate)) {
        W.autoPath = null;
        lockRun(wildBattle);
        return;
      }
    }
    if (W.noEncounter > 0) W.noEncounter--;
  }

  async function warpTo(to, door) {
    const [id, x, y, dir] = to;
    FC.audio.sfx(door ? 'door' : 'blip');
    await FC.ui.fade(true, false, door ? 220 : 160);
    load(id, x, y, dir);
    await U.wait(60);
    await FC.ui.fade(false, false, door ? 220 : 160);
    FC.game.autosave();
  }
  async function forceStep(dir) {
    const p = W.player;
    const [dx, dy] = U.DIRS[dir];
    if (blocked(p.x + dx, p.y + dy)) return;
    startMove(p, dir, WALK);
    await new Promise(r => { const chk = () => (p.moving ? requestAnimationFrame(chk) : r()); chk(); });
  }

  async function wildBattle() {
    const enc = W.map.def.encounters;
    const [sp, lo, hi] = U.weighted(enc.table.map(e => [e, e[3]]));
    const mon = FC.mon.create(sp, U.ri(lo, hi));
    await FC.battle.start({ kind: 'wild', team: [mon], weather: W.weather });
    W.noEncounter = 3;
  }

  /* ───── Trainer-Sichtlinien ───── */
  function checkTrainers() {
    const p = W.player, s = FC.state;
    for (const n of W.npcs) {
      const key = n.def.trainer;
      if (!key || !n.def.sight || s.defeated[key] || n.moving) continue;
      const [dx, dy] = U.DIRS[n.dir];
      let seen = false, dist = 0;
      for (let i = 1; i <= n.def.sight; i++) {
        const x = n.x + dx * i, y = n.y + dy * i;
        if (x === p.x && y === p.y) { seen = true; dist = i; break; }
        if (blocked(x, y)) break;
      }
      if (seen) { W.autoPath = null; lockRun(() => trainerApproach(n, dist)); return true; }
    }
    return false;
  }
  async function trainerApproach(n, dist) {
    n.emote = 900;
    FC.audio.sfx('exclaim');
    await U.wait(800);
    for (let i = 1; i < dist; i++) await stepNpc(n, n.dir);
    W.player.dir = U.OPP[n.dir];
    await FC.game.trainer(n);
  }
  function stepNpc(n, dir) {
    return new Promise(res => {
      const [dx, dy] = U.DIRS[dir];
      if (blocked(n.x + dx, n.y + dy, true)) { n.dir = dir; res(); return; }
      startMove(n, dir, NPC_SPEED);
      n.onDone = res;
    });
  }
  async function walkNpc(id, dirs) {
    const n = W.npcs.find(x => x.id === id);
    if (!n) return;
    for (const d of dirs) await stepNpc(n, d);
  }
  function faceNpc(id, dir) { const n = W.npcs.find(x => x.id === id); if (n) n.dir = dir; }

  function updateNpcs(dt) {
    for (const n of W.npcs) {
      if (n.emote > 0) n.emote -= dt;
      if (n.moving) {
        n.t += (dt / 1000) * n.speed;
        if (n.t >= 1) { n.t = 1; n.moving = false; n.fx = n.x; n.fy = n.y; if (n.onDone) { const f = n.onDone; n.onDone = null; f(); } }
        continue;
      }
      if (n.def.wander && !W.locked && W.time > n.nextWander && FC.input.isTop(layer)) {
        n.nextWander = W.time + 1500 + Math.random() * 2600;
        const dir = U.pick(['up', 'down', 'left', 'right']);
        const [dx, dy] = U.DIRS[dir];
        const tx = n.x + dx, ty = n.y + dy;
        if (Math.abs(tx - n.ox) <= 2 && Math.abs(ty - n.oy) <= 2 && !blocked(tx, ty, true)) startMove(n, dir, 2.2);
        else n.dir = dir;
      }
    }
  }

  /* ───── Interaktion ───── */
  function interact() {
    if (!W.map || W.locked || W.player.moving) return;
    const p = W.player, m = W.map;
    const [dx, dy] = U.DIRS[p.dir];
    let fx = p.x + dx, fy = p.y + dy;
    lockRun(async () => {
      const it = itemAt(fx, fy, false);
      if (it) return pickUp(it);
      const ob = objAt(fx, fy);
      if (ob) return FC.game.run(ob.def.run, ob);
      let n = npcAt(fx, fy);
      if (!n && (m.tile(fx, fy) === 'C' || m.tile(fx, fy) === 't')) n = npcAt(fx + dx, fy + dy);
      if (n) return talk(n);
      const sg = m.signs[fx + ',' + fy];
      if (sg) return FC.ui.say(sg.text.split('\n').join(' – '));
      const t = m.tile(fx, fy);
      if (t === 'P') return FC.game.run('pc');
      if (t === 'H') return FC.ui.say('Ein Heilgerät. Es summt leise.');
      if (t === 'B') return FC.ui.say(U.pick(['Bücher über Monster-Typen und ihre Schwächen.', 'Ein dickes Buch: „Die Monster von Aurelia, Band 1“.', 'Lauter Notizen über Entwicklungen.']));
      if (t === '~') return FC.ui.say('Das Wasser ist klar und kühl.');
      const hid = itemAt(fx, fy, true);
      if (hid) return pickUp(hid, true);
    });
  }
  async function pickUp(it, hidden) {
    FC.state.taken[it.id] = true;
    W.items = W.items.filter(i => i !== it);
    if (hidden) await FC.ui.say('Da liegt etwas versteckt!');
    await FC.game.give(it.item, it.qty || 1);
  }
  async function talk(n) {
    if (!n.moving) n.dir = U.OPP[W.player.dir];
    if (n.def.trainer) return FC.game.trainer(n);
    if (n.def.talk) return FC.game.run(n.def.talk, n);
    if (n.def.text) return FC.ui.say(n.def.text, n.def.name);
  }

  /* ───── Antippen → automatisch hinlaufen ───── */
  function onTap(cx, cy) {
    if (W.locked || !W.map) return;
    const dpr = FC.view.dpr, sc = FC.view.scale;
    const lx = (cx * dpr) / sc + W.cam.x, ly = (cy * dpr) / sc + W.cam.y;
    const tx = Math.floor(lx / T), ty = Math.floor(ly / T);
    const p = W.player;
    if (tx === p.x && ty === p.y) { interact(); return; }
    const m = W.map;
    if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h) return;
    const interesting = npcAt(tx, ty) || objAt(tx, ty) || itemAt(tx, ty, false) || m.signs[tx + ',' + ty] || 'CPHB~'.includes(m.tile(tx, ty));
    // Nachbarfeld: direkt interagieren
    if (Math.abs(tx - p.x) + Math.abs(ty - p.y) === 1 && interesting) {
      p.dir = tx > p.x ? 'right' : tx < p.x ? 'left' : ty > p.y ? 'down' : 'up';
      interact(); return;
    }
    let goal = null, faceDir = null;
    if (!blocked(tx, ty) || m.doors[tx + ',' + ty] || m.warps[tx + ',' + ty]) goal = [[tx, ty, null]];
    else if (interesting) {
      // Theke: zwei Felder vor dem NPC
      goal = [];
      for (const [d, [dx, dy]] of Object.entries(U.DIRS)) {
        goal.push([tx - dx, ty - dy, d]);
        if (m.tile(tx - dx, ty - dy) === 'C') goal.push([tx - 2 * dx, ty - 2 * dy, d]);
      }
    }
    if (!goal) return;
    const path = bfs(p.x, p.y, goal);
    if (!path) { FC.audio.sfx('bump'); return; }
    W.autoPath = path.dirs; W.autoInteract = path.face;
    W.tapMark = { x: path.x, y: path.y, t: 0 };
  }
  function bfs(sx, sy, goals) {
    const m = W.map, w = m.w;
    const goalMap = new Map(goals.map(([x, y, d]) => [y * w + x, d]));
    const prev = new Int32Array(w * m.h).fill(-2);
    const q = [sy * w + sx]; prev[sy * w + sx] = -1;
    const dirs = [['up', 0, -1], ['down', 0, 1], ['left', -1, 0], ['right', 1, 0]];
    while (q.length) {
      const c = q.shift(), cx = c % w, cy = (c - cx) / w;
      if (goalMap.has(c) && c !== sy * w + sx) {
        const out = []; let k = c;
        while (prev[k] !== -1) { const pk = prev[k], px = pk % w, py = (pk - px) / w; const kx = k % w, ky = (k - kx) / w; out.unshift(kx > px ? 'right' : kx < px ? 'left' : ky > py ? 'down' : 'up'); k = pk; }
        return { dirs: out, face: goalMap.get(c), x: cx, y: cy };
      }
      if (goalMap.has(c) && c === sy * w + sx) return { dirs: [], face: goalMap.get(c), x: cx, y: cy };
      for (const [, dx, dy] of dirs) {
        const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= m.h) continue;
        const ni = ny * w + nx;
        if (prev[ni] !== -2) continue;
        const isGoal = goalMap.has(ni);
        const passable = !blocked(nx, ny);
        if (!passable && !isGoal) continue;
        if (!passable && isGoal && !(m.doors[nx + ',' + ny] || m.warps[nx + ',' + ny])) continue;
        // Warps nur betreten, wenn sie das Ziel sind
        if ((m.doors[nx + ',' + ny] || m.warps[nx + ',' + ny]) && !isGoal) continue;
        prev[ni] = c; q.push(ni);
      }
    }
    return null;
  }

  /* ───── Wetter ───── */
  function updateWeather(dt, vw, vh) {
    const P = W.particles;
    if (W.weather === 'rain' && P.length < 90) for (let i = 0; i < 3; i++) P.push({ kind: 'rain', x: W.cam.x + Math.random() * (vw + 40) - 20, y: W.cam.y - 10 - Math.random() * 40, vx: -40, vy: 260, life: 1400, max: 1400 });
    if (W.weather === 'leaves' && P.length < 14 && Math.random() < 0.04) P.push({ kind: 'leaf', x: W.cam.x + Math.random() * vw, y: W.cam.y - 8, vx: 10 + Math.random() * 14, vy: 16 + Math.random() * 12, life: 9000, max: 9000, ph: Math.random() * 6, col: U.pick(['#f0a040', '#e86a3a', '#f8d060', '#9ad060']) });
    for (const q of P) {
      q.life -= dt;
      if (q.vx !== undefined) { q.x += (q.vx * dt) / 1000 + (q.kind === 'leaf' ? Math.sin(W.time / 400 + q.ph) * 0.3 : 0); q.y += (q.vy * dt) / 1000; }
    }
    W.particles = P.filter(q => q.life > 0 && q.y < W.cam.y + vh + 20);
  }

  /* ───── Kamera & Rendering ───── */
  function camTarget(vw, vh) {
    const m = W.map, [px, py] = rpos(W.player);
    let cx = px + 8 - vw / 2, cy = py + 8 - vh / 2;
    const mw = m.w * T, mh = m.h * T;
    cx = mw <= vw ? (mw - vw) / 2 : U.clamp(cx, 0, mw - vw);
    cy = mh <= vh ? (mh - vh) / 2 : U.clamp(cy, 0, mh - vh);
    return [Math.round(cx), Math.round(cy)];
  }
  function snapCamera() { if (FC.view) { const [x, y] = camTarget(FC.view.w, FC.view.h); W.cam.x = x; W.cam.y = y; } }

  function drawEntity(x, e, look) {
    const [px, py] = rpos(e);
    const sx = Math.round(px), sy = Math.round(py);
    x.fillStyle = 'rgba(20,16,30,.28)';
    x.fillRect(sx + 3, sy + 13, 10, 2); x.fillRect(sx + 4, sy + 15, 8, 1);
    x.drawImage(G.charFrame(look, e.dir, frameOf(e)), sx, sy - 5);
    const tx = Math.round(px / T), ty = Math.round(py / T);
    if (W.map.tile(tx, ty) === 'G' && (!e.moving || e.t > 0.25)) x.drawImage(G.grassOverlay, sx, sy);
    if (e.emote > 0) x.drawImage(G.emote, sx + 2, sy - 20);
  }

  function render(x, vw, vh) {
    const m = W.map;
    if (!m) return;
    const [tcx, tcy] = camTarget(vw, vh);
    W.cam.x = tcx; W.cam.y = tcy;
    x.fillStyle = '#0c0a12'; x.fillRect(0, 0, vw, vh);
    x.save();
    x.translate(-W.cam.x, -W.cam.y);
    const f = m.frames[m.frames.length > 1 ? Math.floor(W.time / 650) % 2 : 0];
    x.drawImage(f, 0, 0);
    // Tipp-Markierung
    if (W.tapMark) {
      const a = 0.5 + 0.5 * Math.sin(W.time / 120);
      x.strokeStyle = `rgba(255,255,255,${0.4 + a * 0.5})`; x.lineWidth = 1;
      x.strokeRect(W.tapMark.x * T + 1.5, W.tapMark.y * T + 1.5, 13, 13);
    }
    // Gegenstände
    for (const it of W.items) if (!it.hidden) {
      x.fillStyle = 'rgba(20,16,30,.25)'; x.fillRect(it.x * T + 4, it.y * T + 12, 8, 2);
      G.capsule(x, it.x * T + 8, it.y * T + 8 + Math.round(Math.sin(W.time / 300 + it.x) * 0.6), D.ITEMS[it.item].kind === 'ball' ? D.ITEMS[it.item].c : '#2ab0a0', true);
    }
    // Objekte
    for (const o of W.objects) {
      const ox = o.x * T, oy = o.y * T;
      if (o.def.kind === 'starter') {
        const col = { 1: '#e8603a', 4: '#3f86e8', 7: '#4cad40' }[o.def.sp];
        G.capsule(x, ox + 8, oy + 7, col);
      } else if (o.def.kind === 'sparkle') {
        const ph = (W.time / 200) % (Math.PI * 2), r = 3 + Math.sin(ph) * 1.5;
        x.fillStyle = 'rgba(200,180,255,.35)'; x.beginPath(); x.arc(ox + 8, oy + 8, 6 + Math.sin(ph) * 2, 0, Math.PI * 2); x.fill();
        x.fillStyle = '#fff';
        x.fillRect(ox + 8 - r, oy + 7, r * 2 + 1, 1); x.fillRect(ox + 8, oy + 7 - r, 1, r * 2 + 1);
        x.fillStyle = '#e8d8ff'; x.fillRect(ox + 7, oy + 6, 3, 3);
      }
    }
    // Figuren nach Tiefe sortiert
    const ents = W.npcs.map(n => [n, n.look]).concat([[W.player, 'player']]);
    ents.sort((a, b) => rpos(a[0])[1] - rpos(b[0])[1]);
    for (const [e, look] of ents) drawEntity(x, e, look);
    // Partikel
    for (const q of W.particles) {
      if (q.kind === 'rain') { x.fillStyle = 'rgba(200,225,255,.7)'; x.fillRect(Math.round(q.x), Math.round(q.y), 1, 4); }
      else if (q.kind === 'leaf') { x.fillStyle = q.col; x.fillRect(Math.round(q.x), Math.round(q.y), 2, 1); x.fillRect(Math.round(q.x) + 1, Math.round(q.y) + 1, 1, 1); }
      else if (q.kind === 'rustle') { const k = 1 - q.life / q.max; x.fillStyle = '#8ae060'; for (const s of [-1, 1]) x.fillRect(Math.round(q.x + s * (3 + k * 4)), Math.round(q.y - 4 - k * 4), 1, 2); }
    }
    x.restore();
    if (W.weather === 'rain') { x.fillStyle = 'rgba(30,50,90,.18)'; x.fillRect(0, 0, vw, vh); }
  }

  function update(dt) {
    if (!W.map) return;
    W.time += dt;
    if (FC.state) FC.state.playtime = (FC.state.playtime || 0) + dt / 1000;
    updatePlayer(dt);
    updateNpcs(dt);
    updateWeather(dt, FC.view.w, FC.view.h);
  }

  const layer = {
    name: 'world',
    onA() { if (!W.locked && !W.player.moving) { W.autoPath = null; interact(); } },
    onB() {},
    onStart() { if (W.map && !W.locked && !W.player.moving) { W.autoPath = null; FC.menu.open(); } },
    onTap(cx, cy) { onTap(cx, cy); },
  };

  return {
    W, layer, load, update, render, syncPlayer, refreshNpcs, refreshObjects, forceStep, walkNpc, faceNpc, snapCamera, lockRun,
    get map() { return W.map; },
    set autoPath(v) { W.autoPath = v; W.autoInteract = null; W.tapMark = null; },
    get locked() { return W.locked; },
  };
})();

</script>
<script>
'use strict';
/* Rundenbasiertes Kampfsystem: Typen, Fähigkeiten, Status, Statuswerte, KI, Fangen, EP, Entwicklung */
FC.battle = (function () {
  const U = FC.U, D = FC.data, G = FC.gfx, M = FC.mon;
  let B = null;
  const STAT_N = { atk: 'Angriff', def: 'Verteidigung', spa: 'Spezial-Angriff', spd: 'Spezial-Verteidigung', spe: 'Initiative', acc: 'Genauigkeit' };
  const ui = {};

  /* ───────── Hilfen ───────── */
  const stageMul = s => (s >= 0 ? (2 + s) / 2 : 2 / (2 - s));
  const accMul = s => (s >= 0 ? (3 + s) / 3 : 3 / (3 - s));
  const ab = side => D.MON[side.mon.sp].ab;
  const S = () => FC.state;
  function nm(side) {
    const n = M.name(side.mon);
    if (side.isPlayer) return n;
    return B.kind === 'wild' ? `Das wilde ${n}` : `${n} des Gegners`;
  }
  function nmShort(side) { return M.name(side.mon); }
  function makeSide(mon, isPlayer) {
    return { mon, isPlayer, st: { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, acc: 0 }, turns: 0, dispHp: mon.hp, spr: { dx: 0, dy: 0, alpha: 1, scale: 1, vis: true, white: 0, show: false } };
  }

  /* ───────── Layout ───────── */
  function layout() {
    const v = FC.view;
    const bs = Math.max(1, Math.floor(Math.min(v.cw, v.ch) * v.dpr / 190));
    const W = Math.ceil(v.cw * v.dpr / bs), H = Math.ceil(v.ch * v.dpr / bs);
    const bh = ui.bottom ? ui.bottom.offsetHeight : 160;
    const avail = Math.floor((v.ch - bh) * v.dpr / bs);
    return { bs, W, H, avail, e: [Math.round(W * 0.72), Math.round(avail * 0.52)], p: [Math.round(W * 0.27), avail - 2] };
  }
  function setBottomHeight() {
    const h = window.innerHeight, portrait = h > window.innerWidth;
    const px = portrait ? Math.min(300, Math.max(230, h * 0.36)) : Math.max(118, Math.min(172, h * 0.36));
    document.documentElement.style.setProperty('--b-bottom-h', Math.round(px) + 'px');
  }

  /* ───────── Darstellung ───────── */
  function drawBg(x, L) {
    const { W, H, avail } = L;
    const bg = B.bg;
    const pal = {
      grass: ['#a8dcff', '#e6f6ff', '#94d46a', '#7cc05a', '#5a9a40'],
      town: ['#b4dcff', '#eef8ff', '#d8c08a', '#c8ac74', '#9a8050'],
      indoor: ['#efe2c8', '#e2d2b0', '#c8945a', '#b8844e', '#8a5a32'],
      gym: ['#8f887c', '#a49c8e', '#bdb3a0', '#aaa08c', '#7a7262'],
      night: ['#1c1436', '#3a2a5a', '#2a3a4a', '#344a5a', '#1a2a38'],
    }[bg] || ['#a8dcff', '#e6f6ff', '#94d46a', '#7cc05a', '#5a9a40'];
    const hz = Math.round(avail * 0.42);
    const g = x.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]);
    x.fillStyle = g; x.fillRect(0, 0, W, hz);
    x.fillStyle = pal[2]; x.fillRect(0, hz, W, H - hz);
    for (let y = hz + 4, i = 0; y < H; y += 6 + i * 2, i++) { x.fillStyle = pal[3]; x.fillRect(0, y, W, 2); }
    if (bg === 'grass' || bg === 'town') {
      x.fillStyle = 'rgba(255,255,255,.85)';
      for (let i = 0; i < 4; i++) {
        const cx = ((i * 137 + B.time / 90) % (W + 80)) - 40, cy = 8 + ((i * 53) % Math.max(10, hz - 24));
        x.fillRect(Math.round(cx), Math.round(cy), 26, 5); x.fillRect(Math.round(cx) + 6, Math.round(cy) - 4, 14, 4);
      }
      if (bg === 'grass') { x.fillStyle = '#5aa850'; for (let i = 0; i < W; i += 12) x.fillRect(i, hz - 3 - ((i * 7) % 5), 10, 4 + ((i * 7) % 5)); }
    }
    if (bg === 'night') { x.fillStyle = '#fff'; for (let i = 0; i < 30; i++) { const sx = (i * 97) % W, sy = (i * 43) % hz; if ((B.time / 300 + i) % 7 > 1) x.fillRect(sx, sy, 1, 1); } }
    if (bg === 'gym' || bg === 'indoor') { x.fillStyle = 'rgba(0,0,0,.1)'; for (let i = 0; i < W; i += 24) x.fillRect(i, 0, 2, hz); }
    // Plattformen
    for (const [cx, cy, rx] of [[L.e[0], L.e[1], 46], [L.p[0], L.p[1], 54]]) {
      x.fillStyle = pal[4]; x.beginPath(); x.ellipse(cx, cy - 2, rx, rx * 0.26, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = pal[3]; x.beginPath(); x.ellipse(cx, cy - 4, rx - 3, rx * 0.26 - 3, 0, 0, Math.PI * 2); x.fill();
    }
  }
  function drawMon(x, side, cx, base, back) {
    const s = side.spr;
    if (!s.show || !s.vis || s.scale <= 0.01) return;
    const img = back ? G.monsterBack(side.mon.sp) : G.monster(side.mon.sp);
    const w = 64 * s.scale, h = 64 * s.scale;
    x.save();
    x.globalAlpha = s.alpha;
    const dx = Math.round(cx - w / 2 + s.dx), dy = Math.round(base - 60 * s.scale + s.dy);
    if (s.clip) { x.beginPath(); x.rect(dx - 10, 0, w + 20, base + 2); x.clip(); }
    x.drawImage(img, dx, dy, w, h);
    if (s.white > 0) { x.globalAlpha = s.alpha * s.white; x.drawImage(G.monsterSil(side.mon.sp, '#ffffff'), dx, dy, w, h); }
    x.restore();
  }
  function drawTrainer(x, t, cx, base) {
    if (!t || !t.show) return;
    const img = G.charFrame(t.look, t.dir || 'down', 0);
    x.save(); x.globalAlpha = t.alpha ?? 1;
    x.drawImage(img, Math.round(cx - 24 + t.dx), Math.round(base - 60 + (t.dy || 0)), 48, 60);
    x.restore();
  }
  function render(x) {
    if (!B) return;
    const L = layout();
    x.setTransform(L.bs, 0, 0, L.bs, 0, 0);
    x.imageSmoothingEnabled = false;
    if (B.evoScene) { B.evoScene.draw(x, L); drawFx(x); return; }
    drawBg(x, L);
    drawTrainer(x, B.eTrainer, L.e[0], L.e[1]);
    drawTrainer(x, B.pTrainer, L.p[0], L.p[1]);
    drawMon(x, B.e, L.e[0], L.e[1], false);
    drawMon(x, B.p, L.p[0], L.p[1], true);
    if (B.ball) { G.capsule(x, Math.round(B.ball.x), Math.round(B.ball.y), B.ball.col); if (B.ball.glow) { x.fillStyle = `rgba(255,255,255,${B.ball.glow})`; x.fillRect(Math.round(B.ball.x) - 6, Math.round(B.ball.y) - 7, 12, 14); } }
    drawFx(x);
    if (B.weather === 'rain') {
      x.fillStyle = 'rgba(30,50,90,.15)'; x.fillRect(0, 0, L.W, L.H);
      x.fillStyle = 'rgba(210,230,255,.7)';
      for (let i = 0; i < 50; i++) { const rx = (i * 71 + B.time * 0.05 * (1 + (i % 3))) % L.W, ry = (i * 37 + B.time * 0.25) % L.H; x.fillRect(Math.round(rx), Math.round(ry), 1, 4); }
    }
    if (B.flash > 0) { x.fillStyle = `rgba(255,255,255,${B.flash})`; x.fillRect(0, 0, L.W, L.H); }
    updateBars();
  }
  function drawFx(x) {
    for (const p of B.fx) {
      const a = Math.max(0, p.life / p.max);
      x.globalAlpha = Math.min(1, a * 1.5);
      x.fillStyle = p.col;
      if (p.shape === 'ring') { x.strokeStyle = p.col; x.lineWidth = 2; x.beginPath(); x.arc(p.x, p.y, p.r + (1 - a) * p.grow, 0, Math.PI * 2); x.stroke(); }
      else if (p.shape === 'bolt') { x.fillRect(Math.round(p.x), Math.round(p.y), 2, p.size); x.fillRect(Math.round(p.x) + 2, Math.round(p.y) + p.size, 2, p.size); x.fillRect(Math.round(p.x), Math.round(p.y) + p.size * 2, 2, p.size); }
      else if (p.shape === 'arrow') { const X = Math.round(p.x), Y = Math.round(p.y), d = p.vy < 0 ? -1 : 1; x.fillRect(X - 1, Y, 3, 6); x.fillRect(X - 3, Y + (d < 0 ? 0 : 5), 7, 1); x.fillRect(X - 2, Y + (d < 0 ? -1 : 6), 5, 1); }
      else x.fillRect(Math.round(p.x - p.size / 2), Math.round(p.y - p.size / 2), p.size, p.size);
    }
    x.globalAlpha = 1;
  }
  function update(dt) {
    if (!B) return;
    B.time += dt;
    for (const p of B.fx) { p.life -= dt; p.x += (p.vx || 0) * dt / 1000; p.y += (p.vy || 0) * dt / 1000; if (p.grav) p.vy += p.grav * dt / 1000; }
    B.fx = B.fx.filter(p => p.life > 0);
    if (B.evoScene && B.evoScene.update) B.evoScene.update(dt);
  }

  /* ───────── Effekte ───────── */
  function center(side) { const L = layout(); const [cx, b] = side.isPlayer ? L.p : L.e; return [cx, b - 28]; }
  function burst(cx, cy, n, opt) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = (opt.speed || 60) * (0.4 + Math.random());
      B.fx.push({ x: cx + (opt.spread ? (Math.random() - 0.5) * opt.spread : 0), y: cy + (opt.spreadY ? (Math.random() - 0.5) * opt.spreadY : 0), vx: Math.cos(a) * sp + (opt.vx || 0), vy: Math.sin(a) * sp + (opt.vy || 0), grav: opt.grav || 0, life: opt.life || 500, max: opt.life || 500, col: U.pick(opt.cols), size: opt.size || 2, shape: opt.shape });
    }
  }
  function typeFx(type, side) {
    const [cx, cy] = center(side);
    switch (type) {
      case 'feuer': burst(cx, cy + 10, 26, { cols: ['#ff8a2a', '#ffd040', '#ff5a2a'], vy: -70, speed: 30, spread: 30, life: 650, size: 3 }); break;
      case 'wasser': burst(cx, cy, 24, { cols: ['#7cc4f4', '#3a8ad8', '#ffffff'], speed: 90, grav: 160, life: 600, size: 3 }); break;
      case 'pflanze': burst(cx, cy, 18, { cols: ['#5ab040', '#8ae060', '#3a8a3a'], speed: 80, life: 700, size: 3 }); break;
      case 'elektro': for (let i = 0; i < 6; i++) B.fx.push({ x: cx + (Math.random() - 0.5) * 40, y: cy - 30 + Math.random() * 20, life: 300 + i * 40, max: 340, col: '#ffe040', size: 4, shape: 'bolt' }); burst(cx, cy, 10, { cols: ['#fff6a0'], speed: 70, life: 300 }); break;
      case 'stein': burst(cx, cy - 40, 12, { cols: ['#9a8f80', '#7a6a5a', '#c8bca8'], speed: 20, vy: 120, grav: 200, spread: 40, life: 500, size: 4 }); break;
      case 'flug': for (let i = 0; i < 8; i++) B.fx.push({ x: cx - 40, y: cy - 16 + i * 4, vx: 200 + Math.random() * 80, vy: 0, life: 380, max: 380, col: '#ffffff', size: 2 }); break;
      case 'kaefer': burst(cx, cy, 20, { cols: ['#c8e040', '#f0e080', '#8aa61e'], speed: 70, life: 500, size: 2 }); break;
      case 'geist': burst(cx, cy, 14, { cols: ['#9a80d8', '#5a3a8a', '#e0d0ff'], speed: 40, vy: -30, life: 800, size: 4 }); break;
      case 'psycho': for (let i = 0; i < 3; i++) B.fx.push({ x: cx, y: cy, r: 4 + i * 6, grow: 26, life: 500 + i * 120, max: 620, col: '#f070b0', shape: 'ring' }); break;
      default: burst(cx, cy, 14, { cols: ['#ffffff', '#ffe8a0'], speed: 100, life: 300, size: 3 });
    }
  }
  function statFx(side, up) {
    const [cx, cy] = center(side);
    for (let i = 0; i < 8; i++) B.fx.push({ x: cx - 24 + i * 7, y: up ? cy + 20 : cy - 20, vx: 0, vy: up ? -60 : 60, life: 600, max: 600, col: up ? '#5ab0f0' : '#f05a5a', shape: 'arrow' });
  }
  function statusFx(side, st) {
    const [cx, cy] = center(side);
    const col = { brn: ['#ff8a2a', '#ffd040'], psn: ['#b05ad0', '#e0a0ff'], par: ['#ffe040', '#fff6a0'], slp: ['#c8c8e0', '#ffffff'] }[st];
    burst(cx, cy, 16, { cols: col, speed: 40, vy: -40, life: 700, size: 3 });
  }
  async function blink(side, times = 3) {
    for (let i = 0; i < times * 2; i++) { side.spr.vis = !side.spr.vis; await FC.anim.delay(65); }
    side.spr.vis = true;
  }
  async function shake(side) {
    for (const d of [3, -3, 2, -2, 0]) { side.spr.dx = d; await FC.anim.delay(40); }
  }
  async function animAttack(att, def, mv) {
    const dir = att.isPlayer ? 1 : -1;
    if (mv.c === 'phys') { await FC.anim.tween(att.spr, { dx: 10 * dir, dy: -3 * dir }, 110); FC.anim.tween(att.spr, { dx: 0, dy: 0 }, 160); }
    else { await FC.anim.tween(att.spr, { dy: -5 }, 100); FC.anim.tween(att.spr, { dy: 0 }, 140); }
    typeFx(mv.t, def);
    await FC.anim.delay(260);
  }

  /* ───────── DOM-Anzeige ───────── */
  function initUi() {
    ui.root = U.$('battle-ui'); ui.enemy = U.$('b-enemy'); ui.player = U.$('b-player');
    ui.bottom = U.$('b-bottom'); ui.msg = U.$('b-msg'); ui.menu = U.$('b-menu');
    ui.bottom.addEventListener('pointerdown', e => { if (B && B.waiting && !e.target.closest('#b-menu')) { e.preventDefault(); B.waiting(); } });
  }
  function setInfo(el, side) {
    if (!side) { el.classList.add('hidden'); return; }
    el.classList.toggle('hidden', !side.spr.show);
    const m = side.mon;
    el.querySelector('.nm').textContent = M.name(m);
    el.querySelector('.lv').textContent = 'Lv. ' + m.lvl;
    const st = el.querySelector('.st');
    if (m.status) { st.textContent = D.STATUS[m.status].s; st.style.background = D.STATUS[m.status].c; } else st.textContent = '';

  }
  function updateBars() {
    for (const side of [B.p, B.e]) {
      if (!side || !side._el) continue;
      const max = M.maxHp(side.mon);
      const r = U.clamp(side.dispHp / max, 0, 1);
      const bar = side._el.querySelector('.hpbar i');
      bar.style.width = (r * 100).toFixed(1) + '%';
      bar.className = r <= 0.2 ? 'low' : r <= 0.5 ? 'mid' : '';
      if (side.isPlayer) {
        side._el.querySelector('.hpnum').textContent = Math.ceil(side.dispHp) + ' / ' + max;
        side._el.querySelector('.expbar i').style.width = (M.expProgress(side.mon) * 100).toFixed(1) + '%';
      }

  }
  function refreshInfo() { setInfo(ui.enemy, B.e); setInfo(ui.player, B.p); }
  async function setHp(side, hp) {
    const max = M.maxHp(side.mon);
    hp = U.clamp(Math.round(hp), 0, max);
    const from = side.mon.hp;
    side.mon.hp = hp;
    const dur = Math.min(900, 250 + Math.abs(from - hp) / max * 900);
    await FC.anim.tween(side, { dispHp: hp }, dur, 'linear');
  }

  // Kampfmeldung: tippt Text, wartet kurz (oder bis A/Tippen)
  function msg(text, opts = {}) {
    return new Promise(resolve => {
      ui.menu.classList.add('hidden');
      ui.msg.classList.remove('hidden');
      ui.msg.classList.remove('ready');
      const speed = (FC.settings && FC.settings.textSpeed) || 2;
      const cps = [0, 32, 55, 120][speed];
      let i = 0, last = performance.now(), acc = 0, raf, timer, done = false;
      ui.msg.textContent = '';
      const finish = () => {
        if (done) return; done = true; clearTimeout(timer); cancelAnimationFrame(raf);
        B.waiting = null; ui.msg.classList.remove('ready'); resolve();
      };
      const typed = () => {
        ui.msg.textContent = text; ui.msg.classList.add('ready');
        const wait = opts.wait != null ? opts.wait : [0, 1500, 1050, 700][speed];
        if (!opts.hold) timer = setTimeout(finish, wait);
        B.waiting = finish;
      };
      const step = now => {
        acc += (now - last) * cps / 1000; last = now;
        const n = Math.floor(acc);
        if (n) { acc -= n; i = Math.min(text.length, i + n); ui.msg.textContent = text.slice(0, i); }
        if (i >= text.length) { typed(); return; }
        raf = requestAnimationFrame(step);
      };
      B.waiting = () => { cancelAnimationFrame(raf); typed(); };
      raf = requestAnimationFrame(step);
    });
  }

  // Knopfmenü im unteren Bereich; liefert Index (oder -1 bei Zurück)
  function buttons(defs, opts = {}) {
    return new Promise(resolve => {
      const box = ui.menu;
      box.innerHTML = '';
      box.classList.remove('hidden');
      if (opts.prompt != null) { ui.msg.textContent = opts.prompt; ui.msg.classList.remove('ready'); }
      ui.msg.classList.toggle('hidden', !!opts.hideMsg);
      let sel = 0;
      const els = defs.map((d, i) => {
        const b = U.el('button', 'b-btn ' + (d.cls || ''), d.html);
        if (d.style) b.setAttribute('style', d.style);
        if (d.disabled) b.disabled = true;
        if (d.wide) b.classList.add('b-menu-wide');
        b.addEventListener('click', e => { e.preventDefault(); if (!d.disabled) done(i); });
        box.appendChild(b);
        return b;
      });
      const mark = () => els.forEach((b, i) => { b.style.outline = i === sel ? '3px solid #fff' : ''; });
      B.onDir = d => {
        const cols = 2;
        if (d === 'left') sel = Math.max(0, sel - 1);
        if (d === 'right') sel = Math.min(els.length - 1, sel + 1);
        if (d === 'up') sel = Math.max(0, sel - cols);
        if (d === 'down') sel = Math.min(els.length - 1, sel + cols);
        mark();
      };
      B.onA = () => { if (!defs[sel].disabled) done(sel); };
      B.onB = () => { if (opts.back) done(-1); };
      function done(i) {
        B.onDir = B.onA = B.onB = null;
        FC.audio.sfx(i < 0 || (defs[i] && defs[i].cls === 'back') ? 'back' : 'select');
        box.innerHTML = '';
        resolve(defs[i] && defs[i].cls === 'back' ? -1 : i);
      }
      if (!('ontouchstart' in window)) mark();
    });
  }

  /* ───────── Aktionswahl ───────── */
  async function chooseAction() {
    while (true) {
      const p = B.p;
      const i = await buttons([
        { html: 'Kampf', cls: 'fight' }, { html: 'Tasche', cls: 'bag' },
        { html: 'Team', cls: 'team' }, { html: B.kind === 'wild' ? 'Flucht' : 'Flucht', cls: 'run', disabled: false },
      ], { prompt: `Was soll ${nmShort(p)} tun?` });
      if (i === 0) {
        const usable = p.mon.moves.filter(m => m.pp > 0);
        if (!usable.length) return { type: 'move', id: 'rempler', struggle: true };
        const defs = p.mon.moves.map(m => {
          const mv = D.MOVES[m.id], tc = D.TYPES[mv.t].c;
          const eff = mv.c !== 'status' ? D.typeEff(mv.t, M.types(B.e.mon)) : 1;
          const hint = mv.c === 'status' ? 'Status' : eff > 1 ? 'sehr effektiv' : eff === 0 ? 'wirkungslos' : eff < 1 ? 'schwach' : '';
          return { html: `${U.esc(mv.n)}<small>${D.TYPES[mv.t].n} · AP ${m.pp}/${mv.pp}${hint && S().dex.seen[B.e.mon.sp] ? ' · ' + hint : ''}</small>`, style: `background:${tc}`, disabled: m.pp <= 0 };
        });
        while (defs.length < 4) defs.push({ html: '–', disabled: true, style: 'background:#4a4058' });
        defs.push({ html: 'Zurück', cls: 'back', wide: true });
        const k = await buttons(defs, { back: true, hideMsg: true });
        if (k >= 0 && k < p.mon.moves.length) return { type: 'move', id: p.mon.moves[k].id };
        continue;
      }
      if (i === 1) { const a = await bagMenu(); if (a) return a; continue; }
      if (i === 2) { const k = await teamMenu(false); if (k != null) return { type: 'switch', idx: k }; continue; }
      if (i === 3) {
        if (B.kind !== 'wild') { await msg('Du kannst nicht vor einem Trainerkampf fliehen!'); continue; }
        return { type: 'run' };
      }
    }
  }

  function itemUsable(k, m) {

    if (it.kind === 'cure') return m.hp > 0 && !!m.status && (it.cure === 'all' || it.cure === m.status);

  // Teamliste; forItem = Gegenstand → Ziel wählen; forced = Wechsel nach K.O.

           <div class="t2">${m.hp} / ${max} KP${m.status ? ' · ' + D.STATUS[m.status].n : ''}</div>
           <div class="mini-hp"><i class="${r <= 0.2 ? 'low' : r <= 0.5 ? 'mid' : ''}" style="width:${(r * 100).toFixed(0)}%"></i></div></div>`);
        row.prepend(FC.ui.monCanvas(m.sp));
