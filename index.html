<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aurelia">
<meta name="theme-color" content="#120e1c">
<title>Aurelia Chroniken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Aurelia Chroniken – Mobile-First Styles */
:root {
  --bg: #120e1c;
  --ink: #241c30;
  --paper: #fbf6ea;
  --paper-2: #efe6d2;
  --line: #2a2036;
  --accent: #f0703a;
  --accent-2: #4a8ff0;
  --good: #4cc05a;
  --warn: #f2c62e;
  --bad: #e84a4a;
  --muted: #7a6e86;
  --glass: rgba(18, 14, 28, 0.42);
  --font: "Pixelify Sans", ui-monospace, "SF Mono", Menlo, monospace;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
/* Das Spiel nutzt bewusst in beiden Systemmodi dieselbe Palette */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #120e1c; --paper: #fbf6ea; }
}
:root[data-theme="dark"] { --bg: #120e1c; --paper: #fbf6ea; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: var(--bg); color: var(--ink);
  overflow: hidden; overscroll-behavior: none;
  font-family: var(--font);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%;
  touch-action: none;
}
button { font-family: var(--font); color: inherit; }
.hidden { display: none !important; }

#app { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
#screen {
  position: absolute; inset: 0; width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
  display: block; touch-action: none;
}
#boot {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #e8dcff; font-size: 20px; background: var(--bg); z-index: 100;
}

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.hud-btn {
  position: absolute; pointer-events: auto;
  top: calc(var(--sat) + 10px); right: calc(var(--sar) + 10px);
  width: 52px; height: 52px; border-radius: 14px;
  background: var(--glass); border: 2px solid rgba(255,255,255,.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.hud-btn span { display: block; width: 24px; height: 3px; background: #fff; border-radius: 2px; }
.hud-btn:active { transform: scale(.94); }
#map-name {
  position: absolute; top: calc(var(--sat) + 12px); left: calc(var(--sal) + 12px);
  background: var(--paper); border: 3px solid var(--line); border-radius: 10px;
  padding: 6px 14px; font-size: 18px; font-weight: 600;
  box-shadow: 0 4px 0 rgba(0,0,0,.35);
  transform: translateY(-120%); opacity: 0; transition: transform .35s, opacity .35s;
}
#map-name.show { transform: translateY(0); opacity: 1; }

/* ---------- Touch-Steuerung ---------- */
#controls { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
#dpad {
  position: absolute; pointer-events: auto; touch-action: none;
  left: calc(var(--sal) + 18px); bottom: calc(var(--sab) + 18px);
  width: 150px; height: 150px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,.04) 70%);
}
.dp-arm {
  position: absolute; width: 50px; height: 50px; background: rgba(30,24,44,.62);
  border: 2px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center;
}
.dp-arm i { width: 0; height: 0; border: 9px solid transparent; }
.dp-up { left: 50px; top: 0; border-radius: 12px 12px 4px 4px; }
.dp-up i { border-bottom: 12px solid #fff; margin-top: -10px; }
.dp-down { left: 50px; bottom: 0; border-radius: 4px 4px 12px 12px; }
.dp-down i { border-top: 12px solid #fff; margin-bottom: -10px; }
.dp-left { top: 50px; left: 0; border-radius: 12px 4px 4px 12px; }
.dp-left i { border-right: 12px solid #fff; margin-left: -10px; }
.dp-right { top: 50px; right: 0; border-radius: 4px 12px 12px 4px; }
.dp-right i { border-left: 12px solid #fff; margin-right: -10px; }
.dp-hub { position: absolute; left: 50px; top: 50px; width: 50px; height: 50px; background: rgba(30,24,44,.62); }
.dp-arm.on { background: rgba(240,112,58,.85); }
#ab {
  position: absolute; pointer-events: auto;
  right: calc(var(--sar) + 18px); bottom: calc(var(--sab) + 22px);
  width: 160px; height: 130px;
}
.round-btn {
  position: absolute; border-radius: 50%; font-size: 26px; font-weight: 700; color: #fff;
  border: 3px solid rgba(255,255,255,.5); touch-action: none;
}
#btn-a { right: 0; top: 0; width: 80px; height: 80px; background: rgba(232,74,74,.82); }
#btn-b { left: 0; bottom: 0; width: 66px; height: 66px; background: rgba(74,143,240,.78); font-size: 22px; }
.round-btn.on { transform: scale(.92); filter: brightness(1.25); }

/* ---------- Dialog ---------- */
#dialog {
  position: absolute; z-index: 40;
  left: calc(var(--sal) + 12px); right: calc(var(--sar) + 12px);
  bottom: calc(var(--sab) + 12px);
  max-width: 820px; margin: 0 auto;
  min-height: 104px; padding: 16px 20px 18px;
  background: var(--paper); border: 4px solid var(--line); border-radius: 14px;
  box-shadow: inset 0 0 0 3px var(--paper-2), 0 6px 0 rgba(0,0,0,.4);
  font-size: 20px; line-height: 1.35; color: var(--ink);
}
#dialog-name {
  position: absolute; top: -20px; left: 16px; padding: 3px 12px; font-size: 15px; font-weight: 700;
  background: var(--accent); color: #fff; border: 3px solid var(--line); border-radius: 8px;
}
#dialog-name:empty { display: none; }
#dialog-next {
  position: absolute; right: 16px; bottom: 10px; width: 0; height: 0;
  border: 8px solid transparent; border-top: 10px solid var(--accent);
  animation: bob .6s infinite alternate; opacity: 0;
}
#dialog.ready #dialog-next { opacity: 1; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(4px); } }

#choice {
  position: absolute; z-index: 45;
  right: calc(var(--sar) + 12px); bottom: calc(var(--sab) + 130px);
  min-width: 170px; max-width: 70vw; max-height: 60vh; overflow-y: auto; touch-action: pan-y;
  background: var(--paper); border: 4px solid var(--line); border-radius: 12px; padding: 6px;
  box-shadow: 0 6px 0 rgba(0,0,0,.4);
}
.choice-btn {
  display: block; width: 100%; text-align: left; font-size: 19px; padding: 11px 14px;
  background: transparent; border: 0; border-radius: 8px; color: var(--ink);
}
.choice-btn.sel, .choice-btn:active { background: #ffe2c8; }
.choice-btn.sel::before { content: "▸ "; color: var(--accent); }

/* ---------- Kampf ---------- */
#battle-ui { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.b-info {
  position: absolute; pointer-events: none;
  background: var(--paper); border: 3px solid var(--line); border-radius: 12px;
  padding: 7px 12px 8px; min-width: 210px; max-width: 46vw;
  box-shadow: 0 4px 0 rgba(0,0,0,.35); font-size: 16px;
}
#b-enemy { top: calc(var(--sat) + 10px); left: calc(var(--sal) + 10px); }
#b-player { right: calc(var(--sar) + 10px); bottom: calc(var(--b-bottom-h, 160px) + 10px); }
.b-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.b-row .nm { font-weight: 700; font-size: 18px; }
.b-row .lv { font-size: 15px; color: var(--muted); }
.b-row .st { font-size: 12px; font-weight: 700; color: #fff; border-radius: 4px; padding: 1px 5px; }
.b-row .st:empty { display: none; }
.hp { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-end; margin-top: 4px; }
.hp b { font-size: 11px; background: var(--line); color: var(--warn); padding: 1px 4px; border-radius: 3px; }
.hpbar { width: 130px; height: 9px; background: #3a3046; border-radius: 5px; overflow: hidden; border: 2px solid var(--line); }
.hpbar i { display: block; height: 100%; width: 100%; background: var(--good); }
.hpbar i.mid { background: var(--warn); }
.hpbar i.low { background: var(--bad); }
.hpnum { font-size: 15px; font-weight: 600; white-space: nowrap; }
.expbar { width: 130px; height: 6px; background: #3a3046; border-radius: 3px; overflow: hidden; margin-top: 3px; }
.expbar i { display: block; height: 100%; width: 0; background: #5ab0f0; }

#b-bottom {
  position: absolute; left: 0; right: 0; bottom: 0; pointer-events: auto;
  height: var(--b-bottom-h, 160px);
  padding: 10px calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);
  background: var(--line); display: flex; gap: 10px;
  border-top: 4px solid #43365a;
}
#b-msg {
  flex: 1; background: var(--paper); border-radius: 12px; border: 3px solid #43365a;
  padding: 12px 16px; font-size: 19px; line-height: 1.35; color: var(--ink); position: relative;
  box-shadow: inset 0 0 0 3px var(--paper-2);
}
#b-msg.ready::after {
  content: ""; position: absolute; right: 14px; bottom: 10px;
  border: 7px solid transparent; border-top: 9px solid var(--accent); animation: bob .6s infinite alternate;
}
#b-menu {
  flex: 1.15; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.b-btn {
  border: 3px solid rgba(0,0,0,.35); border-radius: 12px; font-size: 19px; font-weight: 700;
  color: #fff; background: #5a4a72; padding: 6px 10px; text-shadow: 0 2px 0 rgba(0,0,0,.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.2);
}
.b-btn:active { transform: translateY(2px); box-shadow: none; }
.b-btn small { font-size: 12px; font-weight: 400; opacity: .9; margin-top: 3px; }
.b-btn.fight { background: #e05a3a; }
.b-btn.bag { background: #e0a020; }
.b-btn.team { background: #3aa060; }
.b-btn.run { background: #4a7ad8; }
.b-btn.back { background: #6a5f78; }
.b-btn:disabled { opacity: .4; }
.b-menu-wide { grid-column: span 2; }

/* ---------- Panels / Menüs ---------- */
#panel {
  position: absolute; inset: 0; z-index: 50; background: rgba(12, 9, 20, .82);
  display: flex; align-items: center; justify-content: center;
  padding: calc(var(--sat) + 10px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);
}
.sheet {
  width: 100%; max-width: 760px; max-height: 100%; display: flex; flex-direction: column;
  background: var(--paper); border: 4px solid var(--line); border-radius: 16px; overflow: hidden;
  box-shadow: 0 8px 0 rgba(0,0,0,.4);
}
.sheet-head {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--line); color: #fff;
}
.sheet-head h2 { margin: 0; font-size: 22px; flex: 1; }
.sheet-head .money { font-size: 16px; color: var(--warn); }
.x-btn {
  width: 44px; height: 44px; border-radius: 10px; border: 2px solid rgba(255,255,255,.4);
  background: rgba(255,255,255,.1); color: #fff; font-size: 22px; font-weight: 700;
}
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 12px; }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.menu-tile {
  min-height: 72px; border-radius: 14px; border: 3px solid var(--line); background: #fff;
  font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  box-shadow: 0 4px 0 rgba(0,0,0,.2); text-align: left;
}
.menu-tile:active { transform: translateY(3px); box-shadow: none; }
.menu-tile .ic { width: 32px; height: 32px; image-rendering: pixelated; flex: none; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row-card {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px;
  border: 3px solid var(--line); background: #fff; text-align: left; width: 100%; font-size: 17px;
}
.row-card:active { background: #fff1e2; }
.row-card.lead { background: #fff4d8; }
.row-card.fainted { opacity: .55; }
.row-card canvas { width: 56px; height: 56px; image-rendering: pixelated; flex: none; }
.row-card .grow { flex: 1; min-width: 0; }
.row-card .t1 { font-weight: 700; font-size: 18px; display: flex; justify-content: space-between; gap: 6px; }
.row-card .t2 { font-size: 14px; color: var(--muted); }
.mini-hp { height: 8px; background: #3a3046; border-radius: 4px; overflow: hidden; margin-top: 5px; }
.mini-hp i { display: block; height: 100%; background: var(--good); }
.mini-hp i.mid { background: var(--warn); } .mini-hp i.low { background: var(--bad); }
.type-chip {
  display: inline-block; font-size: 12px; font-weight: 700; color: #fff; border-radius: 6px;
  padding: 2px 7px; margin-right: 4px; text-shadow: 0 1px 0 rgba(0,0,0,.3);
}
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn {
  font-size: 18px; font-weight: 700; padding: 12px 16px; border-radius: 12px; border: 3px solid var(--line);
  background: #fff; min-height: 50px; box-shadow: 0 4px 0 rgba(0,0,0,.2);
}
.btn:active { transform: translateY(3px); box-shadow: none; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.blue { background: var(--accent-2); color: #fff; }
.btn:disabled { opacity: .45; }
.detail { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
.detail canvas { width: 128px; height: 128px; image-rendering: pixelated; background: #efe6d2; border-radius: 12px; border: 3px solid var(--line); }
.stat-table { width: 100%; border-collapse: collapse; font-size: 16px; }
.stat-table td { padding: 3px 4px; border-bottom: 1px dashed #d8ccb4; }
.stat-table td:last-child { text-align: right; font-weight: 700; }
.move-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.move-pill { border-radius: 10px; padding: 6px 9px; color: #fff; font-size: 15px; font-weight: 700; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
.move-pill small { display: block; font-weight: 400; font-size: 12px; opacity: .95; }
.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.dex-cell { border: 3px solid var(--line); border-radius: 12px; background: #fff; padding: 4px; text-align: center; font-size: 13px; }
.dex-cell canvas { width: 64px; height: 64px; image-rendering: pixelated; display: block; margin: 0 auto; }
.dex-cell.unseen { background: #e4dccb; color: var(--muted); }
.note { font-size: 15px; color: #5a4e66; background: #fff4d8; border: 2px dashed #e0b860; border-radius: 10px; padding: 10px 12px; line-height: 1.35; }
.note.warn { background: #ffe4e0; border-color: #e88a7a; }
.slider-row { display: flex; align-items: center; gap: 12px; font-size: 18px; margin: 10px 0; }
.slider-row label { width: 120px; }
.slider-row input[type=range] { flex: 1; height: 36px; accent-color: var(--accent); touch-action: pan-x; }
textarea.code {
  width: 100%; min-height: 110px; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
  border: 3px solid var(--line); border-radius: 10px; padding: 8px; user-select: text; -webkit-user-select: text;
  touch-action: pan-y;
}
.qty { display: flex; align-items: center; gap: 10px; font-size: 20px; justify-content: center; margin: 10px 0; }
.qty button { width: 52px; height: 52px; font-size: 24px; }

/* Region-Karte */
.region-map { width: 100%; height: auto; image-rendering: pixelated; border-radius: 12px; border: 3px solid var(--line); background: #8fd0f0; }

/* ---------- Titelbildschirm ---------- */
#title {
  position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
  overflow-y: auto; touch-action: pan-y;
}
.logo { text-align: center; color: #fff; margin-bottom: 18px; }
.logo h1 {
  margin: 0; font-size: clamp(40px, 10vw, 76px); letter-spacing: 3px; font-weight: 700;
  color: #ffd25a; text-shadow: 0 4px 0 #b8501a, 0 8px 0 #2a1a3a, 0 0 30px rgba(255,180,80,.35);
}
.logo p { margin: 6px 0 0; font-size: clamp(16px, 4vw, 22px); color: #e8dcff; letter-spacing: 2px; }
.title-box { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; }
.title-box .btn { width: 100%; font-size: 20px; }
.slot-card { text-align: left; }
.slot-card .t2 { margin-top: 2px; }
.tap-hint { color: #e8dcff; font-size: 18px; animation: pulse 1.4s infinite; margin-top: 14px; }
@keyframes pulse { 50% { opacity: .35; } }
.version { color: rgba(255,255,255,.45); font-size: 13px; margin-top: 14px; text-align: center; }

/* ---------- Toast / Fade ---------- */
#toast {
  position: absolute; z-index: 90; left: 50%; top: calc(var(--sat) + 14px); transform: translate(-50%, -150%);
  background: var(--paper); border: 3px solid var(--line); border-radius: 12px; padding: 8px 16px;
  font-size: 17px; font-weight: 600; transition: transform .3s; max-width: 90vw; text-align: center;
  box-shadow: 0 4px 0 rgba(0,0,0,.35); pointer-events: none;
}
#toast { visibility: hidden; }
#toast.show { transform: translate(-50%, 0); visibility: visible; }
#fade { position: absolute; inset: 0; z-index: 80; background: #000; opacity: 0; pointer-events: none; transition: opacity .25s; }
#fade.on { opacity: 1; }
#fade.white { background: #fff; }

/* ---------- Responsive ---------- */
@media (orientation: portrait) {
  #b-bottom { flex-direction: column; }
  #b-menu { flex: 1.3; }
  #b-msg { flex: 1; }
  .b-info { min-width: 190px; }
  #dpad { width: 138px; height: 138px; }
  .dp-arm { width: 46px; height: 46px; }
  .dp-up, .dp-down { left: 46px; } .dp-left, .dp-right { top: 46px; } .dp-hub { left: 46px; top: 46px; width: 46px; height: 46px; }
}
@media (orientation: landscape) and (max-height: 430px) {
  #dialog { min-height: 86px; font-size: 18px; padding: 12px 16px; left: calc(var(--sal) + 190px); right: calc(var(--sar) + 190px); }
  .b-info { padding: 5px 10px 6px; min-width: 190px; }
  .hpbar, .expbar { width: 110px; }
  #b-msg { font-size: 17px; padding: 10px 14px; }
  .b-btn { font-size: 17px; }
  #choice { bottom: calc(var(--sab) + 104px); right: calc(var(--sar) + 190px); }
}
@media (min-width: 900px) and (min-height: 600px) {
  #dialog { font-size: 22px; }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="screen"></canvas>

  <div id="hud" class="hidden">
    <button id="btn-menu" class="hud-btn" aria-label="Menü"><span></span><span></span><span></span></button>
    <div id="map-name"></div>
  </div>

  <div id="controls" class="hidden">
    <div id="dpad" aria-label="Steuerkreuz">
      <div class="dp-arm dp-up"><i></i></div>
      <div class="dp-arm dp-down"><i></i></div>
      <div class="dp-arm dp-left"><i></i></div>
      <div class="dp-arm dp-right"><i></i></div>
      <div class="dp-hub"></div>
    </div>
    <div id="ab">
      <button id="btn-b" class="round-btn" aria-label="B">B</button>
      <button id="btn-a" class="round-btn" aria-label="A">A</button>
    </div>
  </div>

  <div id="dialog" class="hidden">
    <div id="dialog-name"></div>
    <div id="dialog-text"></div>
    <div id="dialog-next"></div>
  </div>
  <div id="choice" class="hidden"></div>

  <div id="battle-ui" class="hidden">
    <div id="b-enemy" class="b-info">
      <div class="b-row"><span class="nm"></span><span class="lv"></span></div>
      <div class="b-row"><span class="st"></span><div class="hp"><b>KP</b><div class="hpbar"><i></i></div></div></div>
    </div>
    <div id="b-player" class="b-info">
      <div class="b-row"><span class="nm"></span><span class="lv"></span></div>
      <div class="b-row"><span class="st"></span><div class="hp"><b>KP</b><div class="hpbar"><i></i></div></div></div>
      <div class="b-row"><span class="hpnum"></span><div class="expbar"><i></i></div></div>
    </div>
    <div id="b-bottom">
      <div id="b-msg"></div>
      <div id="b-menu" class="hidden"></div>
    </div>
  </div>

  <div id="panel" class="hidden"></div>
  <div id="title" class="hidden"></div>
  <div id="toast"></div>
  <div id="fade"></div>
  <div id="boot">Lade Aurelia …</div>
</div>

<script>
'use strict';
/* Aurelia Chroniken – Kern: Namespace, Hilfsfunktionen, Animations-Manager */
window.FC = {
  VERSION: '0.1.0',
  SAVE_VERSION: 1,
  T: 16,              // Kachelgröße in Pixeln
  data: {},
  gfx: {},
  state: null,        // aktueller Spielstand
  mode: 'boot',       // boot | title | world | battle | cutscene
};

(function () {
  const U = FC.U = {};
  U.ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  U.chance = p => Math.random() < p;
  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.pick = a => a[Math.floor(Math.random() * a.length)];
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.seeded = seed => {
    let s = (seed >>> 0) || 123456789;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  };
  U.hash = str => {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h;
  };
  U.wait = ms => new Promise(r => setTimeout(r, ms));
  U.$ = id => document.getElementById(id);
  U.el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };
  U.esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  U.DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  U.OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  U.fmtTime = s => { const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return h + ':' + String(m).padStart(2, '0'); };
  U.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  U.weighted = list => { // [[value, weight], ...]
    let t = 0; for (const [, w] of list) t += w;
    let r = Math.random() * t;
    for (const [v, w] of list) { r -= w; if (r <= 0) return v; }
    return list[list.length - 1][0];
  };
  U.money = n => n.toLocaleString('de-DE') + ' Taler';
})();

/* Zeitbasierter Tween-/Animations-Manager (läuft im Spiel-Loop, pausiert mit ihm) */
FC.anim = {
  list: [],
  ease: {
    linear: p => p,
    outQuad: p => 1 - (1 - p) * (1 - p),
    inQuad: p => p * p,
    inOutQuad: p => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2),
    outBack: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  },
  tween(obj, props, dur, ease) {
    return new Promise(res => {
      const from = {};
      for (const k in props) from[k] = obj[k];
      this.list.push({ obj, from, to: props, dur: Math.max(1, dur), t: 0, ease: this.ease[ease || 'outQuad'], res });
    });
  },
  delay(ms) { return this.tween({ v: 0 }, { v: 1 }, ms, 'linear'); },
  update(dt) {
    if (!this.list.length) return;
    const done = [];
    for (const a of this.list) {
      a.t += dt;
      const p = Math.min(1, a.t / a.dur), e = a.ease(p);
      for (const k in a.to) a.obj[k] = a.from[k] + (a.to[k] - a.from[k]) * e;
      if (p >= 1) done.push(a);
    }
    if (done.length) {
      this.list = this.list.filter(a => !done.includes(a));
      for (const a of done) a.res();
    }
  },
};

<script>
'use strict';
/* Pixel-Art-Hilfen: Offscreen-Canvas, Farben, Alpha-Quantisierung, Konturen */
(function () {
  const G = FC.gfx;
  G.canvas = (w, h) => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d', w * h <= 4096 ? { willReadFrequently: true } : undefined).imageSmoothingEnabled = false;
    return c;
  };
  G.rgb = hex => {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  G.hex = (r, g, b) => '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  G.shade = (hex, amt) => {
    const [r, g, b] = G.rgb(hex);
    if (amt < 0) { const f = 1 + amt; return G.hex(r * f, g * f, b * f); }
    return G.hex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
  };
  // Halbtransparente Kanten entfernen → harte Pixelkanten
  G.quantize = (c, th = 110) => {
    const x = c.getContext('2d');
    const d = x.getImageData(0, 0, c.width, c.height);
    const a = d.data;
    for (let i = 3; i < a.length; i += 4) a[i] = a[i] > th ? 255 : 0;
    x.putImageData(d, 0, 0);
  };
  // 1-Pixel-Kontur um alle deckenden Pixel
  G.outline = (c, col = '#1c1626') => {
    const x = c.getContext('2d');
    const w = c.width, h = c.height;
    const d = x.getImageData(0, 0, w, h);
    const a = d.data;
    const out = new Uint8ClampedArray(a);
    const [r, g, b] = G.rgb(col);
    for (let y = 0; y < h; y++) for (let X = 0; X < w; X++) {
      const i = (y * w + X) * 4;
      if (a[i + 3]) continue;
      const n = (X > 0 && a[i - 1]) || (X < w - 1 && a[i + 7]) || (y > 0 && a[i - w * 4 + 3]) || (y < h - 1 && a[i + w * 4 + 3]);
      if (n) { out[i] = r; out[i + 1] = g; out[i + 2] = b; out[i + 3] = 255; }
    }
    d.data.set(out);
    x.putImageData(d, 0, 0);
  };
  G.flip = c => {
    const f = G.canvas(c.width, c.height);
    const x = f.getContext('2d');
    x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0);
    return f;
  };
  G.tint = (c, col) => {
    const f = G.canvas(c.width, c.height);
    const x = f.getContext('2d');
    x.drawImage(c, 0, 0);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
    return f;
  };
  // Pixel-genaue Grundformen
  G.px = (x, X, Y, col) => { x.fillStyle = col; x.fillRect(X, Y, 1, 1); };
  G.rect = (x, X, Y, w, h, col) => { x.fillStyle = col; x.fillRect(X, Y, w, h); };
  G.disc = (x, cx, cy, r, colFn) => {
    for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
      for (let X = Math.floor(cx - r); X <= Math.ceil(cx + r); X++) {
        const dx = X + 0.5 - cx, dy = y + 0.5 - cy, d = Math.sqrt(dx * dx + dy * dy);
        if (d <= r) { const c = colFn(dx, dy, d); if (c) { x.fillStyle = c; x.fillRect(X, y, 1, 1); } }
      }
  };
  // Kapsel-Symbol (eigenes Design, keine Fremdmarke)
  G.capsule = (x, ox, oy, top, small) => {
    const s = small ? 0.75 : 1;
    const w = Math.round(8 * s), h = Math.round(10 * s);
    const X = ox - Math.floor(w / 2), Y = oy - Math.floor(h / 2);
    G.rect(x, X + 1, Y, w - 2, h, '#1c1626');
    G.rect(x, X, Y + 1, w, h - 2, '#1c1626');
    G.rect(x, X + 1, Y + 1, w - 2, Math.floor(h / 2) - 1, top);
    G.rect(x, X + 1, Y + Math.floor(h / 2), w - 2, Math.ceil(h / 2) - 1, '#f4f0e8');
    G.rect(x, X + 1, Y + Math.floor(h / 2) - 1, w - 2, 1, '#1c1626');
    G.rect(x, X + Math.floor(w / 2) - 1, Y + Math.floor(h / 2) - 2, 2, 3, '#ffd25a');
    G.rect(x, X + 2, Y + 2, 1, 2, 'rgba(255,255,255,.75)');
  };
})();

<script>
'use strict';
/* Figuren-Sprites (16×20) – 4 Richtungen × 3 Frames, prozedural aus Farbparametern */
(function () {
  const G = FC.gfx;
  const cache = {};
  const EYE = '#201828';

  function draw(L, dir, f) {
    const c = G.canvas(16, 20), x = c.getContext('2d');
    const r = (X, Y, w, h, col) => { x.fillStyle = col; x.fillRect(X, Y, w, h); };
    const skin = L.skin, hair = L.hair, shirt = L.shirt, pants = L.pants, shoe = '#2a2230';
    const shirtD = G.shade(shirt, -0.22), pantsD = G.shade(pants, -0.22), hairL = G.shade(hair, 0.22);
    const side = dir === 'left';

    // Beine / Rock
    if (L.long || L.coat) {
      const sk = L.coat ? '#f4f4f4' : pants;
      if (!side) {
        r(4, 14, 8, 4, sk); r(4, 17, 8, 1, G.shade(sk, -0.15));
        r(5, 18, 2, 1, f === 1 ? sk : shoe); r(9, 18, 2, 1, f === 2 ? sk : shoe);
        if (L.coat) { r(5, 18, 2, 1, f === 1 ? pants : shoe); r(9, 18, 2, 1, f === 2 ? pants : shoe); }
      } else {
        r(5, 14, 7, 4, sk); r(5, 17, 7, 1, G.shade(sk, -0.15));
        if (f === 0) r(6, 18, 4, 1, shoe); else { r(4, 18, 3, 1, shoe); r(9, 18, 3, 1, shoe); }
      }
    } else if (!side) {
      const lu = f === 1 ? 1 : 0, ru = f === 2 ? 1 : 0;
      r(5, 15, 3, 3 - lu, pants); r(8, 15, 3, 3 - ru, pantsD);
      r(5, 18 - lu, 3, 1, shoe); r(8, 18 - ru, 3, 1, shoe);
    } else {
      if (f === 0) { r(6, 15, 4, 3, pants); r(6, 18, 4, 1, shoe); }
      else { r(4, 15, 3, 3, pants); r(9, 15, 3, 3, pantsD); r(4, 18, 3, 1, shoe); r(9, 18, 3, 1, shoe); }
    }

    // Oberkörper
    const top = L.coat ? '#f4f4f4' : shirt, topD = L.coat ? '#d8d8e0' : shirtD;
    r(4, 9, 8, 6, top); r(4, 14, 8, 1, topD);
    if (L.coat && !side) r(7, 9, 2, 5, shirt === '#f4f4f4' ? '#7aa0d0' : '#7aa0d0');
    if (!side) {
      const la = f === 1 ? 1 : 0, ra = f === 2 ? 1 : 0;
      r(2, 10 + la, 2, 4, top); r(12, 10 + ra, 2, 4, top);
      r(2, 14 + la, 2, 1, skin); r(12, 14 + ra, 2, 1, skin);
      if (dir === 'down') r(5, 9, 6, 1, topD);
    } else {
      const ax = f === 1 ? 5 : f === 2 ? 8 : 7;
      r(ax, 10, 2, 4, topD); r(ax, 14, 2, 1, skin);
    }

    // Kopf
    if (dir === 'down') {
      r(4, 0, 8, 1, hair); r(3, 1, 10, 3, hair);
      r(4, 3, 8, 6, skin);
      r(3, 4, 1, 4, hair); r(12, 4, 1, 4, hair);
      r(4, 3, 2, 1, hair); r(10, 3, 2, 1, hair); r(7, 3, 1, 1, hair);
      r(5, 5, 1, 2, EYE); r(10, 5, 1, 2, EYE);
      r(5, 7, 1, 1, '#f0a0a0'); r(10, 7, 1, 1, '#f0a0a0');
      r(7, 8, 2, 1, G.shade(skin, -0.15));
      r(5, 1, 3, 1, hairL);
      if (L.long) { r(2, 4, 2, 7, hair); r(12, 4, 2, 7, hair); }
    } else if (dir === 'up') {
      r(4, 0, 8, 1, hair); r(3, 1, 10, 8, hair);
      r(5, 2, 3, 1, hairL); r(4, 8, 8, 1, G.shade(hair, -0.2));
      if (L.long) { r(3, 8, 10, 4, hair); r(4, 11, 8, 1, G.shade(hair, -0.2)); }
    } else { // links
      r(4, 0, 8, 1, hair); r(3, 1, 10, 3, hair);
      r(3, 4, 6, 5, skin); r(2, 6, 1, 1, skin);
      r(9, 3, 4, 5, hair); r(8, 8, 4, 1, hair); r(3, 3, 3, 1, hair);
      r(4, 5, 1, 2, EYE); r(5, 7, 1, 1, '#f0a0a0');
      r(5, 1, 3, 1, hairL);
      if (L.long) r(10, 7, 3, 5, hair);
    }

    // Kopfbedeckung
    if (L.hat) {
      const hatD = G.shade(L.hat, -0.25);
      r(4, 0, 8, 1, L.hat); r(3, 1, 10, 2, L.hat);
      if (dir === 'down') { r(3, 3, 10, 1, hatD); r(7, 1, 2, 1, '#ffffff'); }
      else if (dir === 'up') r(3, 3, 10, 1, L.hat);
      else { r(0, 3, 7, 1, hatD); r(3, 2, 2, 1, '#ffffff'); }
    }

    G.outline(c);
    return c;
  }

  G.charFrame = function (lookId, dir, f) {
    const key = lookId + ':' + dir + ':' + f;
    if (cache[key]) return cache[key];
    const L = typeof lookId === 'string' ? FC.data.LOOKS[lookId] : lookId;
    let c;
    if (dir === 'right') c = G.flip(G.charFrame(lookId, 'left', f));
    else c = draw(L, dir, f);
    cache[key] = c;
    return c;
  };

  // "!"-Sprechblase
  G.emote = (function () {
    const c = G.canvas(12, 14), x = c.getContext('2d');
    const r = (X, Y, w, h, col) => { x.fillStyle = col; x.fillRect(X, Y, w, h); };
    r(1, 0, 10, 11, '#ffffff'); r(0, 1, 12, 9, '#ffffff'); r(4, 11, 3, 2, '#ffffff');
    r(5, 2, 2, 5, '#e03a3a'); r(5, 8, 2, 2, '#e03a3a');
    G.outline(c);
    return c;
  })();
})();

  const BODY = {

      const c = L.c, c2 = L.c2, d = G.shade(c, -0.35);

    },
    quad(x, L) {
      const c = L.c, c2 = L.c2, d = G.shade(c, -0.3);
      rect(x, 19, 41, 4, 10, d); rect(x, 39, 41, 4, 10, d);
      ell(x, 31, 38, 14, 9, c);
      rect(x, 24, 42, 4, 9, c); rect(x, 34, 42, 4, 9, c);
      ell(x, 31, 42, 9, 4, c2);
      ell(x, 17, 28, 10, 9, c); ell(x, 11, 32, 4.5, 3, c2);
      return { eyes: [[13, 26], [21, 26]], mouth: [11, 32], head: [17, 28, 9], tail: [44, 34], top: [17, 19], back: [32, 30] };
    },
    biped(x, L) {
      const c = L.c, c2 = L.c2, d = G.shade(c, -0.3);
      rect(x, 21, 44, 5, 8, d); rect(x, 31, 44, 5, 8, d);
      ell(x, 28, 38, 10, 10, c); ell(x, 28, 40, 6, 7, c2);
      ell(x, 17, 37, 3, 6, c, 0.3); ell(x, 39, 37, 3, 6, c, -0.3);
      ell(x, 28, 22, 11, 10, c);
      return { eyes: [[23, 21], [33, 21]], mouth: [28, 26], head: [28, 22, 10], tail: [37, 44], top: [28, 12], back: [28, 32] };
    },
    bird(x, L) {
      const c = L.c, c2 = L.c2, c3 = L.c3 || G.shade(c, -0.25);
      poly(x, [[36, 42], [51, 48], [49, 38]], c3);
      rect(x, 24, 46, 2, 6, '#e0a030'); rect(x, 31, 46, 2, 6, '#e0a030');
      ell(x, 28, 36, 12, 11, c); ell(x, 30, 39, 7, 7, c2);
      ell(x, 24, 22, 9, 8, c);
      poly(x, [[12, 23], [18, 19.5], [18, 26]], '#f0b030');
      ell(x, 37, 34, 7, 10, c3, -0.4);
      return { eyes: [[20, 20], [27, 20]], mouth: null, head: [24, 22, 8], tail: [46, 42], top: [24, 14], back: [34, 26] };
    },
    bug(x, L) {
      const c = L.c, c2 = L.c2, d = G.shade(c, -0.3);
      for (const lx of [20, 28, 36]) rect(x, lx, 46, 2, 5, d);
      ell(x, 44, 44, 6, 5, c); ell(x, 35, 42, 7, 7, c); ell(x, 25, 40, 8, 8, c);
      ell(x, 35, 45, 5, 2.5, c2); ell(x, 25, 44, 6, 3, c2);
      ell(x, 15, 34, 9, 9, c2);
      x.strokeStyle = d; x.lineWidth = 2; x.beginPath(); x.moveTo(12, 27); x.lineTo(8, 18); x.moveTo(18, 26); x.lineTo(21, 17); x.stroke();
      ell(x, 8, 18, 2.5, 2.5, L.c3 || '#e04040'); ell(x, 21, 17, 2.5, 2.5, L.c3 || '#e04040');
      return { eyes: [[11, 33], [18, 33]], mouth: [15, 38], head: [15, 34, 9], tail: [48, 44], top: [15, 25], back: [35, 35] };
    },
    cocoon(x, L) {
      const c = L.c, c2 = L.c2, d = G.shade(c, -0.3);
      ell(x, 28, 33, 11, 18, c);
      for (const y of [22, 30, 38, 45]) { x.fillStyle = d; x.fillRect(18, y, 20, 2); }
      ell(x, 28, 16, 4, 3, c2);
      return { eyes: [[24, 28], [32, 28]], mouth: null, head: [28, 28, 8], tail: [28, 50], top: [28, 14], back: [28, 33], sleepy: true };
    },
    moth(x, L) {
      const c = L.c, c2 = L.c2, c3 = L.c3 || '#fff';
      ell(x, 14, 26, 12, 14, c2, -0.3); ell(x, 42, 26, 12, 14, c2, 0.3);
      ell(x, 17, 42, 7, 8, c2, 0.4); ell(x, 39, 42, 7, 8, c2, -0.4);
      ell(x, 12, 24, 4, 4, c3); ell(x, 44, 24, 4, 4, c3); ell(x, 12, 24, 2, 2, c); ell(x, 44, 24, 2, 2, c);
      ell(x, 28, 34, 5, 13, c); ell(x, 28, 19, 7, 6, c);
      x.strokeStyle = c; x.lineWidth = 1.6; x.beginPath(); x.moveTo(25, 14); x.lineTo(20, 5); x.moveTo(31, 14); x.lineTo(36, 5); x.stroke();
      return { eyes: [[25, 18], [32, 18]], mouth: null, head: [28, 19, 6], tail: [28, 46], top: [28, 10], back: [28, 30], small: true };
    },
    ghost(x, L) {
      const c = L.c, c2 = L.c2;
      ell(x, 28, 28, 14, 14, c);
      poly(x, [[14, 28], [42, 28], [42, 44], [38, 40], [34, 47], [30, 40], [26, 47], [22, 40], [18, 47], [14, 42]], c);
      ell(x, 28, 35, 8, 6, c2);
      ell(x, 11, 32, 3, 6, c, 0.6); ell(x, 45, 32, 3, 6, c, -0.6);
      return { eyes: [[22, 26], [34, 26]], mouth: [28, 33], head: [28, 26, 13], tail: [28, 46], top: [28, 15], back: [28, 28], big: true, float: true };
    },
    rock(x, L) {
      const c = L.c, c2 = L.c2, d = G.shade(c, -0.35);
      ell(x, 9, 42, 4, 5, c); ell(x, 47, 42, 4, 5, c);
      poly(x, [[13, 50], [10, 36], [16, 24], [27, 18], [40, 21], [46, 32], [46, 46], [40, 51]], c);
      ell(x, 28, 44, 9, 5, c2);
      x.strokeStyle = d; x.lineWidth = 1.2; x.beginPath(); x.moveTo(17, 26); x.lineTo(21, 31); x.lineTo(19, 36); x.moveTo(42, 38); x.lineTo(38, 43); x.stroke();
      return { eyes: [[22, 32], [34, 32]], mouth: [28, 38], head: [28, 32, 12], tail: [46, 44], top: [28, 19], back: [28, 24], angry: true };
    },
    mushroom(x, L) {
      const c = L.c, c2 = L.c2, d = G.shade(c2, -0.25);
      rect(x, 21, 47, 5, 4, d); rect(x, 31, 47, 5, 4, d);
      ell(x, 28, 41, 10, 9, c2);
      ell(x, 28, 28, 18, 11, c); rect(x, 10, 27, 36, 5, c);
      ell(x, 20, 23, 3, 2, '#ffffff'); ell(x, 33, 21, 4, 3, '#ffffff'); ell(x, 41, 28, 2, 2, '#ffffff'); ell(x, 15, 29, 2, 1.5, '#ffffff');
      return { eyes: [[24, 40], [33, 40]], mouth: [28, 45], head: [28, 40, 9], tail: [40, 44], top: [28, 17], back: [28, 22] };
    },
    salamander(x, L) {
      const c = L.c, c2 = L.c2, d = G.shade(c, -0.3);
      x.strokeStyle = c; x.lineWidth = 5; x.lineCap = 'round';
      x.beginPath(); x.moveTo(40, 44); x.quadraticCurveTo(53, 47, 50, 36); x.stroke();
      rect(x, 20, 44, 4, 7, d); rect(x, 36, 44, 4, 7, d);
      ell(x, 30, 42, 13, 7, c); rect(x, 25, 45, 4, 6, c); rect(x, 33, 45, 4, 6, c);
      ell(x, 30, 45, 8, 3, c2);
      ell(x, 17, 34, 11, 8, c); ell(x, 15, 38, 7, 3, c2);
      ell(x, 5, 30, 3, 5, L.c3 || c2, -0.5); ell(x, 29, 28, 3, 5, L.c3 || c2, 0.5);
      return { eyes: [[12, 32], [21, 32]], mouth: [15, 38], head: [17, 34, 9], tail: [50, 36], top: [17, 26], back: [31, 35] };
    },
  };

  function features(x, L, A, phase) {
    const c = L.c, c2 = L.c2, c3 = L.c3;
    const [hx, hy, hr] = A.head;
    const [tx, ty] = A.tail;
    if (phase === 'back') {
      if (L.tail === 'flame') flame(x, tx + 4, ty - 3, 1.15);
      if (L.tail === 'leaf') ell(x, tx + 4, ty - 7, 4, 9, c3 || '#4ab040', 0.6);
      if (L.tail === 'fin') poly(x, [[tx - 3, ty], [tx + 10, ty - 9], [tx + 8, ty + 6]], c3 && L.b !== 'salamander' ? c3 : c2);
      if (L.tail === 'thin') { x.strokeStyle = G.shade(c, -0.1); x.lineWidth = 2; x.lineCap = 'round'; x.beginPath(); x.moveTo(tx, ty); x.quadraticCurveTo(tx + 12, ty + 2, tx + 10, ty - 10); x.stroke(); }
      if (L.tail === 'bolt') bolt(x, tx, ty, 1, c3 || '#f8d030');
      if (L.tail === 'fluffy') ell(x, tx + 5, ty - 6, 7, 9, c2, 0.4);
      if (L.wings) { const [bx, by] = A.back; ell(x, bx - 12, by - 6, 7, 12, c3 || '#e8f0ff', -0.6); ell(x, bx + 12, by - 6, 7, 12, c3 || '#e8f0ff', 0.6); }
      if (L.spikes) { const [bx, by] = A.back; for (let i = -2; i <= 2; i++) poly(x, [[bx + i * 5 - 3, by + 3], [bx + i * 5, by - 7 + Math.abs(i) * 1.5], [bx + i * 5 + 3, by + 3]], c3 || G.shade(c, -0.3)); }
      return;
    }
    const top = A.top;
    if (L.ears === 'pointy') {
      poly(x, [[hx - hr + 1, hy - hr * 0.3], [hx - hr * 0.85, hy - hr - 6], [hx - hr * 0.15, hy - hr * 0.75]], c);
      poly(x, [[hx + hr - 1, hy - hr * 0.3], [hx + hr * 0.85, hy - hr - 6], [hx + hr * 0.15, hy - hr * 0.75]], c);
      poly(x, [[hx - hr * 0.75, hy - hr * 0.55], [hx - hr * 0.8, hy - hr - 3], [hx - hr * 0.35, hy - hr * 0.75]], c2);
      poly(x, [[hx + hr * 0.75, hy - hr * 0.55], [hx + hr * 0.8, hy - hr - 3], [hx + hr * 0.35, hy - hr * 0.75]], c2);
    }
    if (L.ears === 'round') { for (const s of [-1, 1]) { ell(x, hx + s * hr * 0.75, hy - hr * 0.8, 4.5, 4.5, c); ell(x, hx + s * hr * 0.75, hy - hr * 0.8, 2.5, 2.5, c2); } }
    if (L.ears === 'long') { for (const s of [-1, 1]) { ell(x, hx + s * hr * 0.5, hy - hr - 5, 3.5, 9, c, s * 0.2); ell(x, hx + s * hr * 0.5, hy - hr - 4, 1.8, 6, c2, s * 0.2); } }
    if (L.ears === 'fin') { for (const s of [-1, 1]) poly(x, [[hx + s * hr * 0.8, hy - 2], [hx + s * (hr + 7), hy - 8], [hx + s * (hr + 5), hy + 3]], c2); }
    if (L.crest === 'flame') flame(x, top[0], top[1] + 4, 0.9);
    if (L.crest === 'leaf') {
      rect(x, top[0] - 0.5, top[1], 1.5, 5, c3 || '#3a8a3a');
      ell(x, top[0] - 4, top[1] - 1, 4, 2.5, c3 || '#4ab040', -0.5); ell(x, top[0] + 4, top[1] - 2, 4, 2.5, c3 || '#4ab040', 0.5);
    }
    if (L.crest === 'horn') poly(x, [[top[0] - 3, top[1] + 4], [top[0], top[1] - 8], [top[0] + 3, top[1] + 4]], c3 || '#f0e8d0');
    if (L.crest === 'crest') { for (const k of [-3, 0, 3]) poly(x, [[top[0] + k - 2, top[1] + 3], [top[0] + k * 1.6, top[1] - 7], [top[0] + k + 2, top[1] + 3]], c3 || c2); }
    if (L.crest === 'bolt') bolt(x, top[0] - 2, top[1] + 4, 0.75, c3 || '#f8d030');
    if (L.crest === 'gem') ell(x, hx, hy - hr * 0.55, 2.8, 2.8, c3 || '#f070b0');
    if (L.crest === 'moon') { ell(x, top[0], top[1] + 1, 4.5, 4.5, c3 || '#f0d040'); ell(x, top[0] + 2.5, top[1] - 0.5, 3.6, 3.6, c); }
    if (L.crest === 'moss') { const [bx, by] = A.back; for (const [dx, dy, r] of [[-6, -6, 4], [0, -8, 5], [6, -6, 4], [-12, -12, 3]]) ell(x, bx + dx, by + dy, r, r * 0.8, c3 || '#5ab040'); ell(x, bx - 1, by - 13, 2, 2, '#f0e060'); }
  }

  function eye(x, X, Y, L, A) {
    const r = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
    if (A.sleepy) { r(X - 2, Y, 4, 1, OL); return; }
    const w = A.big ? 4 : A.small ? 2 : 3, h = A.big ? 5 : A.small ? 3 : 4;
    r(X - 1, Y - 1, w + 1, h + 1, '#ffffff');
    r(X, Y, w, h, L.eye || OL);
    r(X, Y, 1, 1, '#ffffff');
    if (A.angry || L.mood === 'angry') r(X - 2, Y - 2, w + 2, 1, OL);
  }

  G.monster = function (id) {
    if (cache[id]) return cache[id];
    const sp = FC.data.MON[id];
    const L = sp.look;
    const c = G.canvas(64, 64), x = c.getContext('2d');
    x.imageSmoothingEnabled = true;
    const s = L.s || 1;
    const A0 = { head: [28, 30, 10], tail: [42, 44], top: [28, 20], back: [28, 30] };
    x.save();
    x.translate(32, 60); x.scale(s, s); x.translate(-28, -52);
    // Anker vorab bestimmen (erste Messung in Wegwerf-Canvas)
    const probe = G.canvas(64, 64).getContext('2d');
    const A = BODY[L.b](probe, L) || A0;
    if (A.float) { x.translate(0, -4); }
    features(x, L, A, 'back');
    BODY[L.b](x, L);
    features(x, L, A, 'front');
    // Schattierung nur auf vorhandene Pixel
    x.globalCompositeOperation = 'source-atop';
    x.globalAlpha = 0.22; ell(x, 20, 22, 22, 15, '#ffffff');
    x.globalAlpha = 0.26; ell(x, 40, 58, 30, 18, '#000000');
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
    x.restore();
    G.quantize(c);
    const T = (ax, ay) => [Math.round(32 + (ax - 28) * s), Math.round(60 + (ay - 52) * s - (A.float ? 4 * s : 0))];
    for (const [ex, ey] of A.eyes) { const [X, Y] = T(ex, ey); eye(x, X, Y, L, A); }
    if (A.mouth) { const [X, Y] = T(A.mouth[0], A.mouth[1]); x.fillStyle = OL; x.fillRect(X - 1, Y, 3, 1); if (L.mood !== 'angry' && !A.angry) { x.fillRect(X - 2, Y - 1, 1, 1); x.fillRect(X + 2, Y - 1, 1, 1); } }
    G.outline(c, OL);
    cache[id] = c;
    return c;
  };
  G.monsterBack = function (id) {
    const k = 'b' + id;
    if (cache[k]) return cache[k];
    cache[k] = G.flip(G.monster(id));
    return cache[k];
  };
  G.monsterSil = function (id, col) {
    const k = 's' + id + col;
    if (cache[k]) return cache[k];
    cache[k] = G.tint(G.monster(id), col);
    return cache[k];
  };
})();

</script>
<script>
'use strict';
/* Eingabe: Touch-Steuerkreuz, A/B, Menü, Tastatur, Antippen.
   Eingaben gehen an die oberste "Ebene" (Welt, Dialog, Menü, Kampf …). */
FC.input = (function () {
  const U = FC.U;
  const held = { up: false, down: false, left: false, right: false, a: false, b: false };
  let dirStack = [];
  const layers = [];

  function top() { return layers[layers.length - 1] || null; }
  function fire(btn, arg) {
    const l = top();
    if (!l) return;
    FC.audio && FC.audio.unlock();
    const fn = l['on' + btn];
    if (fn) fn.call(l, arg);
  }
  function setDir(d, on) {
    if (on) {
      if (!held[d]) { held[d] = true; dirStack = dirStack.filter(x => x !== d); dirStack.push(d); fire('Dir', d); }
    } else if (held[d]) { held[d] = false; dirStack = dirStack.filter(x => x !== d); }
  }

  // ── Tastatur ──
  const KEYMAP = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    KeyZ: 'a', Space: 'a', Enter: 'a', KeyX: 'b', Backspace: 'b', ShiftLeft: 'b', ShiftRight: 'b', Escape: 'start', KeyM: 'start',
  };
  window.addEventListener('keydown', e => {
    const k = KEYMAP[e.code];
    if (!k) return;
    if (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    e.preventDefault();
    if (k === 'a' || k === 'b') { const was = held[k]; held[k] = true; if (!e.repeat && !was) fire(k === 'a' ? 'A' : 'B'); }
    else if (k === 'start') { if (!e.repeat) fire('Start'); }
    else setDir(k, true);
  });
  window.addEventListener('keyup', e => {
    const k = KEYMAP[e.code];
    if (!k) return;
    if (k === 'a' || k === 'b') held[k] = false;
    else if (k !== 'start') setDir(k, false);
  });
  window.addEventListener('blur', () => { for (const d of ['up', 'down', 'left', 'right']) setDir(d, false); held.a = held.b = false; });

  // ── Touch ──
  function bindTouch() {
    const dpad = U.$('dpad');
    const arms = { up: dpad.querySelector('.dp-up'), down: dpad.querySelector('.dp-down'), left: dpad.querySelector('.dp-left'), right: dpad.querySelector('.dp-right') };
    let dpId = null, cur = null;
    const upd = e => {
      const r = dpad.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      let d = null;
      if (Math.hypot(dx, dy) > 12) d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      if (d !== cur) {
        if (cur) { setDir(cur, false); arms[cur].classList.remove('on'); }
        cur = d;
        if (cur) { setDir(cur, true); arms[cur].classList.add('on'); }
      }
    };
    const end = e => {
      if (e.pointerId !== dpId) return;
      dpId = null;
      if (cur) { setDir(cur, false); arms[cur].classList.remove('on'); cur = null; }
    };
    dpad.addEventListener('pointerdown', e => { e.preventDefault(); dpId = e.pointerId; try { dpad.setPointerCapture(e.pointerId); } catch (_) {} FC.input.cancelAuto(); upd(e); });
    dpad.addEventListener('pointermove', e => { if (e.pointerId === dpId) upd(e); });
    dpad.addEventListener('pointerup', end);
    dpad.addEventListener('pointercancel', end);
    dpad.addEventListener('lostpointercapture', end);

    for (const [id, k] of [['btn-a', 'a'], ['btn-b', 'b']]) {
      const el = U.$(id);
      el.addEventListener('pointerdown', e => { e.preventDefault(); held[k] = true; el.classList.add('on'); fire(k === 'a' ? 'A' : 'B'); });
      const rel = () => { held[k] = false; el.classList.remove('on'); };
      el.addEventListener('pointerup', rel); el.addEventListener('pointercancel', rel); el.addEventListener('pointerleave', rel);
    }
    U.$('btn-menu').addEventListener('click', () => fire('Start'));

    // Antippen der Spielfläche
    const cv = U.$('screen');
    let sx = 0, sy = 0, st = 0;
    cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = performance.now(); FC.audio && FC.audio.unlock(); });
    cv.addEventListener('pointerup', e => {
      if (Math.hypot(e.clientX - sx, e.clientY - sy) > 24 || performance.now() - st > 600) return;
      const l = top();
      if (!l) return;
      if (l.onTap) l.onTap(e.clientX, e.clientY);
      else if (l.onA) fire('A');
    });

    // Zoom- und Scroll-Gesten verhindern
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());
    document.addEventListener('touchmove', e => {
      if (!e.target.closest || !e.target.closest('.sheet-body, #choice, #title, textarea, input[type=range]')) e.preventDefault();
    }, { passive: false });
    document.addEventListener('contextmenu', e => e.preventDefault());
  }

  return {
    held, bindTouch, fire,
    dir() { return dirStack.length ? dirStack[dirStack.length - 1] : null; },
    push(l) { layers.push(l); return l; },
    pop(l) { const i = layers.lastIndexOf(l); if (i >= 0) layers.splice(i, 1); },
    top,
    isTop(l) { return top() === l; },
    clear() { layers.length = 0; },
    cancelAuto() { if (FC.world) FC.world.autoPath = null; },
  };
})();

</script>
<script>
'use strict';
/* Chiptune-Audio über WebAudio: eigene Musikstücke + Soundeffekte (keine Fremddateien).
   iOS erfordert eine Berührung, bevor Ton abgespielt werden darf → unlock(). */
FC.audio = (function () {
  let ctx = null, master = null, musicGain = null, sfxGain = null, noiseBuf = null;
  let vol = { music: 0.55, sfx: 0.8 };
  let current = null, timer = null;

  const NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
  function freq(n) {
    const m = /^([A-G]#?)(\d)$/.exec(n);
    if (!m) return 0;
    const midi = 12 * (+m[2] + 1) + NOTE[m[1]];
    return 440 * Math.pow(2, (midi - 69) / 12);
  }
  function parse(str) { return str.trim().split(/\s+/).map(t => { const [n, d] = t.split(':'); return [n, +d]; }); }

  // Eigene Kompositionen (Notenlängen in Achteln)
  const TRACKS = {
    town: { bpm: 112, voices: [
      { wave: 'square', gain: 0.10, notes: parse('C5:2 E5:2 G5:2 E5:2 F5:2 A5:2 G5:4 E5:2 D5:2 C5:2 D5:2 E5:4 G4:4 C5:2 E5:2 G5:2 C6:2 B5:2 A5:2 G5:4 F5:2 E5:2 D5:2 E5:2 C5:8') },

      { wave: 'noise', gain: 0.035, notes: parse('x:2 -:2 x:1 x:1 -:2 x:2 -:2 x:1 x:1 -:2') },

    indoor: { bpm: 96, voices: [
      { wave: 'triangle', gain: 0.16, notes: parse('E5:2 G5:2 C6:4 B5:2 G5:2 A5:4 F5:2 A5:2 D6:4 C6:2 B5:2 G5:4 E5:2 G5:2 C6:4 D6:2 E6:2 D6:4 C6:2 B5:2 A5:2 B5:2 C6:8') },

    battle: { bpm: 168, voices: [

      { wave: 'triangle', gain: 0.24, notes: parse('A2:1 A3:1 A2:1 A3:1 A2:1 A3:1 A2:1 A3:1 G2:1 G3:1 G2:1 G3:1 G2:1 G3:1 G2:1 G3:1 F2:1 F3:1 F2:1 F3:1 F2:1 F3:1 F2:1 F3:1 E2:1 E3:1 E2:1 E3:1 E2:1 E3:1 E2:1 E3:1') },
      { wave: 'noise', gain: 0.05, notes: parse('x:1 -:1 x:1 x:1') },
    ] },
    boss: { bpm: 184, voices: [
      { wave: 'square', gain: 0.09, notes: parse('E5:1 E5:1 D5:1 E5:1 G5:2 E5:2 D5:1 D5:1 C5:1 D5:1 F5:2 D5:2 C5:1 C5:1 B4:1 C5:1 E5:2 C5:2 B4:2 G#4:2 B4:2 E5:2') },
      { wave: 'square', gain: 0.05, notes: parse('A3:2 E4:2 A3:2 E4:2 G3:2 D4:2 G3:2 D4:2 F3:2 C4:2 F3:2 C4:2 E3:2 B3:2 E3:2 G#3:2') },
      { wave: 'triangle', gain: 0.24, notes: parse('A2:2 A2:2 A2:2 A2:2 G2:2 G2:2 G2:2 G2:2 F2:2 F2:2 F2:2 F2:2 E2:2 E2:2 E2:2 E2:2') },
      { wave: 'noise', gain: 0.06, notes: parse('x:1 x:1 -:1 x:1') },
    ] },
    title: { bpm: 100, voices: [
      { wave: 'square', gain: 0.09, notes: parse('E5:3 D5:1 C5:2 G4:2 A4:3 B4:1 C5:4 E5:3 F5:1 G5:2 E5:2 D5:8 C5:3 D5:1 E5:2 G5:2 A5:3 G5:1 E5:4 F5:2 E5:2 D5:2 B4:2 C5:8') },
      { wave: 'triangle', gain: 0.22, notes: parse('C3:8 F3:8 C3:8 G3:8 A2:8 E3:8 F3:4 G3:4 C3:8') },
    ] },
  };
  const JINGLES = {
    victory: { bpm: 150, notes: parse('C5:1 E5:1 G5:1 C6:3 A5:1 B5:1 C6:4') },
    heal: { bpm: 140, notes: parse('C5:1 E5:1 G5:1 E5:1 C6:2 G5:2 C6:4') },
    item: { bpm: 170, notes: parse('G5:1 B5:1 D6:1 G6:3') },
    badge: { bpm: 130, notes: parse('C5:1 E5:1 G5:1 C6:2 G5:1 C6:1 E6:2 D6:1 E6:1 G6:4') },
    evolve: { bpm: 120, notes: parse('C5:1 D5:1 E5:1 G5:1 C6:2 E6:2 G6:4') },
  };

  function unlock() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = vol.music; musicGain.connect(master);
      sfxGain = ctx.createGain(); sfxGain.gain.value = vol.sfx; sfxGain.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      if (pending) { const p = pending; pending = null; play(p); }
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function tone(dest, f, t, dur, wave, g) {
    if (wave === 'noise') {
      const s = ctx.createBufferSource(); s.buffer = noiseBuf;
      const gg = ctx.createGain(); gg.gain.setValueAtTime(g, t); gg.gain.exponentialRampToValueAtTime(0.001, t + Math.min(dur, 0.08));
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
      s.connect(hp); hp.connect(gg); gg.connect(dest); s.start(t); s.stop(t + 0.1);
      return;
    }
    const o = ctx.createOscillator(); o.type = wave; o.frequency.setValueAtTime(f, t);
    const gg = ctx.createGain();
    gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(g, t + 0.01);
    gg.gain.setValueAtTime(g, t + Math.max(0.02, dur - 0.04)); gg.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(gg); gg.connect(dest); o.start(t); o.stop(t + dur + 0.02);
  }

  let pending = null;
  function play(name) {
    if (!ctx) { pending = name; return; }
    if (current && current.name === name) return;
    stop();
    const tr = TRACKS[name];
    if (!tr) return;
    const eighth = 60 / tr.bpm / 2;
    current = { name, voices: tr.voices.map(v => ({ v, i: 0, t: ctx.currentTime + 0.08 })) };
    const cur = current;
    timer = setInterval(() => {
      if (cur !== current) return;
      const horizon = ctx.currentTime + 0.25;
      for (const vs of cur.voices) {
        while (vs.t < horizon) {
          const [n, d] = vs.v.notes[vs.i];
          const dur = d * eighth;
          if (n !== '-') tone(musicGain, n === 'x' ? 0 : freq(n), vs.t, dur * 0.92, vs.v.wave, vs.v.gain);
          vs.t += dur; vs.i = (vs.i + 1) % vs.v.notes.length;
        }
      }
    }, 60);
  }
  function stop() { if (timer) clearInterval(timer); timer = null; current = null; pending = null; }

  function jingle(name) {
    if (!ctx) return 0;
    const j = JINGLES[name];
    const eighth = 60 / j.bpm / 2;
    let t = ctx.currentTime + 0.05;
    for (const [n, d] of j.notes) { tone(sfxGain, freq(n), t, d * eighth * 0.95, 'square', 0.12); tone(sfxGain, freq(n) / 2, t, d * eighth * 0.95, 'triangle', 0.16); t += d * eighth; }
    return (t - ctx.currentTime) * 1000;
  }

  // Soundeffekte
  function sfx(name) {
    if (!ctx) return;
    const t = ctx.currentTime;
    const g = sfxGain;
    const sweep = (f1, f2, dur, wave, gain) => {
      const o = ctx.createOscillator(); o.type = wave; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      const gg = ctx.createGain(); gg.gain.setValueAtTime(gain, t); gg.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(gg); gg.connect(g); o.start(t); o.stop(t + dur + 0.02);
    };
    switch (name) {
      case 'blip': tone(g, 880, t, 0.05, 'square', 0.08); break;
      case 'blip_soft': tone(g, 1320, t, 0.018, 'square', 0.025); break;
      case 'select': tone(g, 660, t, 0.05, 'square', 0.08); tone(g, 990, t + 0.05, 0.07, 'square', 0.08); break;
      case 'back': tone(g, 520, t, 0.05, 'square', 0.07); tone(g, 390, t + 0.05, 0.06, 'square', 0.07); break;
      case 'bump': sweep(140, 70, 0.08, 'square', 0.12); break;
      case 'door': sweep(300, 600, 0.12, 'triangle', 0.25); break;
      case 'hit': tone(g, 0, t, 0.12, 'noise', 0.35); sweep(220, 60, 0.15, 'square', 0.12); break;
      case 'superhit': tone(g, 0, t, 0.2, 'noise', 0.45); sweep(320, 50, 0.25, 'square', 0.16); break;
      case 'weakhit': tone(g, 0, t, 0.08, 'noise', 0.2); break;
      case 'faint': sweep(600, 80, 0.6, 'square', 0.12); break;
      case 'throw': sweep(300, 900, 0.25, 'triangle', 0.25); break;
      case 'shake': tone(g, 200, t, 0.06, 'square', 0.1); tone(g, 160, t + 0.07, 0.06, 'square', 0.1); break;
      case 'catch': tone(g, 784, t, 0.08, 'square', 0.1); tone(g, 1046, t + 0.09, 0.15, 'square', 0.1); break;
      case 'levelup': [523, 659, 784, 1046].forEach((f, i) => tone(g, f, t + i * 0.07, 0.08, 'square', 0.1)); break;
      case 'encounter': [392, 440, 523, 587, 659, 784].forEach((f, i) => tone(g, f, t + i * 0.05, 0.06, 'square', 0.1)); break;
      case 'stat_up': sweep(400, 1200, 0.3, 'triangle', 0.25); break;
      case 'stat_down': sweep(1200, 300, 0.3, 'triangle', 0.25); break;
      case 'heal': sweep(500, 1000, 0.35, 'sine', 0.25); break;
      case 'exclaim': tone(g, 1200, t, 0.08, 'square', 0.1); tone(g, 1500, t + 0.08, 0.1, 'square', 0.1); break;
      case 'save': [784, 988, 1175].forEach((f, i) => tone(g, f, t + i * 0.08, 0.08, 'triangle', 0.2)); break;
    }
  }

  function setVolume(kind, v) {
    vol[kind] = v;
    if (kind === 'music' && musicGain) musicGain.gain.value = v;
    if (kind === 'sfx' && sfxGain) sfxGain.gain.value = v;
  }

  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return { unlock, play, stop, sfx, jingle, setVolume, get vol() { return vol; }, get playing() { return current && current.name; } };
})();

<script>
'use strict';
/* Speichersystem: 3 Speicherplätze in localStorage, Versionierung + Migration, Export/Import als Code. */
FC.save = (function () {
  const PREFIX = 'aurelia_slot_';
  const SETTINGS = 'aurelia_settings';
  const SLOTS = 3;
  let ok = true;
  try { const k = '__aurelia_test'; localStorage.setItem(k, '1'); localStorage.removeItem(k); } catch (e) { ok = false; }

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

  // Migrationen: jede Funktion hebt einen Spielstand um eine Version an
  const MIGRATIONS = {
    // 0 → 1: frühe Testversionen ohne "dex"/"taken"
    0: s => { s.dex = s.dex || { seen: {}, caught: {} }; s.taken = s.taken || {}; s.defeated = s.defeated || {}; return s; },
  };
  function migrate(s) {
    if (!s || typeof s !== 'object') return null;
    let v = s.version || 0;
    while (v < FC.SAVE_VERSION) {
      if (MIGRATIONS[v]) s = MIGRATIONS[v](s);
      v++; s.version = v;
    }
    // Pflichtfelder absichern
    s.flags = s.flags || {}; s.bag = s.bag || {}; s.box = s.box || []; s.party = s.party || [];
    s.settings = s.settings || {};
    return s;
  }

  return {
    available: () => ok,
    SLOTS,
    list() {
      const out = [];
      for (let i = 1; i <= SLOTS; i++) {
        const raw = get(PREFIX + i);
        if (!raw) { out.push(null); continue; }
        try { const s = JSON.parse(raw); out.push({ slot: i, name: s.player.name, badges: s.flags.badge1 ? 1 : 0, caught: Object.keys(s.dex.caught || {}).length, time: s.playtime || 0, saved: s.savedAt, map: s.player.map }); }
        catch (e) { out.push({ slot: i, broken: true }); }
      }
      return out;
    },
    load(slot) {
      const raw = get(PREFIX + slot);
      if (!raw) return null;
      try { return migrate(JSON.parse(raw)); } catch (e) { return null; }
    },
    write(slot, state) {
      state.version = FC.SAVE_VERSION;
      state.savedAt = Date.now();
      return set(PREFIX + slot, JSON.stringify(state));
    },
    remove(slot) { del(PREFIX + slot); },
    lastSlot() { return +(get('aurelia_last_slot') || 0) || null; },
    setLastSlot(n) { set('aurelia_last_slot', String(n)); },
    exportCode(state) {
      const json = JSON.stringify(state);
      return 'AUR1:' + btoa(unescape(encodeURIComponent(json)));
    },
    importCode(code) {
      code = String(code || '').trim();
      if (!code.startsWith('AUR1:')) throw new Error('Ungültiger Code');
      const json = decodeURIComponent(escape(atob(code.slice(5))));
      const s = migrate(JSON.parse(json));
      if (!s || !s.player || !Array.isArray(s.party)) throw new Error('Spielstand unvollständig');
      return s;
    },
    loadSettings() {
      try { return Object.assign({ music: 0.55, sfx: 0.8, textSpeed: 2 }, JSON.parse(get(SETTINGS) || '{}')); }
      catch (e) { return { music: 0.55, sfx: 0.8, textSpeed: 2 }; }
    },
    saveSettings(s) { set(SETTINGS, JSON.stringify(s)); },
  };
})();

</script>
<script>
'use strict';
/* Monster-Instanzen: Werte, Erfahrung, Level-Aufstieg, Attacken, Entwicklung */
FC.mon = (function () {
  const D = FC.data, U = FC.U;
  const KEYS = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'];

  function sp(m) { return D.MON[m.sp]; }
  function expFor(lvl) { return lvl <= 1 ? 0 : Math.floor(lvl * lvl * lvl * 0.5); }
  function movesAt(spId, lvl) {
    const ls = D.MON[spId].ls.filter(([l]) => l <= lvl).map(([, m]) => m);
    const uniq = [];
    for (const m of ls) { const i = uniq.indexOf(m); if (i >= 0) uniq.splice(i, 1); uniq.push(m); }
    return uniq.slice(-4);
  }
  function create(spId, lvl, opts = {}) {
    const iv = {};
    for (const k of KEYS) iv[k] = U.ri(0, 31);
    const m = {
      uid: U.uid(), sp: spId, lvl, exp: expFor(lvl), iv,
      moves: (opts.moves || movesAt(spId, lvl)).map(id => ({ id, pp: D.MOVES[id].pp })),
      status: null, slp: 0, hp: 0, nick: opts.nick || null,
    };
    m.hp = stats(m).hp;
    return m;
  }
  function stats(m) {
    const b = sp(m).b, o = {};
    KEYS.forEach((k, i) => {
      const base = Math.floor(((2 * b[i] + m.iv[k]) * m.lvl) / 100);
      o[k] = k === 'hp' ? base + m.lvl + 10 : base + 5;
    });
    return o;
  }
  function name(m) { return m.nick || sp(m).n; }
  function types(m) { return sp(m).t; }
  function maxHp(m) { return stats(m).hp; }
  function heal(m) {
    m.hp = maxHp(m); m.status = null; m.slp = 0;
    for (const mv of m.moves) mv.pp = D.MOVES[mv.id].pp;
  }
  function expProgress(m) {
    if (m.lvl >= 100) return 1;
    const a = expFor(m.lvl), b = expFor(m.lvl + 1);
    return U.clamp((m.exp - a) / (b - a), 0, 1);
  }
  // Fügt EP hinzu; liefert Ereignisliste [{type:'level', lvl}, {type:'learn', move}]
  function gainExp(m, amount) {
    const ev = [];
    if (m.lvl >= 100) return ev;
    m.exp += amount;
    while (m.lvl < 100 && m.exp >= expFor(m.lvl + 1)) {
      const before = maxHp(m);
      m.lvl++;
      const after = maxHp(m);
      if (m.hp > 0) m.hp += after - before;
      ev.push({ type: 'level', lvl: m.lvl });
      for (const [l, mv] of sp(m).ls) if (l === m.lvl && !m.moves.some(x => x.id === mv)) ev.push({ type: 'learn', move: mv });
      const e = sp(m).evo;
      if (e && e.lvl && m.lvl >= e.lvl) m.evoPending = e.to;
    }
    return ev;
  }
  function evolve(m) {
    const before = maxHp(m);
    const to = m.evoPending;
    m.sp = to; m.evoPending = null;
    m.hp = Math.max(1, m.hp + maxHp(m) - before);
    const learned = [];
    for (const [l, mv] of sp(m).ls) if (l === m.lvl && !m.moves.some(x => x.id === mv)) learned.push(mv);
    return learned;
  }
  function expYield(enemy, trainer) {
    return Math.max(1, Math.floor((sp(enemy).xp * enemy.lvl) / 5 * (trainer ? 1.5 : 1)));
  }
  return { create, stats, name, types, maxHp, heal, expFor, expProgress, gainExp, evolve, movesAt, expYield, sp };
})();

</script>
<script>
'use strict';
/* UI-Bausteine: Dialoge mit Schreibmaschinen-Effekt, Auswahlmenüs, Toasts, Überblendungen, Eingabe */
FC.ui = (function () {
  const U = FC.U;
  const dlg = () => U.$('dialog');

  function cps() { const s = (FC.settings && FC.settings.textSpeed) || 2; return [0, 28, 50, 110][s] || 50; }

  // Text tippen; gibt Steuerobjekt zurück
  function typeInto(el, text, done) {
    let i = 0, finished = false, raf = null, last = performance.now(), acc = 0;
    el.textContent = '';
    const step = now => {
      acc += (now - last) * cps() / 1000; last = now;
      const n = Math.floor(acc);
      if (n > 0) { acc -= n; i = Math.min(text.length, i + n); el.textContent = text.slice(0, i); if (i % 3 === 0 && text[i - 1] !== ' ') FC.audio.sfx('blip_soft'); }
      if (i >= text.length) { finished = true; done && done(); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return {
      get done() { return finished; },
      skip() { if (finished) return; cancelAnimationFrame(raf); i = text.length; el.textContent = text; finished = true; done && done(); },
    };
  }

  function fill(text, vars) {
    const s = FC.state;
    return String(text).replace(/\{name\}/g, s ? s.player.name : 'Du').replace(/\{rival\}/g, 'Kai');
  }

  // Ein oder mehrere Textseiten anzeigen
  function say(lines, name, opts = {}) {
    if (!Array.isArray(lines)) lines = [lines];
    lines = lines.map(fill);
    return new Promise(resolve => {
      const box = dlg(), txt = U.$('dialog-text');
      U.$('dialog-name').textContent = name || '';
      box.classList.remove('hidden');
      let idx = 0, ctl = null;
      const layer = FC.input.push({
        name: 'dialog',
        onA: adv, onB: adv, onTap: adv, onStart: () => {},
      });
      const onDown = e => { e.preventDefault(); adv(); };
      box.addEventListener('pointerdown', onDown);
      function show() {
        box.classList.remove('ready');
        ctl = typeInto(txt, lines[idx], () => box.classList.add('ready'));
      }
      function adv() {
        if (!ctl) return;
        if (!ctl.done) { ctl.skip(); return; }
        idx++;
        if (idx >= lines.length) {
          FC.input.pop(layer); box.removeEventListener('pointerdown', onDown);
          if (!opts.keep) box.classList.add('hidden');
          resolve();
          return;
        }
        FC.audio.sfx('blip');
        show();
      }
      show();
    });
  }

  // Auswahl: optionaler Fragetext im Dialog, dann Liste. Rückgabe: Index oder -1
  async function choose(question, options, opts = {}) {
    if (question) await say(question, opts.name, { keep: true });
    return new Promise(resolve => {
      const box = U.$('choice');
      box.innerHTML = '';
      box.classList.remove('hidden');
      let sel = 0;
      const btns = options.map((o, i) => {
        const b = U.el('button', 'choice-btn', U.esc(o));
        b.addEventListener('click', e => { e.preventDefault(); finish(i); });
        box.appendChild(b);
        return b;
      });
      const mark = () => btns.forEach((b, i) => b.classList.toggle('sel', i === sel));
      mark();
      const cancel = opts.cancel !== false;
      const layer = FC.input.push({
        name: 'choice',
        onDir(d) { if (d === 'up') sel = (sel + options.length - 1) % options.length; if (d === 'down') sel = (sel + 1) % options.length; FC.audio.sfx('blip'); mark(); },
        onA() { finish(sel); },
        onB() { if (cancel) finish(-1); },
        onStart() {},
      });
      function finish(i) {
        FC.input.pop(layer);
        box.classList.add('hidden');
        dlg().classList.add('hidden');
        FC.audio.sfx(i < 0 ? 'back' : 'select');
        resolve(i);
      }
    });
  }
  async function yesNo(q, name) { return (await choose(q, ['Ja', 'Nein'], { name })) === 0; }

  let toastT = null;
  function toast(text, ms = 2200) {
    const t = U.$('toast');
    t.textContent = text; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
  }
  let mapNameT = null;
  function mapName(text) {
    const el = U.$('map-name');
    el.textContent = text; el.classList.add('show');
    clearTimeout(mapNameT); mapNameT = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function fade(on, white, ms = 260) {
    const f = U.$('fade');
    f.classList.toggle('white', !!white);
    f.style.transitionDuration = ms + 'ms';
    f.classList.toggle('on', on);
    return new Promise(r => setTimeout(r, ms + 20));
  }

  // Panel-Grundgerüst (Menüs); gibt {sheet, body, close} zurück
  function sheet(title, opts = {}) {
    const panel = U.$('panel');
    panel.innerHTML = '';
    panel.classList.remove('hidden');
    const sh = U.el('div', 'sheet');
    const head = U.el('div', 'sheet-head');
    head.appendChild(U.el('h2', '', U.esc(title)));
    if (opts.money) head.appendChild(U.el('span', 'money', U.money(FC.state.money)));
    const x = U.el('button', 'x-btn', '✕');
    x.setAttribute('aria-label', 'Schließen');
    head.appendChild(x);
    const body = U.el('div', 'sheet-body');
    sh.appendChild(head); sh.appendChild(body); panel.appendChild(sh);
    return { panel, sheet: sh, body, head, closeBtn: x };
  }
  function closePanel() { const p = U.$('panel'); p.classList.add('hidden'); p.innerHTML = ''; }

  // Monster-Vorschaukarte (z. B. bei der Starter-Wahl)
  function monCard(spId) {
    const sp = FC.data.MON[spId];
    const panel = U.$('panel');
    panel.innerHTML = '';
    panel.classList.remove('hidden');
    panel.style.alignItems = 'flex-start';
    const sh = U.el('div', 'sheet');
    sh.style.maxWidth = '360px'; sh.style.marginTop = '4vh';
    const body = U.el('div', 'sheet-body');
    const cv = monCanvas(spId, 128);
    cv.style.width = '128px'; cv.style.height = '128px';
    const wrap = U.el('div', 'detail');
    wrap.appendChild(cv);
    wrap.appendChild(U.el('div', '', `<div style="font-size:24px;font-weight:700">${U.esc(sp.n)}</div><div style="margin:6px 0">${sp.t.map(FC.data.typeChip).join('')}</div><div style="font-size:15px;color:#5a4e66">${U.esc(sp.dex)}</div>`));
    body.appendChild(wrap); sh.appendChild(body); panel.appendChild(sh);
    return () => { panel.style.alignItems = ''; closePanel(); };
  }
  function monCanvas(spId, size = 64, sil) {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    x.drawImage(sil ? FC.gfx.monsterSil(spId, '#2a2236') : FC.gfx.monster(spId), 0, 0);
    return c;
  }

  // Texteingabe (Spielername)
  function prompt(title, def, max = 10) {
    return new Promise(resolve => {
      const ui = sheet(title);
      ui.closeBtn.remove();
      ui.sheet.style.maxWidth = '420px';
      const inp = U.el('input');
      inp.type = 'text'; inp.value = def; inp.maxLength = max;
      inp.autocomplete = 'off'; inp.spellcheck = false;
      Object.assign(inp.style, { width: '100%', fontSize: '22px', padding: '12px', border: '3px solid #2a2036', borderRadius: '12px', fontFamily: 'inherit', userSelect: 'text', webkitUserSelect: 'text' });
      const ok = U.el('button', 'btn primary', 'Bestätigen');
      const row = U.el('div', 'btn-row'); row.appendChild(ok);
      ui.body.appendChild(inp); ui.body.appendChild(row);
      const layer = FC.input.push({ name: 'prompt', onA() {}, onB() {}, onStart() {} });
      const done = () => {
        const v = inp.value.trim().replace(/[<>]/g, '').slice(0, max) || def;
        FC.input.pop(layer); closePanel(); FC.audio.sfx('select'); resolve(v);
      };
      ok.addEventListener('click', done);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); done(); } });
      setTimeout(() => { try { inp.focus(); inp.select(); } catch (_) {} }, 50);
    });
  }

  return { say, choose, yesNo, toast, mapName, fade, sheet, closePanel, monCard, monCanvas, prompt, fill };
})();
