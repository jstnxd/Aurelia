  /* ───────── Kampflogik ───────── */
  function calcDamage(att, def, mv, crit, avg) {
    const a = att.mon, d = def.mon, sa = M.stats(a), sd = M.stats(d);
    const phys = mv.c === 'phys';
    let as = att.st[phys ? 'atk' : 'spa'], ds = def.st[phys ? 'def' : 'spd'];
    if (crit) { as = Math.max(0, as); ds = Math.min(0, ds); }
    const A = (phys ? sa.atk : sa.spa) * stageMul(as), Dd = (phys ? sd.def : sd.spd) * stageMul(ds);
    let pow = mv.p;
    const pinch = { glutherz: 'feuer', sturzbach: 'wasser', wildwuchs: 'pflanze' }[ab(att)];
    if (pinch === mv.t && a.hp <= M.maxHp(a) / 3) pow *= 1.5;
    let dmg = Math.floor(Math.floor(Math.floor(2 * a.lvl / 5 + 2) * pow * A / Dd) / 50) + 2;
    if (phys && a.status === 'brn') dmg = Math.floor(dmg / 2);
    if (B.weather === 'rain') { if (mv.t === 'wasser') dmg *= 1.5; if (mv.t === 'feuer') dmg *= 0.5; }
    const stab = M.types(a).includes(mv.t) ? 1.5 : 1;
    let eff = D.typeEff(mv.t, M.types(d));
    if (mv.t === 'stein' && ab(def) === 'schwebe') eff = 0;
    dmg = dmg * stab * eff * (crit ? 1.5 : 1) * (avg ? 0.925 : U.ri(85, 100) / 100);
    return { dmg: eff > 0 ? Math.max(1, Math.floor(dmg)) : 0, eff };
  }

  async function inflict(side, st, quiet, source) {
    const m = side.mon;
    if (m.hp <= 0) return;
    if (m.status) { if (!quiet) await msg(`${nm(side)} ist bereits von einer Statusveränderung betroffen.`); return; }
    const t = M.types(m);
    if ((st === 'brn' && t.includes('feuer')) || (st === 'par' && t.includes('elektro'))) { if (!quiet) await msg(`Das hat keine Wirkung auf ${nm(side)} …`); return; }
    m.status = st;
    if (st === 'slp') m.slp = U.ri(2, 4);
    statusFx(side, st);
    FC.audio.sfx('stat_down');
    refreshInfo();
    if (source) await msg(`${source} von ${nmShort(side.isPlayer ? B.e : B.p)} wirkt!`);
    const txt = { brn: 'wurde verbrannt!', psn: 'wurde vergiftet!', par: 'ist paralysiert! Es kann sich eventuell nicht bewegen.', slp: 'ist eingeschlafen!' }[st];
    await msg(`${nm(side)} ${txt}`);
  }
  async function changeStats(side, changes) {
    for (const [k, v] of Object.entries(changes)) {
      if (k === 'acc' && v < 0 && ab(side) === 'scharfblick') { await msg(`Scharfblick verhindert, dass die Genauigkeit von ${nmShort(side)} sinkt!`); continue; }
      const cur = side.st[k];
      const nv = U.clamp(cur + v, -6, 6);
      if (nv === cur) { await msg(`${STAT_N[k]} von ${nmShort(side)} kann nicht weiter ${v > 0 ? 'steigen' : 'sinken'}!`); continue; }
      side.st[k] = nv;
      statFx(side, v > 0); FC.audio.sfx(v > 0 ? 'stat_up' : 'stat_down');
      await msg(`${STAT_N[k]} von ${nmShort(side)} ${v > 0 ? (v > 1 ? 'steigt stark' : 'steigt') : (v < -1 ? 'sinkt stark' : 'sinkt')}!`);
    }
  }

  async function doMove(att, def, moveId) {
    const a = att.mon, mv = D.MOVES[moveId];
    if (a.status === 'slp') {
      a.slp--;
      if (a.slp > 0) { statusFx(att, 'slp'); await msg(`${nm(att)} schläft tief und fest.`); return; }
      a.status = null; refreshInfo(); await msg(`${nm(att)} ist aufgewacht!`);
    }
    if (a.status === 'par' && U.chance(0.25)) { statusFx(att, 'par'); await msg(`${nm(att)} ist paralysiert! Es kann sich nicht bewegen!`); return; }
    const slot = a.moves.find(m => m.id === moveId);
    if (slot) slot.pp = Math.max(0, slot.pp - 1);
    await msg(`${nm(att)} setzt ${mv.n} ein!`, { wait: 500 });
    if (mv.a && !(mv.c === 'status' && mv.tgt === 'self')) {
      if (!U.chance((mv.a * accMul(att.st.acc)) / 100)) { await msg(`Die Attacke von ${nmShort(att)} ging daneben!`); return; }
    }
    if (mv.c === 'status') {
      const target = mv.tgt === 'self' ? att : def;
      if (mv.tgt === 'self') { await FC.anim.tween(att.spr, { dy: -6 }, 120); await FC.anim.tween(att.spr, { dy: 0 }, 120); }
      else typeFx(mv.t, def);
      if (mv.heal) {
        const max = M.maxHp(a);
        if (a.hp >= max) { await msg(`Die KP von ${nmShort(att)} sind bereits voll!`); return; }
        FC.audio.sfx('heal'); burst(...center(att), 14, { cols: ['#a0ffb0', '#ffffff'], vy: -40, speed: 30, life: 700, size: 3 });
        await setHp(att, a.hp + Math.floor(max * mv.heal));
        await msg(`${nm(att)} hat sich erholt!`);
      }
      if (mv.status) await inflict(target, mv.status);
      if (mv.stat) await changeStats(target, mv.stat);
      return;
    }
    if (mv.t === 'stein' && ab(def) === 'schwebe') { await msg(`${nm(def)} schwebt in der Luft und ist nicht betroffen!`); return; }
    const crit = U.chance(1 / 16);
    const { dmg, eff } = calcDamage(att, def, mv, crit);
    if (eff === 0) { await msg(`Das hat keine Wirkung auf ${nmShort(def)} …`); return; }
    await animAttack(att, def, mv);
    let real = Math.min(def.mon.hp, dmg), sturdy = false;
    if (ab(def) === 'felsenfest' && def.mon.hp === M.maxHp(def.mon) && dmg >= def.mon.hp) { real = def.mon.hp - 1; sturdy = true; }
    FC.audio.sfx(eff > 1 ? 'superhit' : eff < 1 ? 'weakhit' : 'hit');
    blink(def, 2); shake(def);
    await setHp(def, def.mon.hp - real);
    if (crit) await msg('Ein Volltreffer!', { wait: 700 });
    if (eff > 1) await msg('Das ist sehr effektiv!', { wait: 800 });
    else if (eff < 1) await msg('Das ist nicht sehr effektiv …', { wait: 800 });
    if (sturdy) await msg(`${nm(def)} hält dank Felsenfest durch!`);
    if (mv.drain && real > 0 && a.hp > 0 && a.hp < M.maxHp(a)) {
      await setHp(att, Math.min(M.maxHp(a), a.hp + Math.max(1, Math.floor(real * mv.drain))));
      await msg(`${nm(def)} wurde Energie entzogen!`);
    }
    if (mv.recoil && real > 0 && a.hp > 0) {
      await setHp(att, a.hp - Math.max(1, Math.floor(real * mv.recoil)));
      await msg(`${nm(att)} wird vom Rückstoß getroffen!`);
    }
    if (mv.eff && def.mon.hp > 0 && U.chance(mv.eff.chance)) {
      if (mv.eff.status) await inflict(def, mv.eff.status, true);
      if (mv.eff.stat) await changeStats(mv.eff.tgt === 'self' ? att : def, mv.eff.stat);
    }
    if (mv.c === 'phys' && a.hp > 0 && def.mon.hp > 0 && !a.status) {
      if (ab(def) === 'statik' && U.chance(0.3)) await inflict(att, 'par', true, 'Statik');
      else if (ab(def) === 'giftdorn' && U.chance(0.3)) await inflict(att, 'psn', true, 'Giftdorn');
    }
  }

  function aiPick(side, target, lvl) {
    const opts = side.mon.moves.filter(m => m.pp > 0);
    if (!opts.length) return 'rempler';
    if (!lvl) return U.pick(opts).id;
    let best = opts[0].id, bs = -1;
    for (const o of opts) {
      const mv = D.MOVES[o.id];
      let sc = 0;
      if (mv.c === 'status') {
        if (mv.status) sc = target.mon.status ? 0 : 42 * (mv.a || 100) / 100;
        else if (mv.heal) sc = side.mon.hp < M.maxHp(side.mon) * 0.45 ? 75 : 0;
        else if (mv.stat) {
          const k = Object.keys(mv.stat)[0];
          sc = side.turns < 1 ? 30 : 6;
          if (mv.tgt === 'self' && side.st[k] >= 2) sc = 0;
          if (mv.tgt === 'foe' && target.st[k] <= -2) sc = 0;
        }
      } else {
        const est = calcDamage(side, target, mv, false, true);
        sc = est.dmg * (mv.a || 100) / 100;
        if (lvl >= 2 && est.dmg >= target.mon.hp) sc += 300 + (mv.prio ? 100 : 0);
      }
      if (lvl === 1) sc *= 0.7 + Math.random() * 0.6;
      if (sc > bs) { bs = sc; best = o.id; }
    }
    return best;
  }
  function enemyChoose() {
    const e = B.e, lvl = B.kind === 'wild' ? 0 : (B.trainer.ai || 1);
    if (lvl >= 2 && B.items.supertrank > 0 && e.mon.hp > 0 && e.mon.hp < M.maxHp(e.mon) * 0.3) { B.items.supertrank--; return { type: 'item', item: 'supertrank' }; }
    return { type: 'move', id: aiPick(e, B.p, lvl) };
  }
  function speedOf(side) { let s = M.stats(side.mon).spe * stageMul(side.st.spe); if (side.mon.status === 'par') s *= 0.5; return s; }

  async function sendOut(side, mon, isPlayer) {
    const L = layout();
    side.mon = mon; side.dispHp = mon.hp; side.st = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, acc: 0 }; side.turns = 0;
    side.spr.show = true; side.spr.scale = 0; side.spr.white = 1; side.spr.alpha = 1; side.spr.dy = 0; side.spr.dx = 0; side.spr.clip = false;
    FC.game.seen(mon.sp);
    if (isPlayer) B.participants.add(mon.uid);
    refreshInfo();
    const [cx, base] = isPlayer ? L.p : L.e;
    burst(cx, base - 24, 16, { cols: ['#ffffff', '#ffe8a0'], speed: 90, life: 400 });
    FC.audio.sfx('throw');
    await FC.anim.tween(side.spr, { scale: 1 }, 320, 'outBack');
    await FC.anim.tween(side.spr, { white: 0 }, 220);
  }
  async function withdraw(side) {
    side.spr.white = 0;
    await FC.anim.tween(side.spr, { white: 1 }, 120);
    await FC.anim.tween(side.spr, { scale: 0 }, 220);
    side.spr.show = false; refreshInfo();
  }

  async function playerSwitch(idx, forced) {
    const s = S(), mon = s.party[idx];
    if (!forced) { await msg(`Komm zurück, ${nmShort(B.p)}!`, { wait: 600 }); await withdraw(B.p); }
    await sendOut(B.p, mon, true);
    await msg(`Los, ${M.name(mon)}!`, { wait: 600 });
  }

  async function useItemOn(k, idx, byEnemy) {
    const it = D.ITEMS[k];
    if (byEnemy) {
      await msg(`${B.trainer.name} setzt einen ${it.n} ein!`);
      FC.audio.sfx('heal');
      await setHp(B.e, B.e.mon.hp + it.heal);
      await msg(`${nm(B.e)} wurde geheilt!`);
      return;
    }
    const s = S(), m = s.party[idx];
    s.bag[k]--;
    await msg(`${s.player.name} setzt ${it.n} ein!`, { wait: 600 });
    const side = B.p.mon === m ? B.p : null;
    if (it.kind === 'heal') {
      FC.audio.sfx('heal');
      if (side) await setHp(side, m.hp + it.heal); else m.hp = Math.min(M.maxHp(m), m.hp + it.heal);
      await msg(`${M.name(m)} wurde geheilt!`);
    } else if (it.kind === 'cure') {
      m.status = null; m.slp = 0; refreshInfo(); FC.audio.sfx('heal');
      await msg(`${M.name(m)} ist wieder in Ordnung!`);
    } else if (it.kind === 'revive') {
      m.hp = Math.floor(M.maxHp(m) / 2); FC.audio.sfx('heal');
      await msg(`${M.name(m)} ist wieder bei Bewusstsein!`);
    }
  }

  async function throwBall(k) {
    const s = S(), it = D.ITEMS[k], e = B.e, L = layout();
    s.bag[k]--;
    await msg(`${s.player.name} wirft eine ${it.n}!`, { wait: 400 });
    FC.audio.sfx('throw');
    const [sx, sy] = [L.p[0] + 10, L.p[1] - 50], [tx, ty] = [L.e[0], L.e[1] - 40];
    B.ball = { x: sx, y: sy, col: it.c, glow: 0 };
    const prog = { t: 0 };
    const tw = FC.anim.tween(prog, { t: 1 }, 520, 'linear');
    const fly = () => { if (!B.ball) return; B.ball.x = U.lerp(sx, tx, prog.t); B.ball.y = U.lerp(sy, ty, prog.t) - Math.sin(prog.t * Math.PI) * 40; if (prog.t < 1) requestAnimationFrame(fly); };
    fly(); await tw;
    B.ball.glow = 1; e.spr.white = 1;
    await FC.anim.tween(e.spr, { scale: 0 }, 260);
    await FC.anim.tween(B.ball, { glow: 0, y: L.e[1] - 8 }, 300, 'inQuad');
    // Fangberechnung
    const mx = M.maxHp(e.mon), rate = D.MON[e.mon.sp].cr;
    const stb = e.mon.status === 'slp' ? 2 : e.mon.status ? 1.5 : 1;
    const a = ((3 * mx - 2 * e.mon.hp) * rate * it.rate) / (3 * mx) * stb;
    let shakes = 0;
    if (a >= 255) shakes = 4;
    else { const p = Math.pow(a / 255, 0.25); while (shakes < 4 && U.chance(p)) shakes++; }
    for (let i = 0; i < Math.min(3, shakes); i++) {
      await FC.anim.delay(320);
      FC.audio.sfx('shake');
      const bx = B.ball.x;
      for (const d of [-3, 3, -2, 0]) { B.ball.x = bx + d; await FC.anim.delay(55); }
    }
    await FC.anim.delay(300);
    if (shakes >= 4) {
      FC.audio.sfx('catch');
      burst(B.ball.x, B.ball.y, 14, { cols: ['#ffe060', '#ffffff'], speed: 60, life: 600 });
      FC.audio.jingle('victory');
      await msg(`Toll! ${M.name(e.mon)} wurde gefangen!`, { wait: 1400 });
      e.mon.status = null; e.mon.slp = 0;
      const where = FC.game.addMon(e.mon);
      if (where === 'box') await msg(`Dein Team ist voll. ${M.name(e.mon)} wurde in die Box am PC geschickt.`);
      else await msg(`${M.name(e.mon)} wurde ins Bestiarium eingetragen und schließt sich deinem Team an!`);
      return true;
    }
    B.ball = null;
    burst(L.e[0], L.e[1] - 20, 12, { cols: ['#ffffff'], speed: 80, life: 300 });
    await FC.anim.tween(e.spr, { scale: 1 }, 220, 'outBack');
    await FC.anim.tween(e.spr, { white: 0 }, 150);
    await msg(['Oh nein! Das Monster hat sich befreit!', 'Mist! Es hat sich losgerissen!', 'Argh! Fast hätte es geklappt!', 'Ganz knapp daneben!'][Math.min(3, shakes)]);
    return false;
  }

  async function tryRun() {
    B.escapes++;
    const ps = speedOf(B.p), es = speedOf(B.e);
    const ok = ab(B.p) === 'flinkfuss' || ps >= es || U.chance(((ps * 128) / Math.max(1, es) + 30 * B.escapes) / 256);
    if (ok) { FC.audio.sfx('back'); await msg('Du bist erfolgreich geflohen!'); return true; }
    await msg('Flucht gescheitert!');
    return false;
  }

  /* ───── EP, Level, neue Attacken ───── */
  async function learnMove(m, moveId, inBattle) {
    const mv = D.MOVES[moveId], n = M.name(m);
    const say = inBattle ? t => msg(t, { wait: 1200 }) : t => FC.ui.say(t);
    if (m.moves.some(x => x.id === moveId)) return;
    if (m.moves.length < 4) { m.moves.push({ id: moveId, pp: mv.pp }); FC.audio.sfx('levelup'); await say(`${n} hat ${mv.n} erlernt!`); return; }
    await say(`${n} möchte ${mv.n} erlernen, kennt aber bereits vier Attacken.`);
    const opts = m.moves.map(x => D.MOVES[x.id].n).concat([`${mv.n} nicht erlernen`]);
    let idx;
    if (inBattle) idx = await buttons(opts.map((o, i) => ({ html: U.esc(o) + (i < 4 ? `<small>${D.TYPES[D.MOVES[m.moves[i].id].t].n}</small>` : ''), style: i < 4 ? `background:${D.TYPES[D.MOVES[m.moves[i].id].t].c}` : '', cls: i === 4 ? 'back' : '', wide: i === 4 })), { prompt: `Welche Attacke soll ${n} vergessen?` });
    else idx = await FC.ui.choose(`Welche Attacke soll ${n} vergessen?`, opts);
    if (idx < 0 || idx >= 4) { await say(`${n} hat ${mv.n} nicht erlernt.`); return; }
    const old = D.MOVES[m.moves[idx].id].n;
    m.moves[idx] = { id: moveId, pp: mv.pp };
    await say(`1, 2 und … Schwupp! ${n} hat ${old} vergessen und ${mv.n} erlernt!`);
  }
  async function awardExp(enemyMon) {
    const s = S();
    const parts = s.party.filter(m => B.participants.has(m.uid) && m.hp > 0);
    if (!parts.length) return;
    const total = M.expYield(enemyMon, B.kind === 'trainer');
    const each = Math.max(1, Math.floor(total / parts.length));
    for (const m of parts) {
      await msg(`${M.name(m)} erhält ${each} Erfahrungspunkte!`, { wait: 800 });
      const ev = M.gainExp(m, each);
      for (const e of ev) {
        if (e.type === 'level') {
          FC.audio.sfx('levelup');
          if (B.p.mon === m) { B.p.dispHp = m.hp; refreshInfo(); burst(...center(B.p), 16, { cols: ['#ffe060', '#ffffff'], vy: -50, speed: 40, life: 700 }); }
          await msg(`${M.name(m)} erreicht Level ${e.lvl}!`, { wait: 1200 });
        } else if (e.type === 'learn') await learnMove(m, e.move, true);
      }
    }
  }

  /* ───── Entwicklung ───── */
  async function evolveScene(m) {
    const from = m.sp, to = m.evoPending, oldName = M.name(m);
    const sc = { t: 0, phase: 0, show: from, white: 1 };
    B.evoScene = {
      update(dt) { sc.t += dt; },
      draw(x, L) {
        const g = x.createRadialGradient(L.W / 2, L.H / 2, 10, L.W / 2, L.H / 2, Math.max(L.W, L.H) * 0.7);
        g.addColorStop(0, '#5a4a8a'); g.addColorStop(1, '#120e1c');
        x.fillStyle = g; x.fillRect(0, 0, L.W, L.H);
        const cx = Math.round(L.W / 2 - 64), cy = Math.round(Math.min(L.avail, L.H) / 2 - 70);
        const img = sc.white >= 1 ? G.monsterSil(sc.show, '#ffffff') : G.monster(sc.show);
        x.drawImage(img, cx, cy, 128, 128);
        if (sc.white > 0 && sc.white < 1) { x.globalAlpha = sc.white; x.drawImage(G.monsterSil(sc.show, '#ffffff'), cx, cy, 128, 128); x.globalAlpha = 1; }
      },
    };
    ui.enemy.classList.add('hidden'); ui.player.classList.add('hidden');
    sc.white = 0;
    await msg(`Nanu? ${oldName} entwickelt sich!`, { wait: 1200 });
    FC.audio.stop();
    await FC.anim.tween(sc, { white: 1 }, 600);
    let interval = 420;
    for (let i = 0; i < 12; i++) {
      sc.show = i % 2 ? from : to;
      FC.audio.sfx('blip');
      await FC.anim.delay(interval);
      interval = Math.max(70, interval * 0.8);
    }
    sc.show = to;
    const L = layout();
    burst(L.W / 2, Math.min(L.avail, L.H) / 2, 40, { cols: ['#ffffff', '#ffe060', '#c8b0ff'], speed: 140, life: 900, size: 3 });
    await FC.anim.tween(sc, { white: 0 }, 700);
    FC.audio.jingle('evolve');
    const learned = M.evolve(m);
    FC.game.caught(m.sp);
    await msg(`Glückwunsch! ${oldName} hat sich zu ${D.MON[to].n} entwickelt!`, { wait: 1800 });
    for (const mv of learned) await learnMove(m, mv, true);
    B.evoScene = null;
  }

  /* ───── Ablauf ───── */
  async function intro() {
    const s = S(), L = layout();
    B.p.spr.show = false; B.e.spr.show = false;
    B.pTrainer = { show: true, look: 'player', dir: 'up', dx: -L.W, alpha: 1 };
    if (B.kind === 'trainer') {
      B.eTrainer = { show: true, look: B.trainer.look, dir: 'down', dx: L.W, alpha: 1 };
      FC.anim.tween(B.pTrainer, { dx: 0 }, 600);
      await FC.anim.tween(B.eTrainer, { dx: 0 }, 600);
      await msg(`${B.trainer.name} fordert dich zum Kampf heraus!`);
      await FC.anim.tween(B.eTrainer, { dx: L.W, alpha: 0 }, 400);
      B.eTrainer.show = false;
      await sendOut(B.e, B.team[0], false);
      await msg(`${B.trainer.name} schickt ${M.name(B.team[0])} in den Kampf!`, { wait: 700 });
    } else {
      B.e.mon = B.team[0]; B.e.spr.show = true; B.e.spr.dx = L.W; B.e.spr.scale = 1;
      FC.game.seen(B.e.mon.sp);
      FC.anim.tween(B.pTrainer, { dx: 0 }, 600);
      await FC.anim.tween(B.e.spr, { dx: 0 }, 600);
      refreshInfo();
      FC.audio.sfx('encounter');
      await msg(B.special ? `Ein geheimnisvolles ${M.name(B.e.mon)} erscheint!` : `Ein wildes ${M.name(B.e.mon)} erscheint!`);
    }
    const first = s.party.findIndex(m => m.hp > 0);
    await FC.anim.tween(B.pTrainer, { dx: -L.W * 0.6, alpha: 0 }, 400);
    B.pTrainer.show = false;
    await sendOut(B.p, s.party[first], true);
    await msg(`Los, ${M.name(s.party[first])}!`, { wait: 600 });
    if (B.weather === 'rain') await msg('Es regnet. Wasser-Attacken werden stärker, Feuer-Attacken schwächer.');
  }

  async function handleFaints() {
    // Gegner besiegt?
    if (B.e.mon.hp <= 0 && B.e.spr.show) {
      FC.audio.sfx('faint');
      B.e.spr.clip = true;
      await FC.anim.tween(B.e.spr, { dy: 60, alpha: 0 }, 420, 'inQuad');
      B.e.spr.show = false; B.e.spr.clip = false; B.e.spr.dy = 0; refreshInfo();
      await msg(`${nm(B.e)} wurde besiegt!`);
      if (B.p.mon.hp > 0 || S().party.some(m => m.hp > 0)) await awardExp(B.e.mon);
      B.eIdx++;
      if (B.kind === 'trainer' && B.eIdx < B.team.length) {
        if (B.p.mon.hp > 0) {
          const nextName = M.name(B.team[B.eIdx]);
          await msg(`${B.trainer.name} wird gleich ${nextName} einsetzen.`, { wait: 900 });
        }
        B.participants = new Set(B.p.mon.hp > 0 ? [B.p.mon.uid] : []);
        if (B.p.mon.hp <= 0) { const r = await playerFainted(); if (r) return r; }
        await sendOut(B.e, B.team[B.eIdx], false);
        await msg(`${B.trainer.name} schickt ${M.name(B.team[B.eIdx])} in den Kampf!`, { wait: 700 });
        return null;
      }
      return 'win';
    }
    if (B.p.mon.hp <= 0 && B.p.spr.show) return playerFainted();
    return null;
  }
  async function playerFainted() {
    if (B.p.spr.show) {
      FC.audio.sfx('faint');
      B.p.spr.clip = true;
      await FC.anim.tween(B.p.spr, { dy: 60, alpha: 0 }, 420, 'inQuad');
      B.p.spr.show = false; B.p.spr.clip = false; B.p.spr.dy = 0; refreshInfo();
      await msg(`${M.name(B.p.mon)} wurde besiegt!`);
    }
    const s = S();
    if (!s.party.some(m => m.hp > 0)) return 'lose';
    const idx = await teamMenu(false, null, true);
    B.participants.add(s.party[idx].uid);
    await sendOut(B.p, s.party[idx], true);
    await msg(`Los, ${M.name(s.party[idx])}!`, { wait: 600 });
    return null;
  }

  async function endOfTurn() {
    for (const side of [B.p, B.e]) {
      const m = side.mon;
      if (m.hp <= 0 || !side.spr.show) continue;
      side.turns++;
      if (m.status === 'brn' || m.status === 'psn') {
        const dmg = Math.max(1, Math.floor(M.maxHp(m) / (m.status === 'brn' ? 16 : 8)));
        statusFx(side, m.status); blink(side, 1);
        await setHp(side, m.hp - dmg);
        await msg(m.status === 'brn' ? `${nm(side)} leidet unter seiner Verbrennung!` : `Das Gift schadet ${nmShort(side)}!`, { wait: 800 });
      }
    }
  }

  async function turn(act) {
    const eAct = enemyChoose();
    // Nicht-Attacken des Spielers zuerst
    if (act.type === 'run') { if (await tryRun()) return 'run'; }
    else if (act.type === 'switch') await playerSwitch(act.idx);
    else if (act.type === 'item') await useItemOn(act.item, act.target);
    else if (act.type === 'ball') { if (await throwBall(act.item)) return 'caught'; }
    if (eAct.type === 'item') await useItemOn(eAct.item, null, true);

    const order = [];
    if (act.type === 'move') order.push({ side: B.p, target: B.e, id: act.id, prio: D.MOVES[act.id].prio || 0 });
    if (eAct.type === 'move') order.push({ side: B.e, target: B.p, id: eAct.id, prio: D.MOVES[eAct.id].prio || 0 });
    order.sort((a, b) => (b.prio - a.prio) || (speedOf(b.side) - speedOf(a.side)) || (Math.random() - 0.5));
    for (const o of order) {
      if (o.side.mon.hp <= 0 || !o.side.spr.show || o.target.mon.hp <= 0) continue;
      if (o.side === B.p && act.struggle) await msg(`${nmShort(B.p)} hat keine AP mehr!`);
      await doMove(o.side, o.target, o.id);
      const r = await handleFaints();
      if (r) return r;
    }
    await endOfTurn();
    return handleFaints();
  }

  async function finish(result) {
    const s = S();
    if (result === 'win' && B.kind === 'trainer') {
      FC.audio.stop(); FC.audio.jingle('victory');
      await msg(`Du hast ${B.trainer.name} besiegt!`, { wait: 1300 });
      const L = layout();
      B.eTrainer = { show: true, look: B.trainer.look, dir: 'down', dx: L.W, alpha: 1 };
      await FC.anim.tween(B.eTrainer, { dx: 0 }, 500);
      await msg(B.trainer.lose, { wait: 2200 });
      s.money += B.trainer.pay;
      await msg(`${s.player.name} erhält ${U.money(B.trainer.pay)} für den Sieg.`, { wait: 1300 });
    } else if (result === 'win') {
      FC.audio.stop(); FC.audio.jingle('victory');
      await FC.anim.delay(300);
    } else if (result === 'lose' && B.kind === 'trainer') {
      const L = layout();
      B.eTrainer = { show: true, look: B.trainer.look, dir: 'down', dx: L.W, alpha: 1 };
      await FC.anim.tween(B.eTrainer, { dx: 0 }, 500);
      if (B.trainer.win) await msg(B.trainer.win, { wait: 1800 });
      if (B.trainer.noBlackout) await msg('Du hast verloren … aber das war erst der Anfang!');
    }
    // Entwicklungen
    if (result !== 'lose' && result !== 'run') {
      for (const m of s.party) if (m.evoPending && m.hp > 0) await evolveScene(m);
    }
    for (const m of s.party) m.evoPending = null;
  }

  async function start(opts) {
    if (B) return 'busy';
    const s = S();
    setBottomHeight();
    B = {
      kind: opts.kind, team: opts.team, trainer: opts.trainer || null, key: opts.key, special: !!opts.special,
      weather: opts.weather === 'rain' ? 'rain' : 'none', eIdx: 0, escapes: 0, time: 0, fx: [], flash: 0,
      bg: opts.special ? 'night' : (FC.world.map && FC.world.map.def.bg) || 'grass',
      items: Object.assign({}, (opts.trainer && opts.trainer.items) || {}),
      participants: new Set(),
      onA: null, onB: null, onDir: null, waiting: null,
    };
    B.p = makeSide(s.party.find(m => m.hp > 0) || s.party[0], true);
    B.e = makeSide(opts.team[0], false);
    const layer = FC.input.push({
      name: 'battle',
      onA() { if (B.waiting) B.waiting(); else if (B.onA) B.onA(); },
      onB() { if (B.waiting) B.waiting(); else if (B.onB) B.onB(); },
      onDir(d) { if (B.onDir) B.onDir(d); },
      onTap() { if (B.waiting) B.waiting(); },
      onStart() {},
    });
    // Übergang
    FC.audio.play(opts.music || 'battle');
    FC.audio.sfx('encounter');
    for (let i = 0; i < 2; i++) { await FC.ui.fade(true, true, 90); await FC.ui.fade(false, true, 90); }
    await FC.ui.fade(true, false, 200);
    FC.mode = 'battle';
    U.$('controls').classList.add('hidden'); U.$('hud').classList.add('hidden');
    ui.root.classList.remove('hidden');
    ui.msg.textContent = ''; ui.menu.innerHTML = '';
    refreshInfo();
    await FC.ui.fade(false, false, 220);

    let result = null;
    try {
      await intro();
      while (!result) {
        const act = await chooseAction();
        result = await turn(act);
      }
      await finish(result);
    } catch (err) {
      console.error(err);
      result = result || 'run';
    }
    // Aufräumen
    for (const m of s.party) for (const k of ['evoPending']) delete m[k];
    await FC.ui.fade(true, false, 300);
    ui.root.classList.add('hidden');
    FC.input.pop(layer);
    const r = result, tr = B.trainer;
    B = null;
    FC.mode = 'world';
    U.$('controls').classList.remove('hidden'); U.$('hud').classList.remove('hidden');
    FC.audio.play(FC.world.map.def.music || 'town');
    if (r === 'lose') {
      if (tr && tr.noBlackout) { FC.game.healParty(); await FC.ui.fade(false, false, 300); }
      else await FC.game.blackout();
    } else {
      await FC.ui.fade(false, false, 300);
      FC.game.autosave();
    }
    return r;
  }

  return { start, render, update, initUi, learnMove, get active() { return !!B; } };
})();

</script>
<script>
'use strict';
/* Menüs: Pausemenü, Team, Tasche, Bestiarium, Karte, Speichern, Optionen, Laden, PC-Box */
FC.menu = (function () {
  const U = FC.U, D = FC.data, G = FC.gfx, M = FC.mon;
  const S = () => FC.state;
  let layer = null, onClose = null;

  function openLayer(back) {
    if (layer) FC.input.pop(layer);
    layer = FC.input.push({ name: 'menu', onB: back, onStart: close, onA() {}, onDir() {} });
  }
  function close() {
    if (layer) FC.input.pop(layer);
    layer = null;
    FC.ui.closePanel();
    FC.audio.sfx('back');
    if (onClose) { const f = onClose; onClose = null; f(); }
  }

  function icon(kind) {
    const c = G.canvas(16, 16), x = c.getContext('2d');
    const r = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
    switch (kind) {
      case 'team': G.capsule(x, 8, 8, '#e8603a'); break;
      case 'bag': r(3, 5, 10, 9, '#c8803a'); r(3, 5, 10, 2, '#a05a2a'); r(6, 2, 4, 1, '#7a4a2a'); r(5, 3, 1, 2, '#7a4a2a'); r(10, 3, 1, 2, '#7a4a2a'); r(7, 8, 2, 2, '#f0d060'); break;
      case 'dex': r(3, 2, 10, 12, '#d84a4a'); r(4, 3, 8, 10, '#f05a5a'); r(5, 5, 6, 4, '#bfe6fb'); r(6, 11, 2, 1, '#ffe060'); break;
      case 'map': r(2, 3, 12, 10, '#e8dcb0'); r(5, 3, 1, 10, '#c8b880'); r(10, 3, 1, 10, '#c8b880'); r(3, 6, 4, 3, '#7ac05a'); r(8, 8, 4, 2, '#5a9ad8'); r(11, 4, 2, 2, '#e04a4a'); break;
      case 'save': r(3, 2, 10, 12, '#3a5ab0'); r(5, 2, 6, 4, '#e8e8f0'); r(5, 9, 6, 5, '#f4f4f4'); r(9, 3, 1, 2, '#3a5ab0'); break;
      case 'opt': x.fillStyle = '#7a7a8a'; x.beginPath(); x.arc(8, 8, 5.5, 0, Math.PI * 2); x.fill(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; r(Math.round(8 + Math.cos(a) * 6) - 1, Math.round(8 + Math.sin(a) * 6) - 1, 2, 2, '#7a7a8a'); } r(6, 6, 4, 4, '#e8e8f0'); break;
    }
    G.outline(c);
    c.className = 'ic';
    return c;
  }

  /* ───── Hauptmenü ───── */
  function open(cb) {
    onClose = cb || null;
    FC.audio.sfx('select');
    main();
  }
  function main() {
    const s = S();
    const ui = FC.ui.sheet('Menü', { money: true });
    ui.closeBtn.addEventListener('click', close);
    openLayer(close);
    const grid = U.el('div', 'menu-grid');
    const tiles = [
      ['team', 'Team', team, s.party.length > 0],
      ['bag', 'Tasche', () => bag(), true],
      ['dex', 'Bestiarium', dex, !!s.flags.dex],
      ['map', 'Karte', regionMap, true],
      ['save', 'Speichern', saveScreen, true],
      ['opt', 'Optionen', options, true],
    ];
    for (const [ic, label, fn, en] of tiles) {
      const b = U.el('button', 'menu-tile');
      b.appendChild(icon(ic));
      b.appendChild(U.el('span', '', label + (en ? '' : ' <small style="font-weight:400;color:#9a8ea6">(gesperrt)</small>')));
      b.disabled = !en; if (!en) b.style.opacity = 0.55;
      b.addEventListener('click', () => { if (!en) return; FC.audio.sfx('select'); fn(); });
      grid.appendChild(b);
    }
    ui.body.appendChild(grid);
    const info = U.el('div', 'note');
    info.style.marginTop = '12px';
    const caught = Object.keys(s.dex.caught).length;
    info.innerHTML = `<b>${U.esc(s.player.name)}</b> · Orden: ${s.flags.badge1 ? 'Felsorden' : 'keine'} · Bestiarium: ${caught}/${D.DEX_MAX} · Spielzeit ${U.fmtTime(s.playtime || 0)}<br>Ort: ${U.esc(FC.world.map.def.name)}`;
    ui.body.appendChild(info);
  }
  function backBtn(ui, to) { ui.closeBtn.textContent = '←'; ui.closeBtn.setAttribute('aria-label', 'Zurück'); ui.closeBtn.addEventListener('click', () => { FC.audio.sfx('back'); to(); }); openLayer(() => { FC.audio.sfx('back'); to(); }); }

  /* ───── Team ───── */
  function monRow(m, i, extra) {
    const max = M.maxHp(m), r = m.hp / max;
    const row = U.el('button', 'row-card' + (i === 0 ? ' lead' : '') + (m.hp <= 0 ? ' fainted' : ''),
      `<div class="grow"><div class="t1"><span>${U.esc(M.name(m))}</span><span>Lv. ${m.lvl}</span></div>
       <div class="t2">${M.types(m).map(D.typeChip).join('')} ${m.hp}/${max} KP${m.status ? ' · ' + D.STATUS[m.status].n : ''}${extra || ''}</div>
       <div class="mini-hp"><i class="${r <= 0.2 ? 'low' : r <= 0.5 ? 'mid' : ''}" style="width:${(r * 100).toFixed(0)}%"></i></div></div>`);
    row.prepend(FC.ui.monCanvas(m.sp));
    return row;
  }
  function team() {
    const s = S();
    const ui = FC.ui.sheet('Team');
    backBtn(ui, main);
    const list = U.el('div', 'list');
    s.party.forEach((m, i) => {
      const row = monRow(m, i);
      row.addEventListener('click', () => { FC.audio.sfx('select'); monDetail(m, team); });
      list.appendChild(row);
    });
    ui.body.appendChild(list);
    ui.body.appendChild(U.el('div', 'note', 'Tippe auf ein Monster für Details. Das oberste Monster kämpft zuerst.'));
    ui.body.lastChild.style.marginTop = '10px';
  }
  function monDetail(m, back) {
    const s = S(), sp = M.sp(m), st = M.stats(m);
    const ui = FC.ui.sheet(M.name(m));
    backBtn(ui, back);
    const wrap = U.el('div', 'detail');
    const cv = FC.ui.monCanvas(m.sp);
    wrap.appendChild(cv);
    const next = m.lvl < 100 ? M.expFor(m.lvl + 1) - m.exp : 0;
    const info = U.el('div', '', `<div style="font-size:20px;font-weight:700">${U.esc(sp.n)} · Lv. ${m.lvl}</div>
      <div style="margin:6px 0">${sp.t.map(D.typeChip).join('')}</div>
      <div style="font-size:15px"><b>Fähigkeit:</b> ${D.ABILITIES[sp.ab].n} – ${D.ABILITIES[sp.ab].d}</div>
      <div style="font-size:14px;color:#5a4e66;margin-top:4px">Noch ${next} EP bis Level ${m.lvl + 1}${sp.evo ? ` · Entwickelt sich ab Lv. ${sp.evo.lvl}` : ''}</div>`);
    wrap.appendChild(info);
    ui.body.appendChild(wrap);
    const tbl = U.el('table', 'stat-table');
    tbl.innerHTML = [['KP', `${m.hp} / ${st.hp}`], ['Angriff', st.atk], ['Verteidigung', st.def], ['Sp.-Angriff', st.spa], ['Sp.-Verteidigung', st.spd], ['Initiative', st.spe]]
      .map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('');
    tbl.style.marginTop = '10px';
    ui.body.appendChild(tbl);
    const ml = U.el('div', 'move-list');
    for (const mv of m.moves) {
      const d = D.MOVES[mv.id];
      ml.appendChild(U.el('div', 'move-pill', `${d.n}<small>${D.TYPES[d.t].n} · ${d.c === 'status' ? 'Status' : 'Stärke ' + d.p} · AP ${mv.pp}/${d.pp}</small>`)).style.background = D.TYPES[d.t].c;
    }
    ui.body.appendChild(ml);
    const row = U.el('div', 'btn-row');
    const idx = s.party.indexOf(m);
    if (idx > 0) {
      const lead = U.el('button', 'btn primary', 'An die Spitze');
      lead.addEventListener('click', () => { s.party.splice(idx, 1); s.party.unshift(m); FC.ui.toast(`${M.name(m)} kämpft jetzt zuerst.`); FC.audio.sfx('select'); team(); });
      row.appendChild(lead);
    }
    if (idx >= 0) {
      const heal = U.el('button', 'btn', 'Gegenstand benutzen');
      heal.addEventListener('click', () => bag(m, () => monDetail(m, back)));
      row.appendChild(heal);
    }
    ui.body.appendChild(row);
  }

  /* ───── Tasche ───── */
  function usable(k, m) {
    const it = D.ITEMS[k];
    if (it.kind === 'heal') return m.hp > 0 && m.hp < M.maxHp(m);
    if (it.kind === 'cure') return m.hp > 0 && !!m.status && (it.cure === 'all' || it.cure === m.status);
    if (it.kind === 'revive') return m.hp <= 0;
    return false;
  }
  function applyItem(k, m) {
    const s = S(), it = D.ITEMS[k];
    s.bag[k]--;
    if (it.kind === 'heal') { const before = m.hp; m.hp = Math.min(M.maxHp(m), m.hp + it.heal); FC.ui.toast(`${M.name(m)} wurde um ${m.hp - before} KP geheilt.`); }
    if (it.kind === 'cure') { m.status = null; m.slp = 0; FC.ui.toast(`${M.name(m)} ist wieder gesund.`); }
    if (it.kind === 'revive') { m.hp = Math.floor(M.maxHp(m) / 2); FC.ui.toast(`${M.name(m)} ist wieder bei Bewusstsein!`); }
    FC.audio.sfx('heal');
  }
  function bag(target, back) {
    const s = S();
    back = back || main;
    const ui = FC.ui.sheet(target ? `Tasche → ${M.name(target)}` : 'Tasche', { money: true });
    backBtn(ui, back);
    const list = U.el('div', 'list');
    const keys = Object.keys(D.ITEMS).filter(k => s.bag[k] > 0);
    if (!keys.length) list.appendChild(U.el('div', 'note', 'Deine Tasche ist leer.'));
    for (const k of keys) {
      const it = D.ITEMS[k];
      const row = U.el('button', 'row-card', `<canvas width="16" height="16"></canvas><div class="grow"><div class="t1"><span>${it.n}</span><span>× ${s.bag[k]}</span></div><div class="t2">${it.d}</div></div>`);
      const c = row.querySelector('canvas'); c.style.width = '40px'; c.style.height = '40px';
      G.capsule(c.getContext('2d'), 8, 8, it.c);
      row.addEventListener('click', () => {
        if (it.kind === 'ball') { FC.ui.toast('Fangkapseln kannst du nur im Kampf gegen wilde Monster einsetzen.'); return; }
        if (target) {
          if (!usable(k, target)) { FC.ui.toast('Das hätte keine Wirkung.'); return; }
          applyItem(k, target); bag(target, back); return;
        }
        pickTarget(k);
      });
      list.appendChild(row);
    }
    ui.body.appendChild(list);
  }
  function pickTarget(k) {
    const s = S();
    const ui = FC.ui.sheet(`${D.ITEMS[k].n} → auf wen?`);
    backBtn(ui, () => bag());
    const list = U.el('div', 'list');
    s.party.forEach((m, i) => {
      const row = monRow(m, i);
      row.addEventListener('click', () => {
        if (!usable(k, m)) { FC.ui.toast('Das hätte keine Wirkung.'); return; }
        applyItem(k, m);
        if (s.bag[k] > 0) pickTarget(k); else bag();
      });
      list.appendChild(row);
    });
    ui.body.appendChild(list);
  }

  /* ───── Bestiarium ───── */
  function dex() {
    const s = S();
    const ui = FC.ui.sheet(`Bestiarium · ${Object.keys(s.dex.caught).length}/${D.DEX_MAX}`);
    backBtn(ui, main);
    const grid = U.el('div', 'dex-grid');
    for (let i = 1; i <= D.DEX_MAX; i++) {
      const sp = D.MON[i], c = s.dex.caught[i], sn = s.dex.seen[i];
      const cell = U.el('button', 'dex-cell' + (sn ? '' : ' unseen'));
      if (sn) cell.appendChild(FC.ui.monCanvas(i, 64, !c));
      else { const ph = U.el('div', '', '?'); Object.assign(ph.style, { height: '64px', fontSize: '34px', lineHeight: '64px' }); cell.appendChild(ph); }
      cell.appendChild(U.el('div', '', `#${String(i).padStart(3, '0')} ${sn ? U.esc(sp.n) : '???'}`));
      if (c) cell.addEventListener('click', () => dexEntry(i));
      grid.appendChild(cell);
    }
    ui.body.appendChild(grid);
    ui.body.appendChild(U.el('div', 'note', 'Gesehene Monster erscheinen als Schatten. Fange sie, um alle Daten freizuschalten.')).style.marginTop = '10px';
  }
  function dexEntry(i) {
    const sp = D.MON[i];
    const ui = FC.ui.sheet(`#${String(i).padStart(3, '0')} ${sp.n}`);
    backBtn(ui, dex);
    const wrap = U.el('div', 'detail');
    wrap.appendChild(FC.ui.monCanvas(i));
    wrap.appendChild(U.el('div', '', `<div style="margin-bottom:6px">${sp.t.map(D.typeChip).join('')}</div><div style="font-size:16px;line-height:1.4">${U.esc(sp.dex)}</div><div style="font-size:14px;color:#5a4e66;margin-top:6px">Fähigkeit: ${D.ABILITIES[sp.ab].n}${sp.evo ? ` · Entwicklung ab Lv. ${sp.evo.lvl} → ${D.MON[sp.evo.to].n}` : ''}</div>`));
    ui.body.appendChild(wrap);
    const names = ['KP', 'Angriff', 'Verteidigung', 'Sp.-Angriff', 'Sp.-Verteidigung', 'Initiative'];
    const tbl = U.el('table', 'stat-table');
    tbl.style.marginTop = '10px';
    tbl.innerHTML = sp.b.map((v, k) => `<tr><td>${names[k]}</td><td><span style="display:inline-block;height:8px;width:${Math.round(v * 0.9)}px;background:${v > 80 ? '#4cc05a' : v > 50 ? '#f2c62e' : '#e8804a'};border-radius:4px;margin-right:6px"></span>${v}</td></tr>`).join('');
    ui.body.appendChild(tbl);
  }

  /* ───── Karte ───── */
  function regionMap() {
    const R = D.REGION;
    const ui = FC.ui.sheet('Karte');
    backBtn(ui, main);
    const c = G.canvas(200, 140), x = c.getContext('2d');
    const r = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
    r(0, 0, 200, 140, '#7cc4f4');
    for (let i = 0; i < 40; i++) r((i * 37) % 200, (i * 23) % 140, 6, 1, '#a8dcff');
    // Landmasse
    x.fillStyle = '#8ad060'; x.beginPath(); x.ellipse(70, 72, 62, 58, 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#b8b0a0'; x.beginPath(); x.ellipse(40, 22, 26, 16, 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#5aa850'; x.beginPath(); x.ellipse(150, 70, 36, 46, 0, 0, Math.PI * 2); x.fill();
    const pos = n => [40 + n.x * 30, 22 + n.y * 24];
    // Wege
    x.strokeStyle = '#e8d090'; x.lineWidth = 4;
    x.beginPath(); const a = pos(R.nodes[0]), b = pos(R.nodes[2]); x.moveTo(a[0] + 30 - 30, a[1]); x.lineTo(b[0], b[1]); x.stroke();
    x.setLineDash([3, 3]); x.strokeStyle = 'rgba(255,255,255,.6)'; x.lineWidth = 2;
    for (const f of R.future) { const p = pos(f); x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(p[0], p[1]); x.stroke(); }
    x.setLineDash([]);
    const cur = FC.world.map.def.region;
    for (const n of R.nodes) {
      const [px, py] = pos(n);
      r(px - 5, py - 5, 10, 10, '#1c1626'); r(px - 4, py - 4, 8, 8, n.id === 'route1' ? '#e8d090' : '#f05a3a');
      if (cur && cur[0] === n.x && cur[1] === n.y) { r(px - 2, py - 13, 4, 6, '#ffffff'); r(px - 3, py - 8, 6, 1, '#ffffff'); }
    }
    for (const f of R.future) { const [px, py] = pos(f); r(px - 4, py - 4, 8, 8, '#1c1626'); r(px - 3, py - 3, 6, 6, '#8a8a9a'); }
    c.className = 'region-map';
    ui.body.appendChild(c);
    const legend = U.el('div', 'list');
    legend.style.marginTop = '10px';
    legend.innerHTML = `<div class="note"><b>${R.name}</b><br>Aktueller Ort: <b>${U.esc(FC.world.map.def.name)}</b><br>Freigeschaltet: ${R.nodes.map(n => n.label).join(' · ')}<br>Noch unerforscht: ${R.future.map(f => f.label).join(' · ')} (folgen in kommenden Versionen)</div>`;
    ui.body.appendChild(legend);
  }

  /* ───── Speichern ───── */
  function saveScreen() {
    const ui = FC.ui.sheet('Speichern');
    backBtn(ui, main);
    if (!FC.save.available()) ui.body.appendChild(U.el('div', 'note warn', 'Der Browser blockiert lokalen Speicher (z. B. im privaten Modus). Nutze den Export-Code unter „Optionen“, um deinen Fortschritt zu sichern.'));
    const list = U.el('div', 'list');
    const slots = FC.save.list();
    slots.forEach((sl, i) => {
      const n = i + 1;
      const row = U.el('button', 'row-card slot-card' + (FC.slot === n ? ' lead' : ''),
        `<div class="grow"><div class="t1"><span>Platz ${n}${FC.slot === n ? ' (aktuell)' : ''}</span><span>${sl && !sl.broken ? U.fmtTime(sl.time) : ''}</span></div>
         <div class="t2">${sl ? (sl.broken ? 'Beschädigt' : `${U.esc(sl.name)} · ${sl.badges} Orden · ${sl.caught} gefangen · ${new Date(sl.saved).toLocaleString('de-DE')}`) : 'Leer'}</div></div>`);
      row.addEventListener('click', async () => {
        if (sl && FC.slot !== n) {
          FC.input.pop(layer); FC.ui.closePanel(); layer = null;
          const ok = await FC.ui.yesNo(`Platz ${n} enthält bereits einen Spielstand. Überschreiben?`);
          if (!ok) { saveScreen(); return; }
        }
        FC.slot = n;
        FC.world.syncPlayer();
        const ok = FC.save.write(n, S());
        if (ok) { FC.save.setLastSlot(n); FC.audio.sfx('save'); FC.ui.toast(`Gespeichert auf Platz ${n}.`); }
        else FC.ui.toast('Speichern fehlgeschlagen – nutze den Export-Code.');
        saveScreen();
      });
      list.appendChild(row);
    });
    ui.body.appendChild(list);
    const n = U.el('div', 'note', 'Das Spiel speichert automatisch bei jedem Kartenwechsel und nach jedem Kampf. <br><b>Wichtig für iPhone:</b> Safari kann Website-Daten löschen, wenn du die Seite länger nicht öffnest oder den Verlauf leerst. Sichere wichtige Spielstände zusätzlich über <b>Optionen → Export-Code</b>.');
    n.style.marginTop = '10px';
    ui.body.appendChild(n);
  }

  /* ───── Optionen ───── */
  function options(fromTitle) {
    const st = FC.settings;
    const ui = FC.ui.sheet('Optionen');
    if (fromTitle === true) { ui.closeBtn.addEventListener('click', close); openLayer(close); }
    else backBtn(ui, main);
    const mk = (label, key) => {
      const row = U.el('div', 'slider-row', `<label>${label}</label>`);
      const inp = U.el('input'); inp.type = 'range'; inp.min = 0; inp.max = 1; inp.step = 0.05; inp.value = st[key];
      const val = U.el('span', '', Math.round(st[key] * 100) + '%'); val.style.width = '48px';
      inp.addEventListener('input', () => { st[key] = +inp.value; FC.audio.setVolume(key, st[key]); val.textContent = Math.round(st[key] * 100) + '%'; FC.save.saveSettings(st); });
      inp.addEventListener('change', () => FC.audio.sfx('blip'));
      row.appendChild(inp); row.appendChild(val);
      return row;
    };
    ui.body.appendChild(mk('Musik', 'music'));
    ui.body.appendChild(mk('Effekte', 'sfx'));
    const ts = U.el('div', 'slider-row', '<label>Text</label>');
    const tg = U.el('div', 'btn-row'); tg.style.margin = '0';
    ['Langsam', 'Normal', 'Schnell'].forEach((l, i) => {
      const b = U.el('button', 'btn' + (st.textSpeed === i + 1 ? ' primary' : ''), l);
      b.style.minHeight = '44px'; b.style.padding = '8px 12px';
      b.addEventListener('click', () => { st.textSpeed = i + 1; FC.save.saveSettings(st); options(fromTitle); });
      tg.appendChild(b);
    });
    ts.appendChild(tg); ui.body.appendChild(ts);

    if (FC.state) {
      ui.body.appendChild(U.el('h3', '', 'Spielstand exportieren'));
      const ta = U.el('textarea', 'code'); ta.readOnly = true; ta.value = FC.save.exportCode(S());
      const cp = U.el('button', 'btn blue', 'Code kopieren');
      cp.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(ta.value); FC.ui.toast('Code kopiert! Bewahre ihn z. B. in Notizen auf.'); }
        catch (e) { ta.focus(); ta.select(); FC.ui.toast('Bitte Text markieren und kopieren.'); }
      });
      ui.body.appendChild(ta);
      const r = U.el('div', 'btn-row'); r.appendChild(cp); ui.body.appendChild(r);
    }
    ui.body.appendChild(U.el('h3', '', 'Spielstand importieren'));
    const ti = U.el('textarea', 'code'); ti.placeholder = 'Export-Code hier einfügen (beginnt mit AUR1:)';
    const im = U.el('button', 'btn', 'Code laden');
    im.addEventListener('click', () => {
      try {
        const s = FC.save.importCode(ti.value);
        const slot = FC.slot || 1;
        FC.save.write(slot, s); FC.save.setLastSlot(slot);
        FC.ui.toast('Import erfolgreich! Lade Spielstand …');
        setTimeout(() => location.reload(), 700);
      } catch (e) { FC.ui.toast('Import fehlgeschlagen: ' + e.message); }
    });
    ui.body.appendChild(ti);
    const r2 = U.el('div', 'btn-row'); r2.appendChild(im);
    if (FC.state) {
      const tt = U.el('button', 'btn', 'Zum Titelbildschirm');
      tt.addEventListener('click', () => { FC.game.autosave(); location.reload(); });
      r2.appendChild(tt);
    }
    ui.body.appendChild(r2);
    const v = U.el('div', 'note', `Version ${FC.VERSION} · Spielstand-Format v${FC.SAVE_VERSION}. Steuerung: Steuerkreuz bewegen · A sprechen/bestätigen · B gedrückt halten = rennen / zurück · Antippen = hinlaufen.`);
    v.style.marginTop = '12px';
    ui.body.appendChild(v);
  }

  /* ───── Laden (Shop) ───── */
  function shop() {
    return new Promise(resolve => {
      onClose = resolve;
      const render = () => {
        const s = S();
        const ui = FC.ui.sheet('Laden', { money: true });
        ui.closeBtn.addEventListener('click', close);
        openLayer(close);
        const list = U.el('div', 'list');
        for (const k of D.SHOP(s)) {
          const it = D.ITEMS[k];
          const row = U.el('button', 'row-card', `<canvas width="16" height="16"></canvas><div class="grow"><div class="t1"><span>${it.n}</span><span>${U.money(it.price)}</span></div><div class="t2">${it.d} · im Besitz: ${s.bag[k] || 0}</div></div>`);
          const c = row.querySelector('canvas'); c.style.width = '40px'; c.style.height = '40px';
          G.capsule(c.getContext('2d'), 8, 8, it.c);
          row.addEventListener('click', () => qty(k));
          list.appendChild(row);
        }
        ui.body.appendChild(list);
        if (!s.flags.badge1) ui.body.appendChild(U.el('div', 'note', 'Mit dem ersten Orden gibt es hier mehr Auswahl!')).style.marginTop = '10px';
      };
      const qty = k => {
        const s = S(), it = D.ITEMS[k];
        const max = Math.min(99, Math.floor(s.money / it.price));
        if (max < 1) { FC.ui.toast('Dafür reicht dein Geld nicht.'); return; }
        let n = 1;
        const ui = FC.ui.sheet(`${it.n} kaufen`, { money: true });
        ui.closeBtn.addEventListener('click', () => render());
        openLayer(() => render());
        const q = U.el('div', 'qty');
        const minus = U.el('button', 'btn', '–'), plus = U.el('button', 'btn', '+'), lab = U.el('span', '', '');
        const upd = () => { lab.innerHTML = `<b>${n}</b> × = ${U.money(n * it.price)}`; };
        minus.addEventListener('click', () => { n = Math.max(1, n - 1); upd(); FC.audio.sfx('blip'); });
        plus.addEventListener('click', () => { n = Math.min(max, n + 1); upd(); FC.audio.sfx('blip'); });
        q.appendChild(minus); q.appendChild(lab); q.appendChild(plus); upd();
        ui.body.appendChild(q);
        const row = U.el('div', 'btn-row'); row.style.justifyContent = 'center';
        const buy = U.el('button', 'btn primary', 'Kaufen');
        buy.addEventListener('click', () => {
          s.money -= n * it.price; s.bag[k] = (s.bag[k] || 0) + n;
          let bonus = '';
          if (k === 'kapsel' && n >= 10) { s.bag.superkapsel = (s.bag.superkapsel || 0) + 1; bonus = ' Als Dankeschön gibt es eine Superkapsel dazu!'; }
          FC.audio.sfx('save'); FC.ui.toast(`Danke für deinen Einkauf!${bonus}`, 2600);
          render();
        });
        row.appendChild(buy); ui.body.appendChild(row);
      };
      render();
    });
  }

  /* ───── PC-Box ───── */
  function pc() {
    return new Promise(resolve => {
      onClose = resolve;
      FC.audio.sfx('select');
      const render = () => {
        const s = S();
        const ui = FC.ui.sheet(`PC-Box · ${s.box.length} Monster`);
        ui.closeBtn.addEventListener('click', close);
        openLayer(close);
        ui.body.appendChild(U.el('h3', '', `Team (${s.party.length}/6) – antippen zum Ablegen`));
        const l1 = U.el('div', 'list');
        s.party.forEach((m, i) => {
          const row = monRow(m, i);
          row.addEventListener('click', () => {
            if (s.party.length <= 1) { FC.ui.toast('Du brauchst mindestens ein Monster im Team.'); return; }
            if (s.party.filter(x => x !== m && x.hp > 0).length === 0) { FC.ui.toast('Mindestens ein kampffähiges Monster muss im Team bleiben.'); return; }
            s.party.splice(i, 1); FC.mon.heal(m); s.box.push(m); FC.audio.sfx('blip'); render();
          });
          l1.appendChild(row);
        });
        ui.body.appendChild(l1);
        ui.body.appendChild(U.el('h3', '', 'Box – antippen zum Mitnehmen'));
        const l2 = U.el('div', 'list');
        if (!s.box.length) l2.appendChild(U.el('div', 'note', 'Die Box ist leer. Gefangene Monster landen hier, wenn dein Team voll ist.'));
        s.box.forEach((m, i) => {
          const row = monRow(m, 1);
          row.addEventListener('click', () => {
            if (s.party.length >= 6) { FC.ui.toast('Dein Team ist voll (6 Monster).'); return; }
            s.box.splice(i, 1); s.party.push(m); FC.audio.sfx('blip'); render();
          });
          l2.appendChild(row);
        });
        ui.body.appendChild(l2);
        ui.body.appendChild(U.el('div', 'note', 'Monster in der Box werden automatisch vollständig geheilt.')).style.marginTop = '10px';
      };
      render();
    });
  }

  return { open, close, shop, pc, options, team };
})();

</script>
<script>
'use strict';
/* Start: Bildschirmgröße, Spiel-Loop, Titelbildschirm, Neues Spiel / Fortsetzen */
(function () {
  const U = FC.U;
  const canvas = U.$('screen');
  const ctx = canvas.getContext('2d', { alpha: false });
  FC.view = { cw: 0, ch: 0, dpr: 1, scale: 1, w: 0, h: 0 };
  FC.settings = FC.save.loadSettings();
  FC.audio.setVolume('music', FC.settings.music);
  FC.audio.setVolume('sfx', FC.settings.sfx);

  function resize() {
    const v = FC.view;
    v.dpr = Math.min(3, window.devicePixelRatio || 1);
    v.cw = window.innerWidth; v.ch = window.innerHeight;
    canvas.width = Math.round(v.cw * v.dpr);
    canvas.height = Math.round(v.ch * v.dpr);
    v.scale = Math.max(1, Math.floor(Math.min(canvas.width, canvas.height) / (16 * 9.5)));
    v.w = Math.ceil(canvas.width / v.scale);
    v.h = Math.ceil(canvas.height / v.scale);
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // Fehler sichtbar machen (hilfreich beim Testen auf dem Handy)
  window.addEventListener('error', e => { try { FC.ui.toast('Fehler: ' + (e.message || e), 5000); } catch (_) {} });
  window.addEventListener('unhandledrejection', e => { try { FC.ui.toast('Fehler: ' + ((e.reason && e.reason.message) || e.reason), 5000); } catch (_) {} });

  /* ───── Titel-Hintergrund ───── */
  const title = { t: 0, mons: [1, 4, 7, 17, 23, 26].map((sp, i) => ({ sp, x: i * 70, ph: i * 1.3 })) };
  function renderTitle(dt) {
    title.t += dt;
    const v = FC.view;
    const s = Math.max(1, Math.floor(Math.min(canvas.width, canvas.height) / 220));
    const W = Math.ceil(canvas.width / s), H = Math.ceil(canvas.height / s);
    ctx.setTransform(s, 0, 0, s, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2a1a4a'); g.addColorStop(0.55, '#e8705a'); g.addColorStop(0.75, '#f8c070');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff4c0'; ctx.beginPath(); ctx.arc(W * 0.78, H * 0.62, 26, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 40; i++) { if ((title.t / 400 + i) % 5 > 1) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect((i * 97) % W, (i * 31) % Math.floor(H * 0.4), 1, 1); } }
    // Hügel
    for (const [base, col, amp, sp] of [[0.72, '#3a5a4a', 14, 0.01], [0.8, '#2a4a3a', 10, 0.02], [0.88, '#1c3428', 6, 0.035]]) {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 4) ctx.lineTo(x, H * base + Math.sin((x + title.t * sp) / 40) * amp);
      ctx.lineTo(W, H); ctx.fill();
    }
    // Monster laufen über den Horizont
    for (const m of title.mons) {
      m.x += dt * 0.02;
      if (m.x > W + 40) m.x = -70 - Math.random() * 60;
      const y = H * 0.88 - 56 + Math.abs(Math.sin(title.t / 260 + m.ph)) * -6;
      ctx.drawImage(FC.gfx.monster(m.sp), Math.round(m.x), Math.round(y));
    }
  }

  /* ───── Spiel-Loop ───── */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    FC.anim.update(dt);
    if (FC.mode === 'world') {
      FC.world.update(dt);
      ctx.setTransform(FC.view.scale, 0, 0, FC.view.scale, 0, 0);
      ctx.imageSmoothingEnabled = false;
      FC.world.render(ctx, FC.view.w, FC.view.h);
    } else if (FC.mode === 'battle') {
      FC.battle.update(dt);
      FC.battle.render(ctx);
    } else if (FC.mode === 'title') {
      renderTitle(dt);
    } else {
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#120e1c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    requestAnimationFrame(frame);
  }

  /* ───── Titelbildschirm ───── */
  function showTitle() {
    FC.mode = 'title';
    const t = U.$('title');
    t.classList.remove('hidden');
    t.innerHTML = '';
    const logo = U.el('div', 'logo', '<h1>AURELIA</h1><p>MONSTER · CHRONIKEN</p>');
    t.appendChild(logo);
    const box = U.el('div', 'title-box');
    const slots = FC.save.list();
    const lastSlot = FC.save.lastSlot();
    let cont = null;
    if (lastSlot && slots[lastSlot - 1] && !slots[lastSlot - 1].broken) cont = lastSlot;
    else { const i = slots.findIndex(s => s && !s.broken); if (i >= 0) cont = i + 1; }
    if (cont) {
      const sl = slots[cont - 1];
      const b = U.el('button', 'btn primary', `Fortsetzen<br><small style="font-weight:400;font-size:14px">${U.esc(sl.name)} · ${sl.badges} Orden · ${sl.caught} gefangen · ${U.fmtTime(sl.time)}</small>`);
      b.addEventListener('click', () => continueGame(cont));
      box.appendChild(b);
    }
    const nb = U.el('button', 'btn' + (cont ? '' : ' primary'), 'Neues Spiel');
    nb.addEventListener('click', () => newGameSlot());
    box.appendChild(nb);
    if (slots.some(s => s)) {
      const lb = U.el('button', 'btn', 'Spielstand wählen');
      lb.addEventListener('click', () => slotPicker('load'));
      box.appendChild(lb);
    }
    const ob = U.el('button', 'btn', 'Optionen & Import');
    ob.addEventListener('click', () => { FC.menu.options(true); });
    box.appendChild(ob);
    if (!FC.save.available()) box.appendChild(U.el('div', 'note warn', 'Achtung: Dein Browser erlaubt keinen lokalen Speicher (privater Modus?). Fortschritt geht beim Schließen verloren – nutze den Export-Code.'));
    t.appendChild(box);
    t.appendChild(U.el('div', 'tap-hint', 'Tippe für Ton'));
    t.appendChild(U.el('div', 'version', `v${FC.VERSION} · Ein Fan-Monsterabenteuer mit eigenen Kreaturen`));
    const unlock = () => { FC.audio.unlock(); FC.audio.play('title'); const h = t.querySelector('.tap-hint'); if (h) h.remove(); };
    t.addEventListener('pointerdown', unlock, { once: true });
    FC.audio.play('title');
  }

  function slotPicker(mode) {
    const ui = FC.ui.sheet(mode === 'load' ? 'Spielstand wählen' : 'Speicherplatz für neues Spiel');
    const layer = FC.input.push({ onB: done, onA() {}, onStart: done });
    function done() { FC.input.pop(layer); FC.ui.closePanel(); }
    ui.closeBtn.addEventListener('click', done);
    const list = U.el('div', 'list');
    FC.save.list().forEach((sl, i) => {
      const n = i + 1;
      const row = U.el('div', 'row-card slot-card');
      row.innerHTML = `<div class="grow"><div class="t1"><span>Platz ${n}</span><span>${sl && !sl.broken ? U.fmtTime(sl.time) : ''}</span></div><div class="t2">${sl ? (sl.broken ? 'Beschädigt' : `${U.esc(sl.name)} · ${sl.badges} Orden · ${sl.caught} gefangen · ${U.esc((FC.data.MAPS[sl.map] || {}).name || '')}`) : 'Leer'}</div></div>`;
      const act = U.el('button', 'btn primary', mode === 'load' ? 'Laden' : (sl ? 'Überschreiben' : 'Hier starten'));
      act.disabled = mode === 'load' && (!sl || sl.broken);
      act.addEventListener('click', async () => {
        if (mode === 'load') { done(); continueGame(n); return; }
        if (sl && !act.dataset.sure) { act.dataset.sure = '1'; act.textContent = 'Sicher? Nochmal tippen'; return; }
        done(); startNew(n);
      });
      row.appendChild(act);
      if (sl && mode === 'load') {
        const del = U.el('button', 'btn', 'Löschen');
        del.addEventListener('click', () => { if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = 'Wirklich löschen?'; return; } FC.save.remove(n); done(); showTitle(); });
        row.appendChild(del);
      }
      list.appendChild(row);
    });
    ui.body.appendChild(list);
  }
  function newGameSlot() {
    FC.audio.unlock();
    const slots = FC.save.list();
    const free = slots.findIndex(s => !s);
    if (free >= 0 && !slots.some(s => s)) { startNew(free + 1); return; }
    slotPicker('new');
  }

  async function enterWorld(state, slot, isNew) {
    FC.state = state; FC.slot = slot;
    FC.save.setLastSlot(slot);
    U.$('title').classList.add('hidden');
    FC.input.clear();
    FC.input.push(FC.world.layer);
    await FC.ui.fade(true, false, 250);
    if (isNew) {
      FC.mode = 'intro';
      FC.audio.play('indoor');
      await FC.ui.fade(false, false, 200);
      await FC.game.intro();
      await FC.ui.fade(true, false, 300);
    }
    FC.mode = 'world';
    const p = state.player;
    FC.world.load(p.map, p.x, p.y, p.dir);
    U.$('hud').classList.remove('hidden');
    U.$('controls').classList.remove('hidden');
    await FC.ui.fade(false, false, 400);
    if (isNew) {
      FC.game.autosave();
      FC.ui.toast('Tipp: Steuerkreuz zum Laufen, A zum Sprechen – oder einfach irgendwo hintippen!', 4200);
    } else FC.ui.toast(`Willkommen zurück, ${p.name}!`);
  }
  function startNew(slot) {
    FC.audio.unlock();
    enterWorld(FC.game.newState('Alex'), slot, true);
  }
  function continueGame(slot) {
    FC.audio.unlock();
    const s = FC.save.load(slot);
    if (!s) { FC.ui.toast('Spielstand konnte nicht geladen werden.'); return; }
    if (!FC.data.MAPS[s.player.map]) { s.player.map = 'morgentau'; s.player.x = 9; s.player.y = 5; }
    enterWorld(s, slot, false);
  }

  // Sicherheitsnetz: beim Verlassen der Seite speichern
  document.addEventListener('visibilitychange', () => { if (document.hidden && FC.state && FC.mode === 'world' && !FC.world.locked) FC.game.autosave(); });
  window.addEventListener('pagehide', () => { if (FC.state && FC.mode === 'world' && !FC.world.locked) FC.game.autosave(); });

  /* ───── Boot ───── */
  function boot() {
    FC.input.bindTouch();
    FC.battle.initUi();
    // Grafiken vorwärmen
    for (let i = 1; i <= FC.data.DEX_MAX; i++) FC.gfx.monster(i);
    U.$('boot').remove();
    showTitle();
    requestAnimationFrame(t => { last = t; frame(t); });
  }
  const ready = () => (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve());
  ready().then(boot);

  // Test-Hilfe (nur für automatisierte Tests)
  FC._debug = { startNew, continueGame, enterWorld };
})();

</script>
</body>
</html>
